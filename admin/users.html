<!DOCTYPE html>
<html lang="en" style="height: auto; min-height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Yareema Datahub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#2563eb', secondary: '#7c3aed', success: '#10b981',
                        warning: '#f59e0b', error: '#ef4444', dark: '#0f172a', light: '#f8fafc'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="flex flex-col lg:flex-row w-full">
        <div id="sidebar-placeholder"></div>
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <div id="header-placeholder"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">User Management</h2>
                            <p class="text-slate-500 text-sm mt-1">Manage accounts, roles, and permissions.</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="showToast('Import feature coming soon', 'info')" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50 transition-colors">
                                <i data-lucide="upload" class="w-4 h-4"></i> Import
                            </button>
                            <button onclick="openModal('addUserModal')" class="flex items-center gap-2 px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors shadow-sm shadow-blue-200">
                                <i data-lucide="plus" class="w-4 h-4"></i> Add User
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-4 items-center">
                        <div class="relative flex-1 min-w-[200px]">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="userSearch" placeholder="Search by name, email, or ID..." class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 w-full">
                        </div>
                        <select id="statusFilter" class="px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-primary/50">
                            <option>All Statuses</option>
                            <option>Active</option>
                            <option>Suspended</option>
                            <option>Pending</option>
                        </select>
                        <select id="roleFilter" class="px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-primary/50">
                            <option>All Roles</option>
                            <option>Admin</option>
                            <option>Staff</option>
                            <option>User</option>
                        </select>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-semibold">
                                        <th class="p-4 w-10"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()" class="rounded border-slate-300"></th>
                                        <th class="p-4">User</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Role</th>
                                        <th class="p-4">Balance</th>
                                        <th class="p-4">Joined</th>
                                        <th class="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    <tr class="hover:bg-slate-50 transition-colors">
                                        <td class="p-4"><input type="checkbox" class="user-checkbox rounded border-slate-300"></td>
                                        <td class="p-4">
                                            <div class="flex items-center gap-3">
                                                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" class="w-10 h-10 rounded-full object-cover" alt="User">
                                                <div>
                                                    <p class="font-medium text-slate-900">James Wilson</p>
                                                    <p class="text-xs text-slate-500">james.w@example.com</p>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="p-4"><span class="px-2 py-1 text-xs font-medium bg-green-100 text-green-700 rounded-full">Active</span></td>
                                        <td class="p-4 text-slate-600">User</td>
                                        <td class="p-4 font-medium text-slate-900">$1,240.50</td>
                                        <td class="p-4 text-slate-500">Oct 24, 2023</td>
                                        <td class="p-4 text-right">
                                            <button onclick="openModal('userDetailModal')" class="text-primary hover:text-blue-700 p-1" title="View Details"><i data-lucide="eye" class="w-5 h-5"></i></button>
                                            <button onclick="openModal('suspendUserModal')" class="text-amber-600 hover:text-amber-700 p-1 ml-2" title="Suspend"><i data-lucide="user-x" class="w-5 h-5"></i></button>
                                        </td>
                                    </tr>
                                    <tr class="hover:bg-slate-50 transition-colors">
                                        <td class="p-4"><input type="checkbox" class="user-checkbox rounded border-slate-300"></td>
                                        <td class="p-4">
                                            <div class="flex items-center gap-3">
                                                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" class="w-10 h-10 rounded-full object-cover" alt="User">
                                                <div>
                                                    <p class="font-medium text-slate-900">Elena Rodriguez</p>
                                                    <p class="text-xs text-slate-500">elena.r@example.com</p>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="p-4"><span class="px-2 py-1 text-xs font-medium bg-amber-100 text-amber-700 rounded-full">Pending</span></td>
                                        <td class="p-4 text-slate-600">VIP</td>
                                        <td class="p-4 font-medium text-slate-900">$450.00</td>
                                        <td class="p-4 text-slate-500">Oct 22, 2023</td>
                                        <td class="p-4 text-right">
                                            <button onclick="openModal('userDetailModal')" class="text-primary hover:text-blue-700 p-1" title="View Details"><i data-lucide="eye" class="w-5 h-5"></i></button>
                                            <button onclick="openModal('suspendUserModal')" class="text-amber-600 hover:text-amber-700 p-1 ml-2" title="Suspend"><i data-lucide="user-x" class="w-5 h-5"></i></button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 border-t border-slate-200 flex items-center justify-between">
                            <p class="text-sm text-slate-500">Showing <span class="font-medium text-slate-900">1-2</span> of <span class="font-medium text-slate-900">2,543</span> users</p>
                            <div class="flex gap-2">
                                <button class="px-3 py-1 border border-slate-200 rounded text-sm text-slate-500 hover:bg-slate-50 disabled:opacity-50" disabled>Previous</button>
                                <button class="px-3 py-1 border border-slate-200 rounded text-sm text-slate-500 hover:bg-slate-50">Next</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="modals-placeholder"></div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const modalsEl = document.getElementById('modals-placeholder');
            if (modalsEl) {
                const response = await fetch('partials/modals.html');
                modalsEl.innerHTML = await response.text();
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
