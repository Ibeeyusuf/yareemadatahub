<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <title>Transactions - Yareema Data Hub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{primary:'#2563eb',secondary:'#7c3aed',success:'#10b981',warning:'#f59e0b',error:'#ef4444',dark:'#0f172a',light:'#f8fafc'}}}}</script>
</head>
<body class="text-slate-800 antialiased">
    <!-- Loading Overlay -->
    <div id="transactions-loader" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 flex items-center gap-3">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
            <span class="text-lg font-medium">Loading transactions...</span>
        </div>
    </div>

    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="w-full">
        <div id="sidebar-placeholder"></div>
        <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
            <div id="header-placeholder"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
                <div class="space-y-6">
                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Transaction History</h2>
                            <p class="text-slate-500 text-sm mt-1">View and manage all platform transactions</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button id="refresh-transactions" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                Refresh
                            </button>
                            <button id="export-transactions-btn" onclick="exportTransactions()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 flex items-center gap-2">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                Export
                            </button>
                        </div>
                    </div>

                    <!-- Statistics Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-medium text-slate-500 uppercase">Total Amount</p>
                            <h3 id="total-amount" class="text-2xl font-bold text-slate-900 mt-1">₦0.00</h3>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-medium text-slate-500 uppercase">Total Fee</p>
                            <h3 id="total-fee" class="text-2xl font-bold text-slate-900 mt-1">₦0.00</h3>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-medium text-slate-500 uppercase">Total Transactions</p>
                            <h3 id="total-transactions-count" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-medium text-slate-500 uppercase">Success Rate</p>
                            <h3 id="success-rate" class="text-2xl font-bold text-slate-900 mt-1">0.00%</h3>
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Search</label>
                                <input type="text" id="transaction-search" placeholder="Search reference..."
                                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Status</label>
                                <select id="status-filter" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                                    <option value="">All Status</option>
                                    <option value="successful">Successful</option>
                                    <option value="failed">Failed</option>
                                    <option value="pending">Pending</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Service Type</label>
                                <select id="service-filter" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                                    <option value="">All Services</option>
                                    <option value="data_recharge">Data Recharge</option>
                                    <option value="airtime_recharge">Airtime Recharge</option>
                                    <option value="fund_wallet">Fund Wallet</option>
                                    <option value="cable_tv">Cable TV</option>
                                    <option value="electricity">Electricity</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Start Date</label>
                                <input type="date" id="start-date"
                                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                            </div>
                        </div>
                    </div>

                    <!-- Transactions Table -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Reference / Date</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">User</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Service / Network</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Phone / Plan</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Amount</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Fee</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-table-body" class="bg-white divide-y divide-slate-200">
                                    <!-- Data loaded via JavaScript -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div id="pagination-container" class="border-t border-slate-200"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/transactions.js"></script>
    <script src="assets/js/main.js"></script>

    <script>

        // ---- PDF export helpers (client-side via jsPDF) ----
        function pdfPrettify(k){ return String(k).replace(/[_-]/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g, function(c){ return c.toUpperCase(); }); }
        function pdfCell(v){
            if (v === null || v === undefined) return '';
            if (typeof v === 'object') {
                return (v.email || v.name || v.reference || v.phoneNumber ||
                        (v.firstName ? (v.firstName + ' ' + (v.lastName||'')).trim() : '') ||
                        JSON.stringify(v)).toString().slice(0, 40);
            }
            var s = String(v);
            if (/^\d{4}-\d{2}-\d{2}T/.test(s)) { try { return new Date(s).toLocaleString(); } catch(e){} }
            return s;
        }
        function pdfExtractRows(json){
            var d = json;
            if (d && !Array.isArray(d)) d = d.data || d.transactions || d.wallets || d.results || d.items || d.records || d.docs || [];
            if (d && !Array.isArray(d) && typeof d === 'object') d = d.data || d.items || d.docs || [];
            return Array.isArray(d) ? d : [];
        }
        function exportRowsToPdf(rows, title, filename, preferred){
            if (!window.jspdf || !window.jspdf.jsPDF) { AdminUtils.showToast('PDF library failed to load. Check your connection.', 'error'); return; }
            var jsPDF = window.jspdf.jsPDF;
            var doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
            doc.setFontSize(16); doc.text(title, 40, 40);
            doc.setFontSize(9); doc.setTextColor(120);
            doc.text('Generated ' + new Date().toLocaleString() + '   |   ' + rows.length + ' record(s)', 40, 56);
            doc.setTextColor(0);
            if (!rows.length) { doc.setFontSize(11); doc.text('No records found for the selected filters.', 40, 90); doc.save(filename); return; }
            var cols = (preferred || []).filter(function(c){ return rows.some(function(r){ return c in r; }); });
            if (!cols.length) cols = Object.keys(rows[0]).slice(0, 8);
            var head = [ cols.map(pdfPrettify) ];
            var body = rows.map(function(r){ return cols.map(function(c){ return pdfCell(r[c]); }); });
            doc.autoTable({ head: head, body: body, startY: 70,
                styles: { fontSize: 8, cellPadding: 4, overflow: 'linebreak' },
                headStyles: { fillColor: [5,150,105], textColor: 255 },
                alternateRowStyles: { fillColor: [245,247,250] },
                margin: { left: 40, right: 40 } });
            doc.save(filename);
        }

        async function exportTransactions() {
            const { value: formValues } = await Swal.fire({
                title: 'Export Transactions',
                html: `
                    <div class="text-left space-y-4 mt-2">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Start Date</label>
                                <input id="exp-start" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">End Date</label>
                                <input id="exp-end" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Status</label>
                            <select id="exp-status" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <option value="">All Statuses</option>
                                <option value="successful">Successful</option>
                                <option value="pending">Pending</option>
                                <option value="failed">Failed</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Transaction Type</label>
                            <select id="exp-type" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <option value="">All Types</option>
                                <option value="airtime_recharge">Airtime Recharge</option>
                                <option value="data_recharge">Data Recharge</option>
                                <option value="recharge_pin">Recharge PIN</option>
                                <option value="fund_wallet">Fund Wallet</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Export PDF',
                confirmButtonColor: '#059669',
                cancelButtonColor: '#6b7280',
                focusConfirm: false,
                customClass: { popup: 'rounded-xl' },
                preConfirm: () => {
                    return {
                        format: 'pdf',
                        startDate: document.getElementById('exp-start').value,
                        endDate: document.getElementById('exp-end').value,
                        status: document.getElementById('exp-status').value,
                        type: document.getElementById('exp-type').value,
                    };
                }
            });

            if (!formValues) return;

            const btn = document.getElementById('export-transactions-btn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
                <path fill="currentColor" d="M4 12a8 8 0 018-8v8z" class="opacity-75"/>
            </svg> Exporting...`;

            try {
                const baseUrl = (typeof API_CONFIG !== 'undefined' ? API_CONFIG.BASE_URL : '') || '';
                const token = localStorage.getItem('admin_token') || sessionStorage.getItem('admin_token');

                // Build query params exactly like: /api/v1/admin/transactions/export?format=csv&startDate=2026-03-1&endDate=2026-04-1&status=successful
                const params = new URLSearchParams();
                const wantPdf = formValues.format === 'pdf';
                params.append('format', wantPdf ? 'json' : formValues.format);
                if (formValues.startDate) params.append('startDate', formValues.startDate);
                if (formValues.endDate)   params.append('endDate', formValues.endDate);
                if (formValues.status)    params.append('status', formValues.status);
                if (formValues.type)      params.append('type', formValues.type);

                const url = `${baseUrl}/api/v1/admin/transactions/export?${params.toString()}`;
                console.log('Export URL:', url);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'text/csv, application/json'
                    }
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || `Export failed (${response.status})`);
                }

                if (wantPdf) {
                    const json = await response.json();
                    const rows = pdfExtractRows(json);
                    exportRowsToPdf(rows, 'Transactions Report', `transactions_export_${new Date().toISOString().split('T')[0]}.pdf`, ['reference','type','amount','status','user','email','phoneNumber','createdAt']);
                    AdminUtils.showToast('Transactions exported as PDF!', 'success');
                } else {
                    const blob = await response.blob();
                    const objectUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = objectUrl;
                    a.download = `transactions_export_${new Date().toISOString().split('T')[0]}.${formValues.format}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(objectUrl);
                    AdminUtils.showToast('Transactions exported successfully!', 'success');
                }
            } catch (error) {
                console.error('Export error:', error);
                AdminUtils.showToast(error.message || 'Export failed. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
