<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Management - Yareema Data Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="w-full">
        <!-- Sidebar -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <main class="lg:ml-64 min-h-screen bg-slate-50 overflow-y-auto">
            <!-- Header -->
            <div id="header-placeholder"></div>

            <!-- Wallet Content -->
            <div class="p-6">
                <!-- Loading Indicator -->
                <div id="wallets-loader" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div class="bg-white p-6 rounded-lg shadow-xl">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                        <p class="mt-4 text-gray-700">Loading wallets...</p>
                    </div>
                </div>

                <!-- Page Header -->
                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-gray-900">Wallet Management</h1>
                    <p class="text-gray-600 mt-1">Manage user wallets, balances, and transactions</p>
                </div>

                <!-- Summary Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-600">Total Balance</p>
                                <h3 id="total-balance" class="text-2xl font-bold text-gray-900 mt-2">₦0.00</h3>
                            </div>
                            <div class="bg-green-100 p-3 rounded-full">
                                <i data-lucide="wallet" class="w-6 h-6 text-green-600"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-600">Average Balance</p>
                                <h3 id="average-balance" class="text-2xl font-bold text-gray-900 mt-2">₦0.00</h3>
                            </div>
                            <div class="bg-blue-100 p-3 rounded-full">
                                <i data-lucide="trending-up" class="w-6 h-6 text-blue-600"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-600">Locked Wallets</p>
                                <h3 id="locked-wallets-count" class="text-2xl font-bold text-gray-900 mt-2">0</h3>
                            </div>
                            <div class="bg-red-100 p-3 rounded-full">
                                <i data-lucide="lock" class="w-6 h-6 text-red-600"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filters and Actions -->
                <div class="bg-white rounded-lg shadow mb-6 p-4">
                    <div class="flex flex-wrap gap-4 items-center">
                        <div class="flex-1 min-w-[200px]">
                            <input 
                                type="text" 
                                id="wallet-search" 
                                placeholder="Search by email or phone..."
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            />
                        </div>
                        <select id="locked-filter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">All Wallets</option>
                            <option value="false">Active Only</option>
                            <option value="true">Locked Only</option>
                        </select>
                        <button id="refresh-wallets" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                            Refresh
                        </button>
                        <button id="export-wallets-btn" onclick="exportWallets()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 flex items-center gap-2">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            Export
                        </button>
                    </div>
                </div>

                <!-- Wallets Table -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">User</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Balance</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Funded</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Spent</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Withdrawn</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Created</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="wallets-table-body" class="bg-white divide-y divide-gray-200">
                                <!-- Wallets will be loaded here by wallets.js -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div id="pagination-container" class="border-t border-gray-200">
                        <!-- Pagination will be rendered here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/wallets.js"></script>
    <script src="assets/js/main.js"></script>

    <script>

        // ---- PDF export helpers (client-side via jsPDF) ----
        function pdfPrettify(k){ return String(k).replace(/[_-]/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g, function(c){ return c.toUpperCase(); }); }
        function pdfCell(v){
            if (v === null || v === undefined) return '';
            if (typeof v === 'object') {
                return (v.email || v.name || v.reference || v.phoneNumber ||
                        (v.firstName ? (v.firstName + ' ' + (v.lastName||'')).trim() : '') ||
                        JSON.stringify(v)).toString().slice(0, 40);
            }
            var s = String(v);
            if (/^\d{4}-\d{2}-\d{2}T/.test(s)) { try { return new Date(s).toLocaleString(); } catch(e){} }
            return s;
        }
        function pdfExtractRows(json){
            var d = json;
            if (d && !Array.isArray(d)) d = d.data || d.transactions || d.wallets || d.results || d.items || d.records || d.docs || [];
            if (d && !Array.isArray(d) && typeof d === 'object') d = d.data || d.items || d.docs || [];
            return Array.isArray(d) ? d : [];
        }
        function exportRowsToPdf(rows, title, filename, preferred){
            if (!window.jspdf || !window.jspdf.jsPDF) { AdminUtils.showToast('PDF library failed to load. Check your connection.', 'error'); return; }
            var jsPDF = window.jspdf.jsPDF;
            var doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
            doc.setFontSize(16); doc.text(title, 40, 40);
            doc.setFontSize(9); doc.setTextColor(120);
            doc.text('Generated ' + new Date().toLocaleString() + '   |   ' + rows.length + ' record(s)', 40, 56);
            doc.setTextColor(0);
            if (!rows.length) { doc.setFontSize(11); doc.text('No records found for the selected filters.', 40, 90); doc.save(filename); return; }
            var cols = (preferred || []).filter(function(c){ return rows.some(function(r){ return c in r; }); });
            if (!cols.length) cols = Object.keys(rows[0]).slice(0, 8);
            var head = [ cols.map(pdfPrettify) ];
            var body = rows.map(function(r){ return cols.map(function(c){ return pdfCell(r[c]); }); });
            doc.autoTable({ head: head, body: body, startY: 70,
                styles: { fontSize: 8, cellPadding: 4, overflow: 'linebreak' },
                headStyles: { fillColor: [5,150,105], textColor: 255 },
                alternateRowStyles: { fillColor: [245,247,250] },
                margin: { left: 40, right: 40 } });
            doc.save(filename);
        }

        async function exportWallets() {
            const { value: formValues } = await Swal.fire({
                title: '<i data-lucide="download"></i> Export Wallets',
                html: `
                    <div class="text-left space-y-4 mt-2">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Wallet Status</label>
                            <select id="exp-locked" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <option value="">All Wallets</option>
                                <option value="false">Active Only</option>
                                <option value="true">Locked Only</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Min Balance (₦)</label>
                                <input id="exp-min" type="number" min="0" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Max Balance (₦)</label>
                                <input id="exp-max" type="number" min="0" placeholder="No limit" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Export PDF',
                confirmButtonColor: '#059669',
                cancelButtonColor: '#6b7280',
                focusConfirm: false,
                customClass: { popup: 'rounded-xl' },
                preConfirm: () => {
                    return {
                        format: 'pdf',
                        locked: document.getElementById('exp-locked').value,
                        minBalance: document.getElementById('exp-min').value,
                        maxBalance: document.getElementById('exp-max').value,
                    };
                }
            });

            if (!formValues) return;

            const btn = document.getElementById('export-wallets-btn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
                <path fill="currentColor" d="M4 12a8 8 0 018-8v8z" class="opacity-75"/>
            </svg> Exporting...`;

            try {
                const baseUrl = (typeof API_CONFIG !== 'undefined' ? API_CONFIG.BASE_URL : '') || '';
                const token = localStorage.getItem('admin_token') || sessionStorage.getItem('admin_token');

                // Build query params exactly like: /api/v1/admin/wallets/export?format=csv&minBalance=0&maxBalance=1000000&locked=false
                const params = new URLSearchParams();
                const wantPdf = formValues.format === 'pdf';
                params.append('format', wantPdf ? 'json' : formValues.format);
                if (formValues.minBalance !== '') params.append('minBalance', formValues.minBalance);
                if (formValues.maxBalance !== '')  params.append('maxBalance', formValues.maxBalance);
                if (formValues.locked !== '')       params.append('locked', formValues.locked);

                const url = `${baseUrl}/api/v1/admin/wallets/export?${params.toString()}`;
                console.log('Export URL:', url);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'text/csv, application/json'
                    }
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || `Export failed (${response.status})`);
                }

                if (wantPdf) {
                    const json = await response.json();
                    const rows = pdfExtractRows(json);
                    exportRowsToPdf(rows, 'Wallets Report', `wallets_export_${new Date().toISOString().split('T')[0]}.pdf`, ['user','email','phoneNumber','balance','locked','createdAt','reference']);
                    AdminUtils.showToast('Wallets exported as PDF!', 'success');
                } else {
                    const blob = await response.blob();
                    const objectUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = objectUrl;
                    a.download = `wallets_export_${new Date().toISOString().split('T')[0]}.${formValues.format}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(objectUrl);
                    AdminUtils.showToast('Wallets exported successfully!', 'success');
                }
            } catch (error) {
                console.error('Export error:', error);
                AdminUtils.showToast(error.message || 'Export failed. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
