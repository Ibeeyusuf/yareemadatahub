<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="flex items-center justify-between px-6 py-3">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-700">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="relative hidden md:block">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" placeholder="Search users, transactions, logs..." class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 w-64 lg:w-96">
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button class="relative p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
            </button>
            <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                <i data-lucide="help-circle" class="w-5 h-5"></i>
            </button>
            <div class="h-8 w-px bg-slate-200 mx-2"></div>
            <div class="flex items-center gap-2">
                <span class="text-xs font-medium px-2 py-1 bg-green-100 text-green-700 rounded-full">System Healthy</span>
            </div>
        </div>
    </div>
</header>
