<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="flex items-center justify-between px-6 py-3">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-700">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="relative hidden md:block">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" placeholder="Search users, transactions, logs..." class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 w-64 lg:w-96">
            </div>
        </div>
        <div class="flex items-center gap-4">

            <!-- Notification Bell -->
            <div class="relative">
                <button onclick="adminToggleNotifications()" id="adminNotifBtn"
                    class="relative p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span id="adminNotifBadge"
                        style="position:absolute;top:-2px;right:-2px;width:18px;height:18px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff">3</span>
                </button>

                <div id="adminNotifDropdown"
                    style="display:none;position:absolute;right:0;top:calc(100% + 8px);width:320px;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.15);border:1px solid #e2e8f0;z-index:9999;overflow:hidden">
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #f1f5f9;background:#f8fafc">
                        <span style="font-size:14px;font-weight:700;color:#1e293b">Notifications</span>
                        <button onclick="adminMarkAllRead()" style="font-size:12px;color:#2563eb;background:none;border:none;cursor:pointer;font-weight:500">Mark all read</button>
                    </div>
                    <div id="adminNotifList" style="max-height:320px;overflow-y:auto"></div>
                    <div style="padding:10px 16px;border-top:1px solid #f1f5f9;background:#f8fafc;text-align:center">
                        <a href="transactions.html" style="font-size:12px;color:#2563eb;font-weight:500;text-decoration:none">View all transactions →</a>
                    </div>
                </div>
            </div>

            <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                <i data-lucide="help-circle" class="w-5 h-5"></i>
            </button>
            <div class="h-8 w-px bg-slate-200 mx-2"></div>
            <div class="flex items-center gap-2">
                <span class="text-xs font-medium px-2 py-1 bg-green-100 text-green-700 rounded-full">System Healthy</span>
            </div>
        </div>
    </div>
</header>
