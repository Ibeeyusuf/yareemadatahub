<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Pricing - Yareema Data Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>
        <main class="flex-1 overflow-y-auto">
            <div id="header-container"></div>
            <div class="p-6">
                <div id="pricing-loader" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div class="bg-white p-6 rounded-lg shadow-xl">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                        <p class="mt-4 text-gray-700">Loading pricing...</p>
                    </div>
                </div>

                <div class="mb-6 flex justify-between items-center">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900">Service Pricing</h1>
                        <p class="text-gray-600 mt-1">Manage pricing for all services</p>
                    </div>
                    <button id="add-pricing-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Add Pricing
                    </button>
                </div>

                <div class="bg-white rounded-lg shadow mb-6 p-4">
                    <div class="flex flex-wrap gap-4 items-center">
                        <select id="service-type-filter" class="px-4 py-2 border rounded-lg">
                            <option value="">All Services</option>
                            <option value="data_recharge">Data Recharge</option>
                            <option value="airtime_recharge">Airtime</option>
                            <option value="cable_tv">Cable TV</option>
                            <option value="electricity">Electricity</option>
                        </select>
                        <select id="provider-filter" class="px-4 py-2 border rounded-lg">
                            <option value="">All Providers</option>
                            <option value="mtn">MTN</option>
                            <option value="airtel">Airtel</option>
                            <option value="glo">Glo</option>
                            <option value="9mobile">9mobile</option>
                        </select>
                        <select id="network-filter" class="px-4 py-2 border rounded-lg">
                            <option value="">All Networks</option>
                            <option value="mtn">MTN</option>
                            <option value="airtel">Airtel</option>
                            <option value="glo">Glo</option>
                            <option value="9mobile">9mobile</option>
                        </select>
                        <select id="active-filter" class="px-4 py-2 border rounded-lg">
                            <option value="">All Status</option>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                        <button id="refresh-pricing" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                            <i data-lucide="refresh-cw" class="w-4 h-4 inline"></i> Refresh
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Plan</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Service</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Provider</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Network</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Details</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cost</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Selling</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Profit</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="pricing-table-body" class="divide-y divide-gray-200"></tbody>
                    </table>
                    <div id="pagination-container"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/pricing.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();
        fetch('partials/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            lucide.createIcons();
        });
        fetch('partials/header.html').then(r => r.text()).then(html => {
            document.getElementById('header-container').innerHTML = html;
            lucide.createIcons();
        });
    </script>
</body>
</html>
