<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - Yareema Data Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>
        <main class="flex-1 overflow-y-auto">
            <div id="header-container"></div>
            <div class="p-6">
                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-gray-900">Reports & Analytics</h1>
                    <p class="text-gray-600 mt-1">Comprehensive business intelligence and reporting</p>
                </div>

                <!-- Key Metrics -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <p class="text-sm font-medium text-gray-600">Total Revenue</p>
                        <h3 id="report-total-revenue" class="text-2xl font-bold text-gray-900 mt-2">₦0.00</h3>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <p class="text-sm font-medium text-gray-600">Total Users</p>
                        <h3 id="report-total-users" class="text-2xl font-bold text-gray-900 mt-2">0</h3>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <p class="text-sm font-medium text-gray-600">Total Transactions</p>
                        <h3 id="report-total-transactions" class="text-2xl font-bold text-gray-900 mt-2">0</h3>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <p class="text-sm font-medium text-gray-600">Success Rate</p>
                        <h3 id="report-success-rate" class="text-2xl font-bold text-gray-900 mt-2">0.00%</h3>
                    </div>
                </div>

                <!-- Charts -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">User Growth Trend</h3>
                        <div class="h-80">
                            <canvas id="userGrowthChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">Transaction Volume</h3>
                        <div class="h-80">
                            <canvas id="transactionChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">Revenue by Service</h3>
                        <div class="h-80">
                            <canvas id="revenueByServiceChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">Provider Performance</h3>
                        <div id="provider-performance" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();
        
        // Load partials
        fetch('partials/sidebar.html').then(r => r.text()).then(html => {
            document.getElementById('sidebar-container').innerHTML = html;
            lucide.createIcons();
        });
        fetch('partials/header.html').then(r => r.text()).then(html => {
            document.getElementById('header-container').innerHTML = html;
            lucide.createIcons();
        });

        // Load reports data
        const api = new YareemaAPI();
        
        async function loadReports() {
            try {
                const response = await api.getDashboardStats();
                const data = response.data;
                
                // Update metrics
                document.getElementById('report-total-revenue').textContent = AdminUtils.formatCurrency(data.overview.totalRevenue || 0);
                document.getElementById('report-total-users').textContent = AdminUtils.formatNumber(data.overview.totalUsers || 0);
                document.getElementById('report-total-transactions').textContent = AdminUtils.formatNumber(data.overview.totalTransactions || 0);
                document.getElementById('report-success-rate').textContent = `${data.overview.successRate || '0.00'}%`;
                
                // Render charts
                if (data.charts.userGrowth && data.charts.userGrowth.labels.length > 0) {
                    renderUserGrowthChart(data.charts.userGrowth);
                }
                
                if (data.charts.dailyTransactions && data.charts.dailyTransactions.labels.length > 0) {
                    renderTransactionChart(data.charts.dailyTransactions);
                }
                
                if (data.charts.revenueByService && data.charts.revenueByService.labels.length > 0) {
                    renderRevenueChart(data.charts.revenueByService);
                }
                
                // Render provider performance
                renderProviderPerformance(data.providerStatus || []);
            } catch (error) {
                console.error('Error loading reports:', error);
                AdminUtils.showToast('Failed to load reports', 'error');
            }
        }
        
        function renderUserGrowthChart(chartData) {
            new Chart(document.getElementById('userGrowthChart'), {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } }
                }
            });
        }
        
        function renderTransactionChart(chartData) {
            new Chart(document.getElementById('transactionChart'), {
                type: 'bar',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } }
                }
            });
        }
        
        function renderRevenueChart(chartData) {
            new Chart(document.getElementById('revenueByServiceChart'), {
                type: 'doughnut',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right' } }
                }
            });
        }
        
        function renderProviderPerformance(providers) {
            const container = document.getElementById('provider-performance');
            if (providers.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">No provider data available</p>';
                return;
            }
            
            container.innerHTML = providers.map(p => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <div>
                        <p class="font-medium text-gray-900 uppercase">${p.name}</p>
                        <p class="text-sm text-gray-600">${p.totalRequests || 0} requests</p>
                    </div>
                    <div class="text-right">
                        <span class="text-lg font-bold text-green-600">${p.successRate}%</span>
                        <p class="text-xs text-gray-500">${p.status}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // Load data on page load
        loadReports();
    </script>
</body>
</html>
