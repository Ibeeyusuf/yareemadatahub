<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Console - Yareema Datahub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{primary:'#2563eb',secondary:'#7c3aed',success:'#10b981',warning:'#f59e0b',error:'#ef4444',dark:'#0f172a',light:'#f8fafc'}}}}</script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="w-full">
        <div id="sidebar-placeholder"></div>
        <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
            <div id="header-placeholder"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">API Management Console</h2>
                            <p class="text-slate-500 text-sm mt-1">Monitor and configure API integrations.</p>
                        </div>
                        <button onclick="testAllAPIs()" class="flex items-center gap-2 px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors shadow-sm shadow-blue-200">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Test All APIs
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-bold text-slate-900">MTN API</h3>
                                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                            </div>
                            <p class="text-xs text-slate-500 mb-2">Uptime: 99.8%</p>
                            <div class="flex items-center justify-between text-xs">
                                <span class="text-slate-500">Response: 120ms</span>
                                <button onclick="openModal('apiConfigModal')" class="text-primary hover:underline">Configure</button>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-bold text-slate-900">Airtel API</h3>
                                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                            </div>
                            <p class="text-xs text-slate-500 mb-2">Uptime: 99.5%</p>
                            <div class="flex items-center justify-between text-xs">
                                <span class="text-slate-500">Response: 145ms</span>
                                <button onclick="openModal('apiConfigModal')" class="text-primary hover:underline">Configure</button>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-bold text-slate-900">Glo API</h3>
                                <span class="w-3 h-3 bg-amber-500 rounded-full"></span>
                            </div>
                            <p class="text-xs text-slate-500 mb-2">Uptime: 95.2%</p>
                            <div class="flex items-center justify-between text-xs">
                                <span class="text-slate-500">Response: 320ms</span>
                                <button onclick="openModal('apiConfigModal')" class="text-primary hover:underline">Configure</button>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-bold text-slate-900">9mobile API</h3>
                                <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                            </div>
                            <p class="text-xs text-slate-500 mb-2">Uptime: 88.1%</p>
                            <div class="flex items-center justify-between text-xs">
                                <span class="text-slate-500">Response: Timeout</span>
                                <button class="text-red-600 hover:underline">Fix Issues</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-slate-900 mb-4">API Request Logs (Last 24 Hours)</h3>
                        <div class="h-64 w-full overflow-hidden">
                            <canvas id="apiChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="modals-placeholder"></div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/charts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const modalsEl = document.getElementById('modals-placeholder');
            if (modalsEl) {
                const response = await fetch('partials/modals.html');
                modalsEl.innerHTML = await response.text();
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
