<!DOCTYPE html>
<html lang="en" style="height: auto; min-height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Yareema Datahub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#2563eb',
                        secondary: '#7c3aed',
                        success: '#10b981',
                        warning: '#f59e0b',
                        error: '#ef4444',
                        dark: '#0f172a',
                        light: '#f8fafc',
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-800 antialiased" style="height: auto; min-height: 100%;">

    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <div class="flex flex-col lg:flex-row w-full">
        <div id="sidebar-placeholder"></div>

        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <div id="header-placeholder"></div>

            <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Dashboard Overview</h2>
                            <p class="text-slate-500 text-sm mt-1">Welcome back, here's what's happening today.</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex bg-white rounded-lg border border-slate-200 p-1">
                                <button class="px-3 py-1 text-xs font-medium bg-slate-100 text-slate-900 rounded shadow-sm">Today</button>
                                <button class="px-3 py-1 text-xs font-medium text-slate-500 hover:text-slate-900">Week</button>
                                <button class="px-3 py-1 text-xs font-medium text-slate-500 hover:text-slate-900">Month</button>
                            </div>
                            <button onclick="showToast('Exporting data...', 'info')" class="flex items-center gap-2 px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors shadow-sm shadow-blue-200">
                                <i data-lucide="download" class="w-4 h-4"></i> Export
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-medium text-slate-500 uppercase">Active Users</p>
                                <h3 class="text-2xl font-bold text-slate-900 mt-1">2,543</h3>
                                <p class="text-xs text-green-600 flex items-center mt-1"><i data-lucide="trending-up" class="w-3 h-3 mr-1"></i> +12%</p>
                            </div>
                            <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
                                <i data-lucide="users" class="w-6 h-6"></i>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-medium text-slate-500 uppercase">Pending Txns</p>
                                <h3 class="text-2xl font-bold text-slate-900 mt-1">45</h3>
                                <p class="text-xs text-amber-600 flex items-center mt-1"><i data-lucide="clock" class="w-3 h-3 mr-1"></i> Action needed</p>
                            </div>
                            <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">
                                <i data-lucide="hourglass" class="w-6 h-6"></i>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-medium text-slate-500 uppercase">API Health</p>
                                <h3 class="text-2xl font-bold text-slate-900 mt-1">99.9%</h3>
                                <p class="text-xs text-green-600 flex items-center mt-1">All systems operational</p>
                            </div>
                            <div class="p-3 bg-green-50 text-green-600 rounded-lg">
                                <i data-lucide="activity" class="w-6 h-6"></i>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-medium text-slate-500 uppercase">Revenue Today</p>
                                <h3 class="text-2xl font-bold text-slate-900 mt-1">$28.4k</h3>
                                <p class="text-xs text-green-600 flex items-center mt-1"><i data-lucide="trending-up" class="w-3 h-3 mr-1"></i> +8.4%</p>
                            </div>
                            <div class="p-3 bg-purple-50 text-purple-600 rounded-lg">
                                <i data-lucide="dollar-sign" class="w-6 h-6"></i>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between mb-6">
                                <h3 class="font-bold text-slate-900">Revenue Overview</h3>
                                <select class="text-sm border-slate-200 rounded-lg text-slate-600 focus:ring-primary">
                                    <option>Last 7 Days</option>
                                    <option>Last 30 Days</option>
                                    <option>This Year</option>
                                </select>
                            </div>
                            <div class="h-80 w-full overflow-hidden">
                                <canvas id="revenueChart"></canvas>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between mb-6">
                                <h3 class="font-bold text-slate-900">Profit Distribution</h3>
                                <button class="text-slate-400 hover:text-primary"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
                            </div>
                            <div class="h-64 w-full overflow-hidden flex items-center justify-center">
                                <canvas id="profitChart"></canvas>
                            </div>
                            <div class="mt-4 space-y-2">
                                <div class="flex justify-between text-sm">
                                    <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-600"></span>Data</span>
                                    <span class="font-medium">45%</span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-purple-600"></span>Airtime</span>
                                    <span class="font-medium">30%</span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Bills</span>
                                    <span class="font-medium">25%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/charts.js"></script>
</body>
</html>
