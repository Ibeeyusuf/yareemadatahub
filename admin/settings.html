<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Yareema Data Hub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{primary:'#2563eb',secondary:'#7c3aed',success:'#10b981',warning:'#f59e0b',error:'#ef4444',dark:'#0f172a',light:'#f8fafc'}}}}</script>
</head>
<body class="text-slate-800 antialiased">

    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="w-full">
        <div id="sidebar-placeholder"></div>
        <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
            <div id="header-placeholder"></div>

            <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
                <div class="space-y-6">

                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Settings</h2>
                            <p class="text-slate-500 text-sm mt-1">Manage your account details and password</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-4xl">

                        <!-- Profile -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                            <h3 class="text-base font-semibold text-slate-900 mb-5">Profile Information</h3>

                            <!-- Avatar -->
                            <div class="flex items-center gap-4 mb-6">
                                <div id="profileAvatar"
                                    class="w-14 h-14 rounded-full bg-primary text-white flex items-center justify-center font-bold text-lg flex-shrink-0">
                                    ?
                                </div>
                                <div>
                                    <p id="profileDisplayName" class="font-semibold text-slate-900">—</p>
                                    <span id="profileRoleBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-700">—</span>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
                                        <input type="text" id="profileFirstName"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
                                        <input type="text" id="profileLastName"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                                    <input type="email" id="profileEmail" disabled
                                        class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 text-slate-400 cursor-not-allowed">
                                </div>
                            </div>

                            <div class="mt-6 pt-4 border-t border-slate-200">
                                <button onclick="saveProfile()" id="save-profile-btn"
                                    class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 text-sm font-medium flex items-center gap-2">
                                    <i data-lucide="save" class="w-4 h-4"></i>
                                    Save Changes
                                </button>
                            </div>
                        </div>

                        <!-- Change Password -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                            <h3 class="text-base font-semibold text-slate-900 mb-5">Change Password</h3>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Current Password</label>
                                    <div class="relative">
                                        <input type="password" id="currentPassword" placeholder="Enter current password"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm pr-10">
                                        <button type="button" onclick="togglePwd('currentPassword', this)"
                                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <i data-lucide="eye" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">New Password</label>
                                    <div class="relative">
                                        <input type="password" id="newPassword" placeholder="Enter new password"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm pr-10">
                                        <button type="button" onclick="togglePwd('newPassword', this)"
                                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <i data-lucide="eye" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Confirm New Password</label>
                                    <div class="relative">
                                        <input type="password" id="confirmPassword" placeholder="Confirm new password"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm pr-10">
                                        <button type="button" onclick="togglePwd('confirmPassword', this)"
                                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <i data-lucide="eye" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-6 pt-4 border-t border-slate-200">
                                <button onclick="changePassword()" id="change-pwd-btn"
                                    class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 text-sm font-medium flex items-center gap-2">
                                    <i data-lucide="lock" class="w-4 h-4"></i>
                                    Update Password
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await loadProfile();
        });

        async function loadProfile() {
            try {
                let user = null;
                try {
                    const res = await api.getProfile();
                    user = res?.data?.user || res?.data || res?.user || null;
                    if (user) localStorage.setItem('admin_user', JSON.stringify(user));
                } catch(e) {
                    const cached = localStorage.getItem('admin_user');
                    if (cached) user = JSON.parse(cached);
                }
                if (!user) return;

                const fn = user.firstName || '', ln = user.lastName || '';
                document.getElementById('profileAvatar').textContent = ((fn[0]||'') + (ln[0]||'')).toUpperCase() || '?';
                document.getElementById('profileDisplayName').textContent = `${fn} ${ln}`.trim() || user.email || '—';
                document.getElementById('profileFirstName').value = fn;
                document.getElementById('profileLastName').value  = ln;
                document.getElementById('profileEmail').value     = user.email || '';

                const role  = user.role || 'admin';
                const badge = document.getElementById('profileRoleBadge');
                badge.textContent = role.charAt(0).toUpperCase() + role.slice(1);
                badge.className   = `text-xs font-semibold px-2.5 py-0.5 rounded-full ${
                    role === 'superadmin' ? 'bg-purple-100 text-purple-700' :
                    role === 'support'    ? 'bg-green-100 text-green-700'   :
                                           'bg-blue-100 text-blue-700'}`;
            } catch(e) { console.error(e); }
        }

        async function saveProfile() {
            const firstName = document.getElementById('profileFirstName').value.trim();
            const lastName  = document.getElementById('profileLastName').value.trim();
            if (!firstName) return showToast('First name is required', 'error');

            const btn = document.getElementById('save-profile-btn');
            setBtnLoading(btn, true);
            try {
                await api.updateProfile({ firstName, lastName });
                const cached = localStorage.getItem('admin_user');
                if (cached) {
                    const u = JSON.parse(cached);
                    u.firstName = firstName; u.lastName = lastName;
                    localStorage.setItem('admin_user', JSON.stringify(u));
                }
                await loadProfile();
                showToast('Profile updated successfully', 'success');
            } catch(e) {
                showToast(e.message || 'Failed to update profile', 'error');
            } finally { setBtnLoading(btn, false); }
        }

        async function changePassword() {
            const current = document.getElementById('currentPassword').value;
            const newPwd  = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!current || !newPwd || !confirm) return showToast('All fields are required', 'error');
            if (newPwd !== confirm) return showToast('New passwords do not match', 'error');
            if (newPwd.length < 8)  return showToast('Password must be at least 8 characters', 'error');

            const btn = document.getElementById('change-pwd-btn');
            setBtnLoading(btn, true);
            try {
                await api.changePassword(current, newPwd);
                ['currentPassword','newPassword','confirmPassword'].forEach(id => document.getElementById(id).value = '');
                showToast('Password updated successfully', 'success');
            } catch(e) {
                showToast(e.message || 'Failed to update password', 'error');
            } finally { setBtnLoading(btn, false); }
        }

        function togglePwd(id, btn) {
            const el = document.getElementById(id);
            if (!el) return;
            const hide = el.type === 'password';
            el.type = hide ? 'text' : 'password';
            btn.innerHTML = hide
                ? '<i data-lucide="eye-off" class="w-4 h-4"></i>'
                : '<i data-lucide="eye" class="w-4 h-4"></i>';
            lucide.createIcons();
        }

        function setBtnLoading(btn, loading) {
            if (!btn) return;
            if (loading) {
                btn._orig    = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
                    <path fill="currentColor" d="M4 12a8 8 0 018-8v8z" class="opacity-75"/></svg> Saving...`;
            } else {
                btn.disabled  = false;
                btn.innerHTML = btn._orig || '';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
