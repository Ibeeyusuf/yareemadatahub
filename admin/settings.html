<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Yareema Data Hub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{primary:'#2563eb',secondary:'#7c3aed',success:'#10b981',warning:'#f59e0b',error:'#ef4444',dark:'#0f172a',light:'#f8fafc'}}}}</script>
</head>
<body class="text-slate-800 antialiased">

    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="w-full">
        <div id="sidebar-placeholder"></div>
        <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
            <div id="header-placeholder"></div>

            <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
                <div class="space-y-6">

                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Settings</h2>
                            <p class="text-slate-500 text-sm mt-1">Manage your account details and password</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-4xl">

                        <!-- Profile -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                            <h3 class="text-base font-semibold text-slate-900 mb-5">Profile Information</h3>

                            <!-- Avatar -->
                            <div class="flex items-center gap-4 mb-6">
                                <div id="profileAvatar"
                                    class="w-14 h-14 rounded-full bg-primary text-white flex items-center justify-center font-bold text-lg flex-shrink-0">
                                    ?
                                </div>
                                <div>
                                    <p id="profileDisplayName" class="font-semibold text-slate-900">—</p>
                                    <span id="profileRoleBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-700">—</span>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
                                        <input type="text" id="profileFirstName"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
                                        <input type="text" id="profileLastName"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                                    <input type="email" id="profileEmail" disabled
                                        class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 text-slate-400 cursor-not-allowed">
                                </div>
                            </div>

                            <div class="mt-6 pt-4 border-t border-slate-200">
                                <button onclick="saveProfile()" id="save-profile-btn"
                                    class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 text-sm font-medium flex items-center gap-2">
                                    <i data-lucide="save" class="w-4 h-4"></i>
                                    Save Changes
                                </button>
                            </div>
                        </div>

                        <!-- Change Password -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                            <h3 class="text-base font-semibold text-slate-900 mb-5">Change Password</h3>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Current Password</label>
                                    <div class="relative">
                                        <input type="password" id="currentPassword" placeholder="Enter current password" autocomplete="current-password"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm pr-10">
                                        <button type="button" onclick="togglePwd('currentPassword', this)"
                                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <i data-lucide="eye" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">New Password</label>
                                    <div class="relative">
                                        <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm pr-10">
                                        <button type="button" onclick="togglePwd('newPassword', this)"
                                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <i data-lucide="eye" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Confirm New Password</label>
                                    <div class="relative">
                                        <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password"
                                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm pr-10">
                                        <button type="button" onclick="togglePwd('confirmPassword', this)"
                                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            <i data-lucide="eye" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-6 pt-4 border-t border-slate-200">
                                <button onclick="changePassword()" id="change-pwd-btn"
                                    class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 text-sm font-medium flex items-center gap-2">
                                    <i data-lucide="lock" class="w-4 h-4"></i>
                                    Update Password
                                </button>
                            </div>
                        </div>

                    <!-- 2FA Card -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 max-w-4xl">
                        <div class="flex items-start justify-between mb-5">
                            <div>
                                <h3 class="text-base font-semibold text-slate-900">Two-Factor Authentication</h3>
                                <p class="text-sm text-slate-500 mt-0.5">Add an extra layer of security to your admin account</p>
                            </div>
                            <div id="twofa-badge"></div>
                        </div>

                        <!-- Info grid -->
                        <div id="twofa-info-grid" class="grid grid-cols-3 gap-4 p-4 bg-slate-50 rounded-lg mb-5">
                            <div>
                                <p class="text-xs text-slate-400 mb-1">Status</p>
                                <p id="twofa-status-text" class="text-sm font-semibold text-slate-800">Loading...</p>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400 mb-1">Method</p>
                                <p id="twofa-method-text" class="text-sm font-semibold text-slate-800">—</p>
                            </div>
                            <div>
                                <p class="text-xs text-slate-400 mb-1">Last Verified</p>
                                <p id="twofa-last-text" class="text-sm font-semibold text-slate-800">—</p>
                            </div>
                        </div>

                        <!-- Dynamic action area -->
                        <div id="twofa-actions"></div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        // ── boot ─────────────────────────────────────────────────────────────
        // Use window.onload (after main.js + partials) then a tick to ensure
        // the api instance and DOM elements are fully ready.
        async function initSettings() {
            lucide.createIcons();
            await loadProfile();
            await load2FA();
        }

        if (document.readyState === 'complete') {
            setTimeout(initSettings, 50);
        } else {
            window.addEventListener('load', () => setTimeout(initSettings, 50));
        }

        // ── helpers ───────────────────────────────────────────────────────────
        function toast(msg, type = 'success') {
            Swal.fire({
                toast: true, position: 'top-end',
                showConfirmButton: false,
                timer: 3000, timerProgressBar: true,
                icon: type, title: msg
            });
        }

        function btnLoad(btn, on, label = 'Saving...') {
            if (!btn) return;
            if (on) {
                btn._orig    = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<svg class="animate-spin w-4 h-4 inline mr-1" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
                    <path fill="currentColor" d="M4 12a8 8 0 018-8v8z" class="opacity-75"/></svg>${label}`;
            } else {
                btn.disabled  = false;
                btn.innerHTML = btn._orig || '';
                lucide.createIcons();
            }
        }

        // ── Profile ───────────────────────────────────────────────────────────
        async function loadProfile() {
            try {
                const res = await api.getProfile();
                // Response: { status: "success", data: { admin: { firstName, lastName, email, role, ... } } }
                const user = res?.data?.admin || null;
                if (!user) throw new Error('No admin data in response');
                localStorage.setItem('admin_user', JSON.stringify(user));
                renderProfile(user);
                updateSidebarProfile(user);
            } catch(e) {
                console.error('loadProfile error:', e.message);
                const cached = localStorage.getItem('admin_user');
                if (cached) renderProfile(JSON.parse(cached));
            }
        }

        function updateSidebarProfile(user) {
            const fn   = user.firstName || '';
            const ln   = user.lastName  || '';
            const name = `${fn} ${ln}`.trim() || user.email || 'Admin';
            const nameEl   = document.getElementById('sidebarAdminName');
            const avatarEl = document.getElementById('sidebarAdminAvatar');
            if (nameEl)   nameEl.textContent   = name;
            if (avatarEl) avatarEl.textContent = name.charAt(0).toUpperCase();
        }

        function renderProfile(user) {
            const fn = user.firstName || '';
            const ln = user.lastName  || '';

            const avatar = document.getElementById('profileAvatar');
            const name   = document.getElementById('profileDisplayName');
            const badge  = document.getElementById('profileRoleBadge');
            const fnEl   = document.getElementById('profileFirstName');
            const lnEl   = document.getElementById('profileLastName');
            const emEl   = document.getElementById('profileEmail');

            if (avatar) avatar.textContent = ((fn[0]||'') + (ln[0]||'')).toUpperCase() || '?';
            if (name)   name.textContent   = `${fn} ${ln}`.trim() || user.email || '—';
            if (fnEl)   fnEl.value         = fn;
            if (lnEl)   lnEl.value         = ln;
            if (emEl)   emEl.value         = user.email || '';

            if (badge) {
                const role = user.role || 'admin';
                badge.textContent = role.replace(/_/g, ' ').replace(/\w/g, c => c.toUpperCase());
                badge.className   = `text-xs font-semibold px-2.5 py-0.5 rounded-full ${
                    role === 'super_admin' || role === 'superadmin' ? 'bg-purple-100 text-purple-700' :
                    role === 'support'                              ? 'bg-green-100  text-green-700'  :
                                                                     'bg-blue-100   text-blue-700'   }`;
            }
        }

        async function saveProfile() {
            const firstName = document.getElementById('profileFirstName').value.trim();
            const lastName  = document.getElementById('profileLastName').value.trim();
            if (!firstName) return toast('First name is required', 'error');

            const btn = document.getElementById('save-profile-btn');
            btnLoad(btn, true);
            try {
                const res = await api.updateProfile({ firstName, lastName });
                console.log('PUT /api/v1/admin/profile →', res);
                // Update cache
                const cached = localStorage.getItem('admin_user');
                if (cached) {
                    const u = JSON.parse(cached);
                    u.firstName = firstName; u.lastName = lastName;
                    localStorage.setItem('admin_user', JSON.stringify(u));
                }
                await loadProfile();
                toast('Profile updated successfully', 'success');
            } catch(e) {
                toast(e.message || 'Failed to update profile', 'error');
            } finally { btnLoad(btn, false); }
        }

        // ── Change Password ───────────────────────────────────────────────────
        async function changePassword() {
            const current = document.getElementById('currentPassword').value;
            const newPwd  = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!current || !newPwd || !confirm) return toast('All fields are required', 'error');
            if (newPwd !== confirm) return toast('New passwords do not match', 'error');
            if (newPwd.length < 8)  return toast('Password must be at least 8 characters', 'error');

            const btn = document.getElementById('change-pwd-btn');
            btnLoad(btn, true, 'Updating...');
            try {
                const res = await api.changePassword(current, newPwd);
                console.log('POST /api/v1/admin/change-password →', res);
                ['currentPassword','newPassword','confirmPassword']
                    .forEach(id => document.getElementById(id).value = '');
                toast('Password updated successfully', 'success');
            } catch(e) {
                toast(e.message || 'Failed to update password', 'error');
            } finally { btnLoad(btn, false); }
        }

        function togglePwd(id, btn) {
            const el = document.getElementById(id);
            if (!el) return;
            const hide = el.type === 'password';
            el.type = hide ? 'text' : 'password';
            btn.innerHTML = hide
                ? '<i data-lucide="eye-off" class="w-4 h-4"></i>'
                : '<i data-lucide="eye" class="w-4 h-4"></i>';
            lucide.createIcons();
        }

        // ── 2FA ───────────────────────────────────────────────────────────────
        let twofaData = { enabled: false, method: 'email', hasAuthenticator: false, lastVerifiedAt: null };

        async function load2FA() {
            try {
                const res = await api.get2FASettings();
                console.log('GET /api/v1/admin/settings/2fa →', res);
                twofaData = res?.data?.twoFactor || res?.data || twofaData;
            } catch(e) {
                console.warn('2FA load failed:', e.message);
            }
            render2FA();
        }

        function render2FA() {
            const { enabled, method, lastVerifiedAt } = twofaData;

            const badge = document.getElementById('twofa-badge');
            if (badge) badge.innerHTML = enabled
                ? `<span class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">
                       <span class="w-2 h-2 rounded-full bg-green-500"></span>Enabled</span>`
                : `<span class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-500">
                       <span class="w-2 h-2 rounded-full bg-slate-400"></span>Disabled</span>`;

            const statusEl = document.getElementById('twofa-status-text');
            if (statusEl) statusEl.textContent = enabled ? 'Active' : 'Not Active';

            const methodEl = document.getElementById('twofa-method-text');
            if (methodEl) methodEl.textContent = method === 'authenticator' ? 'Authenticator App' : 'Email OTP';

            const lastEl = document.getElementById('twofa-last-text');
            if (lastEl) lastEl.textContent = lastVerifiedAt ? new Date(lastVerifiedAt).toLocaleString() : 'Never';

            const actions = document.getElementById('twofa-actions');
            if (!actions) return;

            if (enabled) {
                actions.innerHTML = `
                    <div class="flex items-center gap-3 p-4 bg-green-50 border border-green-200 rounded-lg mb-4">
                        <svg class="w-5 h-5 text-green-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                        <p class="text-sm text-green-800 font-medium">
                            Protected via <strong>${method === 'authenticator' ? 'Authenticator App' : 'Email OTP'}</strong>
                        </p>
                    </div>
                    <button onclick="disable2FAFlow()"
                        class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm font-medium flex items-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                        </svg>Disable 2FA
                    </button>`;
            } else {
                actions.innerHTML = `
                    <div class="flex items-center gap-3 p-4 bg-amber-50 border border-amber-200 rounded-lg mb-4">
                        <svg class="w-5 h-5 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        <p class="text-sm text-amber-800">Account not protected. Enable 2FA to secure your account.</p>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="enable2FAFlow('email')"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium flex items-center gap-2 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>Enable via Email OTP
                        </button>
                        <button onclick="enable2FAFlow('authenticator')"
                            class="px-4 py-2 bg-violet-600 text-white rounded-lg hover:bg-violet-700 text-sm font-medium flex items-center gap-2 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                            </svg>Enable via Authenticator App
                        </button>
                    </div>`;
            }
            lucide.createIcons();
        }

        // ── 2FA Enable flow ───────────────────────────────────────────────────
        async function enable2FAFlow(method) {
            let setupRes;
            try {
                setupRes = await api.setup2FA(method);
                console.log('POST /api/v1/admin/settings/2fa/setup →', setupRes);
            } catch(e) {
                return toast(e.message || 'Could not initiate 2FA setup', 'error');
            }

            const data        = setupRes?.data || {};
            const otpauthUrl  = data.otpauthUrl || '';
            const secret      = data.manualEntryKey || data.secret || data.manualKey || '';

            let bodyHtml = '';
            if (method === 'authenticator') {
                bodyHtml = `
                    <p class="text-sm text-slate-600 text-left mb-3">
                        Scan with <strong>Google Authenticator</strong>, <strong>Authy</strong>, or any TOTP app,
                        then enter the 6-digit code.
                    </p>
                    <div id="twofa-qr-wrapper" class="mx-auto mb-3 flex items-center justify-center rounded-lg border border-slate-200 bg-white" style="width:200px;height:200px">
                        <span class="text-xs text-slate-400">Generating QR...</span>
                    </div>
                    ${secret ? `
                    <div class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 mb-4 text-left">
                        <p class="text-xs text-slate-400 mb-1">Can't scan? Enter this key manually:</p>
                        <code class="text-xs font-mono font-bold text-slate-700 break-all">${secret}</code>
                    </div>` : ''}
                    <label class="block text-xs font-semibold text-slate-500 uppercase text-left mb-1">6-Digit Code from App</label>
                    <input id="twofa-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg text-center text-2xl font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500">`;
                window._twofaOtpauthUrl = otpauthUrl;
            } else {
                bodyHtml = `
                    <p class="text-sm text-slate-600 text-left mb-4">
                        A 6-digit code has been sent to your email. Enter it to activate 2FA.
                    </p>
                    <label class="block text-xs font-semibold text-slate-500 uppercase text-left mb-1">6-Digit Code</label>
                    <input id="twofa-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg text-center text-2xl font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500">`;
            }

            const { value: code } = await Swal.fire({
                title: method === 'authenticator' ? 'Scan & Verify' : 'Enter Email Code',
                html: `<div class="text-center">${bodyHtml}</div>`,
                showCancelButton: true,
                confirmButtonText: 'Verify & Enable',
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#6b7280',
                width: method === 'authenticator' ? 480 : 400,
                focusConfirm: false,
                didOpen: () => {
                    if (method === 'authenticator' && window._twofaOtpauthUrl) {
                        setTimeout(() => {
                            const wrapper = document.getElementById('twofa-qr-wrapper');
                            if (!wrapper) return;
                            if (typeof QRCode !== 'undefined') {
                                wrapper.innerHTML = '';
                                const canvas = document.createElement('canvas');
                                wrapper.appendChild(canvas);
                                QRCode.toCanvas(canvas, window._twofaOtpauthUrl, {
                                    width: 196, margin: 1,
                                    color: { dark: '#0f172a', light: '#ffffff' }
                                }, (err) => {
                                    if (err) {
                                        QRCode.toDataURL(window._twofaOtpauthUrl, { width: 196, margin: 1 }, (e2, url) => {
                                            if (!e2) wrapper.innerHTML = `<img src="${url}" width="196" height="196" style="border-radius:6px">`;
                                        });
                                    }
                                });
                            } else {
                                const enc = encodeURIComponent(window._twofaOtpauthUrl);
                                wrapper.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=196x196&data=${enc}" width="196" height="196" style="border-radius:6px" alt="QR Code">`;
                            }
                        }, 150);
                        setTimeout(() => document.getElementById('twofa-code')?.focus(), 400);
                    } else {
                        setTimeout(() => document.getElementById('twofa-code')?.focus(), 150);
                    }
                },
                preConfirm: () => {
                    const v = document.getElementById('twofa-code').value.trim();
                    if (!v || v.length < 6) {
                        Swal.showValidationMessage('Please enter the complete 6-digit code');
                        return false;
                    }
                    return v;
                }
            });

            if (!code) return;

            try {
                await api.verify2FASetup(code);
                twofaData.enabled = true;
                twofaData.method  = method;
                twofaData.lastVerifiedAt = new Date().toISOString();
                render2FA();
                toast('2FA enabled successfully! Your account is now protected.', 'success');
            } catch(e) {
                toast(e.message || 'Verification failed — check the code and try again.', 'error');
            }
        }

        // ── 2FA Disable flow ──────────────────────────────────────────────────
        async function disable2FAFlow() {
            const { isConfirmed } = await Swal.fire({
                title: 'Disable 2FA?',
                text: 'A confirmation code will be sent to verify this action.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, send code',
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#6b7280',
            });
            if (!isConfirmed) return;

            try {
                await api.send2FADisableCode();
            } catch(e) {
                return toast(e.message || 'Failed to send confirmation code', 'error');
            }

            const methodLabel = twofaData.method === 'authenticator' ? 'authenticator app' : 'email';
            const { value: code } = await Swal.fire({
                title: 'Confirm Disable',
                html: `
                    <div class="text-center">
                        <p class="text-sm text-slate-600 mb-4">
                            Enter the code from your <strong>${methodLabel}</strong> to confirm.
                        </p>
                        <input id="twofa-disable-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg text-center text-2xl font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-red-500">
                    </div>`,
                showCancelButton: true,
                confirmButtonText: 'Disable 2FA',
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#6b7280',
                focusConfirm: false,
                didOpen: () => setTimeout(() => document.getElementById('twofa-disable-code')?.focus(), 150),
                preConfirm: () => {
                    const v = document.getElementById('twofa-disable-code').value.trim();
                    if (!v || v.length < 6) {
                        Swal.showValidationMessage('Please enter the complete 6-digit code');
                        return false;
                    }
                    return v;
                }
            });

            if (!code) return;

            try {
                await api.disable2FA(code);
                twofaData.enabled = false;
                twofaData.lastVerifiedAt = null;
                render2FA();
                toast('2FA has been disabled.', 'success');
            } catch(e) {
                toast(e.message || 'Incorrect code — 2FA was not disabled.', 'error');
            }
        }
    </script>
</body>
</html>
