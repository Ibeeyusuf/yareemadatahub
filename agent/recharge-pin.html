<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtime PIN - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6">
            <div id="pageMsg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

            <!-- PIN Results -->
            <div id="pinResults" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                        <i data-lucide="check-circle" style="width:20px;height:20px;color:#16a34a"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900">Purchase Successful!</h3>
                        <p class="text-sm text-slate-500">Your recharge PINs are ready</p>
                    </div>
                </div>
                <div id="pinList" class="space-y-3"></div>
                <button onclick="resetPins()" class="mt-4 w-full py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition-all">Buy More PINs</button>
            </div>

            <div id="pinForm" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-1">Purchase Recharge PIN</h3>
                <p class="text-sm text-slate-500 mb-6">Buy airtime recharge cards for any network</p>
                <form onsubmit="submitPin(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Network</label>
                        <select id="pinNet" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                            <option value="mtn">MTN</option><option value="airtel">Airtel</option>
                            <option value="glo">Glo</option><option value="9mobile">9mobile</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Denomination</label>
                        <select id="pinAmt" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" onchange="updPinTotal()" required>
                            <option value="100">₦100</option><option value="200">₦200</option>
                            <option value="500">₦500</option><option value="1000">₦1,000</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Quantity (max 10)</label>
                        <input id="pinQty" type="number" value="1" min="1" max="10" onchange="updPinTotal()"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <div id="pinTotalBox" class="px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-600">Total Cost</span>
                            <span id="pinTotal" class="text-xl font-bold text-slate-900">₦100</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Transaction PIN</label>
                        <input id="pinTx" type="password" maxlength="4" placeholder="Enter 4-digit PIN"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <button type="submit" id="pinBtn" class="w-full py-4 text-white font-bold rounded-xl hover:opacity-90 transition-all text-base flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#1E3D5C,#16304a)">
                        <i data-lucide="ticket" class="w-5 h-5"></i> Purchase PIN
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
Auth.protectPage();
fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('services');if(typeof initHeader==='function')initHeader();lucide.createIcons();});

function updPinTotal(){const a=+document.getElementById('pinAmt').value||0,q=+document.getElementById('pinQty').value||1;document.getElementById('pinTotal').textContent='₦'+(a*q).toLocaleString();}

async function submitPin(e) {
    e.preventDefault();
    const net=document.getElementById('pinNet').value, amt=document.getElementById('pinAmt').value, qty=+document.getElementById('pinQty').value, pin=document.getElementById('pinTx').value.trim();
    if (!pin||!/^\d{4}$/.test(pin)){showMsg('Enter your valid 4-digit transaction PIN','error');return;}
    if (!qty||qty<1||qty>10){showMsg('Enter a valid quantity (1–10)','error');return;}
    const btn=document.getElementById('pinBtn');
    btn.disabled=true; btn.innerHTML='<span class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>Processing...';
    try {
        const res=await API.post(API_CONFIG.ENDPOINTS.RECHARGE_PIN_PURCHASE,{network:net,pinType:String(amt),quantity:qty,transactionPin:pin});
        const pins=res.data?.pins||res.data?.TXN_EPIN||[], ref=res.data?.reference||res.data?.orderId||'';
        if (!pins.length) {
            showMsg(`${qty} × ₦${amt} ${net.toUpperCase()} PIN${qty>1?'s':''} purchased! Check your email.${ref?' Ref: '+ref:''}`, 'success');
        } else {
            document.getElementById('pinForm').classList.add('hidden');
            const list=document.getElementById('pinList');
            list.innerHTML=pins.map((p,i)=>{
                const code=p.pin||p.code||String(p);
                return `<div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs text-slate-400 mb-1">${p.mobilenetwork||net.toUpperCase()} &bull; ₦${p.amount||amt}</p>
                            <p class="text-2xl font-bold text-slate-900 tracking-widest" id="rp${i}">${code}</p>
                            ${p.sno?`<p class="text-xs text-slate-400 mt-1">S/N: ${p.sno}</p>`:''}
                        </div>
                        <button onclick="cpPin('rp${i}',this)" class="px-4 py-2 bg-yareema-primary text-white text-sm font-semibold rounded-xl hover:bg-yareema-secondary transition-all">Copy</button>
                    </div>
                </div>`;
            }).join('');
            if(ref) list.insertAdjacentHTML('beforeend',`<p class="text-xs text-slate-400 text-center mt-2">Ref: ${ref}</p>`);
            document.getElementById('pinResults').classList.remove('hidden');
            lucide.createIcons();
        }
    } catch(err){showMsg(err.message||'Purchase failed. Please try again.','error');}
    finally{btn.disabled=false;btn.innerHTML='<i data-lucide="ticket" class="w-5 h-5"></i> Purchase PIN';lucide.createIcons();}
}

function cpPin(id,btn){const p=document.getElementById(id)?.textContent?.trim();if(!p)return;navigator.clipboard.writeText(p).then(()=>{const o=btn.textContent;btn.textContent='✓ Copied!';btn.style.background='#16a34a';setTimeout(()=>{btn.textContent=o;btn.style.background='';},2000);});}
function resetPins(){document.getElementById('pinResults').classList.add('hidden');document.getElementById('pinForm').classList.remove('hidden');document.getElementById('pinTx').value='';}
function showMsg(msg,type){const el=document.getElementById('pageMsg');el.className='p-4 rounded-xl text-sm font-medium '+(type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200');el.textContent=msg;el.classList.remove('hidden');if(type==='success')setTimeout(()=>el.classList.add('hidden'),8000);el.scrollIntoView({behavior:'smooth',block:'nearest'});}

lucide.createIcons();
</script>
</body>
</html>
