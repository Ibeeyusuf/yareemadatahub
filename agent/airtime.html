<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Airtime - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6 max-w-2xl mx-auto w-full">
            <div id="pageMsg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-4">Select Network</h3>
                <div class="grid grid-cols-4 gap-3">
                    <button onclick="selNet('mtn')"     id="net-mtn"     class="net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-yellow-400 bg-yellow-50 font-bold text-sm text-yellow-800 transition-all">
                        <span class="w-10 h-10 rounded-full bg-yellow-400 flex items-center justify-center font-black text-black text-xs">MTN</span><span>MTN</span></button>
                    <button onclick="selNet('airtel')"  id="net-airtel"  class="net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-slate-200 bg-white text-slate-500 font-bold text-sm transition-all">
                        <span class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-black text-red-600 text-xs">AIR</span><span>Airtel</span></button>
                    <button onclick="selNet('glo')"     id="net-glo"     class="net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-slate-200 bg-white text-slate-500 font-bold text-sm transition-all">
                        <span class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-black text-green-600 text-xs">GLO</span><span>Glo</span></button>
                    <button onclick="selNet('9mobile')" id="net-9mobile" class="net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-slate-200 bg-white text-slate-500 font-bold text-sm transition-all">
                        <span class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-black text-green-900 text-xs">9MB</span><span>9mobile</span></button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-1">Purchase Airtime</h3>
                <p class="text-sm text-slate-500 mb-6">Top up any network instantly</p>
                <form onsubmit="submitAirtime(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Number</label>
                        <input id="aPhone" type="tel" maxlength="11" placeholder="08012345678"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Amount (₦)</label>
                        <input id="aAmt" type="number" min="50" placeholder="Min ₦50"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Transaction PIN</label>
                        <input id="aPin" type="password" maxlength="4" placeholder="Enter 4-digit PIN"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <button type="submit" id="aBtn" class="w-full py-4 text-white font-bold rounded-xl hover:opacity-90 transition-all text-base flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#1E3D5C,#16304a)">
                        <i data-lucide="phone" class="w-5 h-5"></i> Buy Airtime
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
Auth.protectPage();
fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('airtime');if(typeof initHeader==='function')initHeader();lucide.createIcons();});

let _net='mtn';
const NSTYLES={mtn:{a:'border-yellow-400 bg-yellow-50 text-yellow-800',dot:'bg-yellow-400 text-black'},airtel:{a:'border-red-400 bg-red-50 text-red-800',dot:'bg-red-500 text-white'},glo:{a:'border-green-500 bg-green-50 text-green-800',dot:'bg-green-500 text-white'},'9mobile':{a:'border-green-800 bg-green-50 text-green-900',dot:'bg-green-800 text-white'}};

function selNet(n) {
    _net = n;
    document.querySelectorAll('.net-btn').forEach(b => {
        const id = b.id.replace('net-',''); const s = NSTYLES[id];
        b.className = 'net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 font-bold text-sm transition-all '+(id===n?s.a:'border-slate-200 bg-white text-slate-500');
        const dot = b.querySelector('span'); if(dot) dot.className='w-10 h-10 rounded-full flex items-center justify-center font-black text-xs '+(id===n?s.dot:'bg-slate-100 text-slate-500');
    });
}

async function submitAirtime(e) {
    e.preventDefault();
    const phone=document.getElementById('aPhone').value.trim(), amount=+document.getElementById('aAmt').value, pin=document.getElementById('aPin').value.trim();
    if (!phone||phone.length!==11){showMsg('Enter a valid 11-digit phone number','error');return;}
    if (!amount||amount<50){showMsg('Minimum amount is ₦50','error');return;}
    if (!pin||!/^\d{4}$/.test(pin)){showMsg('Enter your 4-digit transaction PIN','error');return;}
    const btn=document.getElementById('aBtn');
    btn.disabled=true; btn.innerHTML='<span class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>Processing...';
    try {
        await API.post(API_CONFIG.ENDPOINTS.AIRTIME_PURCHASE,{phoneNumber:phone,network:_net,amount,transactionPin:pin});
        showMsg(`₦${amount.toLocaleString()} airtime sent to ${phone} successfully!`,'success');
        document.getElementById('aPhone').value=''; document.getElementById('aAmt').value=''; document.getElementById('aPin').value='';
    } catch(err){showMsg(err.message||'Purchase failed. Please try again.','error');}
    finally{btn.disabled=false;btn.innerHTML='<i data-lucide="phone" class="w-5 h-5"></i> Buy Airtime';lucide.createIcons();}
}

function showMsg(msg,type){const el=document.getElementById('pageMsg');el.className='p-4 rounded-xl text-sm font-medium '+(type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200');el.textContent=msg;el.classList.remove('hidden');if(type==='success')setTimeout(()=>el.classList.add('hidden'),5000);el.scrollIntoView({behavior:'smooth',block:'nearest'});}

selNet('mtn'); lucide.createIcons();
</script>
</body>
</html>
