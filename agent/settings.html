<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',light:'#e8edf2',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="flex flex-col lg:flex-row w-full min-h-screen">
        <div id="sidebarContainer"></div>
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <div id="headerContainer"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-900 mb-6">Profile Settings</h3>
                    <form onsubmit="handleProfileUpdate(event)" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                                <input type="text" value="Musa Ibrahim" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Number</label>
                                <input type="tel" value="08012345678" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                                <input type="email" value="musa@example.com" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Agent ID</label>
                                <input type="text" value="YAR-AGENT-1234" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm bg-slate-50 w-full" disabled>
                            </div>
                        </div>
                        <button type="submit" class="px-6 py-3 bg-yareema-primary text-white font-bold rounded-xl hover:bg-yareema-dark">Update Profile</button>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-900 mb-6">Bank Details</h3>
                    <form onsubmit="handleBankUpdate(event)" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Bank Name</label>
                                <select class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                                    <option value="gtbank" selected>GTBank</option>
                                    <option value="access">Access Bank</option>
                                    <option value="zenith">Zenith Bank</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Account Number</label>
                                <input type="text" value="0123456789" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                            </div>
                        </div>
                        <button type="submit" class="px-6 py-3 bg-yareema-primary text-white font-bold rounded-xl hover:bg-yareema-dark">Update Bank Details</button>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-900 mb-6">Security Settings</h3>
                    <div class="space-y-4">
                        <button onclick="openModal('changePINModal')" class="w-full p-4 border-2 border-slate-200 rounded-xl hover:border-yareema-primary flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="lock" class="w-5 h-5 text-slate-600"></i>
                                <div class="text-left">
                                    <p class="font-medium text-slate-900">Change Transaction PIN</p>
                                    <p class="text-xs text-slate-500">Update your 4-digit PIN</p>
                                </div>
                            </div>
                            <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
                        </button>
                        <button onclick="openModal('changePasswordModal')" class="w-full p-4 border-2 border-slate-200 rounded-xl hover:border-yareema-primary flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="key" class="w-5 h-5 text-slate-600"></i>
                                <div class="text-left">
                                    <p class="font-medium text-slate-900">Change Password</p>
                                    <p class="text-xs text-slate-500">Update your login password</p>
                                </div>
                            </div>
                            <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="modalsContainer"></div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/services.js"></script>
    <script>
        fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();});
        fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('settings');lucide.createIcons();});
        fetch('partials/modals.html').then(r=>r.text()).then(d=>{document.getElementById('modalsContainer').innerHTML=d;lucide.createIcons();});
    </script>
</body>
</html>
