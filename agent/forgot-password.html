<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.png">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Yareema Agent Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }
        
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
        }
        
        .form-input:focus {
            border-color: #1E3D5C;
            box-shadow: 0 0 0 3px rgba(30, 61, 92, 0.1);
        }
        
        .btn-primary {
            background-color: #1E3D5C;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: #16304a;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 61, 92, 0.3);
        }
        
        .auth-link {
            color: #1E3D5C;
            font-weight: 600;
            cursor: pointer;
        }
        
        .auth-link:hover {
            color: #16304a;
            text-decoration: underline;
        }
        
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        .success-message {
            color: #10b981;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        .step {
            display: none;
        }
        
        .step.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card p-6 sm:p-8">
            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <div class="h-32 w-32 flex items-center justify-center">
                    <img src="assets/images/logo.png" 
                         alt="Yareema Data Hub Logo"
                         class="max-h-full max-w-full object-contain">
                </div>
            </div>
            
            <div class="text-center mb-6">  
                <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">Reset Password</h2>
                <p class="text-slate-600 text-sm sm:text-base">Enter OTP and new password</p>
            </div>

            <!-- Reset Password Form -->
            <form id="reset-form" class="space-y-5">
                <!-- Email (hidden) -->
                <input type="hidden" id="reset-email">
                
                <!-- OTP -->
                <div>
                    <label for="otp" class="block text-sm font-medium text-slate-700 mb-2">
                        OTP Code
                    </label>
                    <div class="relative">
                        <i data-lucide="shield" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input
                            type="text"
                            id="otp"
                            class="w-full pl-10 pr-4 py-3.5 border border-slate-300 rounded-lg form-input focus:outline-none"
                            placeholder="Enter 6-digit OTP"
                            maxlength="6"
                            required
                        >
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label for="new-password" class="block text-sm font-medium text-slate-700 mb-2">
                        New Password
                    </label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input
                            type="password"
                            id="new-password"
                            class="w-full pl-10 pr-12 py-3.5 border border-slate-300 rounded-lg form-input focus:outline-none"
                            placeholder="Enter new password"
                            required
                        >
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 transform -translate-y-1/2 cursor-pointer">
                            <i data-lucide="eye" class="w-5 h-5 text-slate-400"></i>
                        </button>
                    </div>
                    <p class="text-xs text-slate-500 mt-1">At least 8 characters with uppercase, lowercase, number & special character</p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-2">
                        Confirm Password
                    </label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input
                            type="password"
                            id="confirm-password"
                            class="w-full pl-10 pr-4 py-3.5 border border-slate-300 rounded-lg form-input focus:outline-none"
                            placeholder="Confirm new password"
                            required
                        >
                    </div>
                </div>

                <!-- Message -->
                <div id="reset-message" class="error-message"></div>

                <!-- Reset Button -->
                <button type="submit" id="reset-btn" class="w-full py-3.5 bg-primary text-white font-semibold rounded-lg btn-primary flex items-center justify-center">
                    <span>Reset Password</span>
                    <div id="reset-spinner" class="hidden ml-2">
                        <i data-lucide="loader" class="w-5 h-5 animate-spin"></i>
                    </div>
                </button>

                <!-- Back to Login -->
                <p class="text-center text-slate-600 text-sm pt-4">
                    Remember your password? 
                    <a href="index.html" class="auth-link ml-1">Login Here</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Include Config & Auth Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Get email from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        if (email) {
            document.getElementById('reset-email').value = email;
        } else {
            // Redirect to login if no email
            window.location.href = 'index.html';
        }

        // Password visibility toggle
        const togglePassword = document.getElementById('toggle-password');
        const newPassword = document.getElementById('new-password');

        togglePassword.addEventListener('click', () => {
            const icon = togglePassword.querySelector('i');
            if (newPassword.type === 'password') {
                newPassword.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                newPassword.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });

        // Reset form submission
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('reset-email').value;
            const otp = document.getElementById('otp').value.trim();
            const password = newPassword.value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validation
            if (!otp || otp.length !== 6) {
                UI.showError('reset-message', 'Please enter a valid 6-digit OTP');
                return;
            }
            
            if (!password || password.length < 8) {
                UI.showError('reset-message', 'Password must be at least 8 characters');
                return;
            }
            
            if (!Utils.isStrongPassword(password)) {
                UI.showError('reset-message', 'Password must contain uppercase, lowercase, number and special character');
                return;
            }
            
            if (password !== confirmPassword) {
                UI.showError('reset-message', 'Passwords do not match');
                return;
            }
            
            UI.hideMessage('reset-message');
            
            // Show loading
            UI.showLoading('reset-btn', 'reset-spinner');
            
            // Call reset password API
            const result = await Auth.resetPassword(email, otp, password);
            
            // Hide loading
            UI.hideLoading('reset-btn', 'reset-spinner');
            
            if (result.success) {
                UI.showSuccess('reset-message', result.message || 'Password reset successful! Redirecting...');
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                UI.showError('reset-message', result.message);
            }
        });
    </script>
</body>
</html>
