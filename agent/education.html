<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education PINs - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',light:'#e8edf2',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="flex flex-col lg:flex-row w-full min-h-screen">
        <div id="sidebarContainer"></div>
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <div id="headerContainer"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div class="w-16 h-16 bg-purple-50 rounded-xl flex items-center justify-center mb-4">
                            <i data-lucide="graduation-cap" class="w-8 h-8 text-purple-600"></i>
                        </div>
                        <h3 class="font-bold text-slate-900 mb-2">WAEC PIN</h3>
                        <p class="text-sm text-slate-500 mb-4">₦3,500 per PIN</p>
                        <button onclick="openModal('educationModal', 'waec')" class="w-full py-3 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 transition-colors">Buy PIN</button>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div class="w-16 h-16 bg-blue-50 rounded-xl flex items-center justify-center mb-4">
                            <i data-lucide="book-open" class="w-8 h-8 text-blue-600"></i>
                        </div>
                        <h3 class="font-bold text-slate-900 mb-2">NECO PIN</h3>
                        <p class="text-sm text-slate-500 mb-4">₦1,000 per PIN</p>
                        <button onclick="openModal('educationModal', 'neco')" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">Buy PIN</button>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div class="w-16 h-16 bg-green-50 rounded-xl flex items-center justify-center mb-4">
                            <i data-lucide="award" class="w-8 h-8 text-green-600"></i>
                        </div>
                        <h3 class="font-bold text-slate-900 mb-2">JAMB PIN</h3>
                        <p class="text-sm text-slate-500 mb-4">₦4,700 per PIN</p>
                        <button onclick="openModal('educationModal', 'jamb')" class="w-full py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition-colors">Buy PIN</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="modalsContainer"></div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/services.js"></script>
    <script>
        fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();});
        fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('education');lucide.createIcons();});
        fetch('partials/modals.html').then(r=>r.text()).then(d=>{document.getElementById('modalsContainer').innerHTML=d;lucide.createIcons();});
    </script>
</body>
</html>
