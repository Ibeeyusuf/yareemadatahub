<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education PINs - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6">
            <div id="pageMsg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-start gap-3">
                <i data-lucide="info" style="width:18px;height:18px;color:#2563eb;flex-shrink:0;margin-top:1px"></i>
                <p class="text-sm text-blue-700">Scratch cards will be sent to the registered email address after purchase.</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-1">Purchase Education PIN</h3>
                <p class="text-sm text-slate-500 mb-6">Select exam and quantity</p>
                <form onsubmit="submitEdu(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Exam Type</label>
                        <select id="eduType" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" onchange="updPrice()" required>
                            <option value="waecdirect">WAEC Result Checker</option>
                            <option value="neco">NECO Result Checker</option>
                            <option value="jamb">JAMB E-PIN</option>
                            <option value="nabteb">NABTEB Result Checker</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Quantity</label>
                        <select id="eduQty" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" onchange="updPrice()" required>
                            <option value="1">1 PIN</option><option value="2">2 PINs</option>
                            <option value="3">3 PINs</option><option value="5">5 PINs</option><option value="10">10 PINs</option>
                        </select>
                    </div>
                    <div id="eduPriceBox" class="hidden px-4 py-3 bg-green-50 border border-green-200 rounded-xl">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-600">Estimated Total</span>
                            <span id="eduPrice" class="text-xl font-bold text-slate-900">₦0</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Transaction PIN</label>
                        <input id="eduPin" type="password" maxlength="4" placeholder="Enter 4-digit PIN"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <button type="submit" id="eduBtn" class="w-full py-4 text-white font-bold rounded-xl hover:opacity-90 transition-all text-base flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#1E3D5C,#16304a)">
                        <i data-lucide="graduation-cap" class="w-5 h-5"></i> Purchase PIN
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
Auth.protectPage();
fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('education');if(typeof initHeader==='function')initHeader();lucide.createIcons();});

const EDU_P={waecdirect:3800,neco:1000,jamb:700,nabteb:900};

function updPrice() {
    const t=document.getElementById('eduType').value, q=+document.getElementById('eduQty').value, box=document.getElementById('eduPriceBox'), pr=document.getElementById('eduPrice');
    const u=EDU_P[t];
    if(u){box.classList.remove('hidden');pr.textContent='₦'+(u*q).toLocaleString();}else box.classList.add('hidden');
}

async function submitEdu(e) {
    e.preventDefault();
    const et=document.getElementById('eduType').value, qty=+document.getElementById('eduQty').value, pin=document.getElementById('eduPin').value.trim();
    if (!pin||!/^\d{4}$/.test(pin)){showMsg('Enter your 4-digit transaction PIN','error');return;}
    const btn=document.getElementById('eduBtn');
    btn.disabled=true; btn.innerHTML='<span class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>Processing...';
    try {
        await API.post(API_CONFIG.ENDPOINTS.EDUCATION_PURCHASE,{examType:et,quantity:qty,transactionPin:pin});
        const labels={waecdirect:'WAEC',neco:'NECO',jamb:'JAMB',nabteb:'NABTEB'};
        showMsg(`${qty} × ${labels[et]||et.toUpperCase()} PIN${qty>1?'s':''} purchased! Check your email for scratch cards.`,'success');
        document.getElementById('eduPin').value='';
    } catch(err){showMsg(err.message||'Purchase failed. Please try again.','error');}
    finally{btn.disabled=false;btn.innerHTML='<i data-lucide="graduation-cap" class="w-5 h-5"></i> Purchase PIN';lucide.createIcons();}
}

function showMsg(msg,type){const el=document.getElementById('pageMsg');el.className='p-4 rounded-xl text-sm font-medium '+(type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200');el.textContent=msg;el.classList.remove('hidden');if(type==='success')setTimeout(()=>el.classList.add('hidden'),8000);el.scrollIntoView({behavior:'smooth',block:'nearest'});}

updPrice(); lucide.createIcons();
</script>
</body>
</html>
