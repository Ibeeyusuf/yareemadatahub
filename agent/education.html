<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education PINs - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6 max-w-2xl mx-auto w-full">
            <div id="pageMsg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-start gap-3">
                <i data-lucide="info" style="width:18px;height:18px;color:#2563eb;flex-shrink:0;margin-top:1px"></i>
                <p class="text-sm text-blue-700">Scratch cards will be sent to the registered email address after purchase.</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-1">Purchase Education PIN</h3>
                <p class="text-sm text-slate-500 mb-6">Available exam PINs are loaded from the service API.</p>
                <form onsubmit="submitEdu(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Exam Type</label>
                        <select id="eduType" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required disabled>
                            <option value="">Loading available exams...</option>
                        </select>
                    </div>
                    <div id="eduJambBlock" class="hidden space-y-3">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Candidate Profile ID</label>
                            <input id="eduProfileId" type="text" placeholder="Enter profile ID" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                        </div>
                        <button type="button" id="eduVerifyBtn" onclick="verifyEduProfile()" class="w-full py-3 text-yareema-primary font-semibold rounded-xl border border-slate-300 hover:bg-slate-50">Verify Profile</button>
                        <div id="eduVerifiedBox" class="hidden px-4 py-3 bg-green-50 border border-green-200 rounded-xl text-sm font-semibold text-green-700"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Number (optional)</label>
                        <input id="eduPhone" type="tel" maxlength="11" placeholder="Defaults to your account phone" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Exam / Card Number (if required)</label>
                        <input id="eduExamNumber" type="text" placeholder="Optional" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                    </div>
                    <div id="eduPriceBox" class="hidden px-4 py-3 bg-green-50 border border-green-200 rounded-xl">
                        <span id="eduPrice" class="text-sm font-semibold text-green-700"></span>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Transaction PIN</label>
                        <input id="eduPin" type="password" maxlength="4" placeholder="Enter 4-digit PIN" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <button type="submit" id="eduBtn" class="w-full py-4 text-white font-bold rounded-xl hover:opacity-90 transition-all text-base flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#1E3D5C,#16304a)">
                        <i data-lucide="graduation-cap" class="w-5 h-5"></i> Purchase PIN
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/services.js"></script>
<script src="assets/js/main.js"></script>
<script>
Auth.protectPage();
fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('education');if(typeof initHeader==='function')initHeader();lucide.createIcons();});

const EDU_JAMB_TYPES = ['de', 'utme-mock', 'utme-no-mock'];
let _eduPlans = [];
let _eduVerified = null;

async function loadEducationExams() {
    const select = document.getElementById('eduType');
    const response = await API.get(API_CONFIG.ENDPOINTS.EDUCATION_PLANS);
    _eduPlans = response.data?.examTypes || response.examTypes || [];
    if (!_eduPlans.length) throw new Error('Education PINs are currently unavailable.');
    select.innerHTML = '<option value="">Choose exam...</option>' + _eduPlans.map(plan =>
        `<option value="${plan.code}">${plan.name}</option>`
    ).join('');
    select.disabled = false;
    select.addEventListener('change', updateEducationSelection);
    updateEducationSelection();
}

function updateEducationSelection() {
    const examType = document.getElementById('eduType').value;
    const plan = _eduPlans.find(item => item.code === examType);
    _eduVerified = null;
    document.getElementById('eduVerifiedBox').classList.add('hidden');
    document.getElementById('eduJambBlock').classList.toggle('hidden', !EDU_JAMB_TYPES.includes(examType));
    const priceBox = document.getElementById('eduPriceBox');
    const price = document.getElementById('eduPrice');
    priceBox.classList.toggle('hidden', !plan);
    if (plan) price.textContent = `Price: ₦${Number(plan.amount).toLocaleString()}`;
}

async function verifyEduProfile() {
    const examType = document.getElementById('eduType').value;
    const profileId = document.getElementById('eduProfileId').value.trim();
    if (!profileId) { showMsg('Enter the candidate profile ID', 'error'); return; }
    const button = document.getElementById('eduVerifyBtn');
    button.disabled = true;
    button.textContent = 'Verifying...';
    try {
        const response = await API.post(API_CONFIG.ENDPOINTS.EDUCATION_VERIFY, { examType, profileId });
        const data = response.data || response;
        if (data.verified === false) throw new Error(response.message || 'Verification failed');
        _eduVerified = data;
        const verifiedBox = document.getElementById('eduVerifiedBox');
        verifiedBox.textContent = `Verified: ${data.customerName || 'Candidate'}`;
        verifiedBox.classList.remove('hidden');
        if (data.price != null || data.unitPrice != null) {
            document.getElementById('eduPrice').textContent = `Price: ₦${Number(data.price ?? data.unitPrice).toLocaleString()}`;
        }
    } catch (error) {
        showMsg(error.message || 'Verification failed', 'error');
    } finally {
        button.disabled = false;
        button.textContent = 'Verify Profile';
    }
}

async function submitEdu(e) {
    e.preventDefault();
    const et=document.getElementById('eduType').value, pin=document.getElementById('eduPin').value.trim();
    const phoneNumber=document.getElementById('eduPhone').value.trim(), examNumber=document.getElementById('eduExamNumber').value.trim();
    if (!et) { showMsg('Select an exam type', 'error'); return; }
    if (EDU_JAMB_TYPES.includes(et) && !_eduVerified) { showMsg('Verify the candidate profile first', 'error'); return; }
    if (!pin||!/^\d{4}$/.test(pin)){showMsg('Enter your 4-digit transaction PIN','error');return;}
    const btn=document.getElementById('eduBtn');
    btn.disabled=true; btn.innerHTML='<span class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>Processing...';
    try {
        const response = await API.post(API_CONFIG.ENDPOINTS.EDUCATION_PURCHASE, {
            examType:et, transactionPin:pin,
            ...(phoneNumber ? { phoneNumber } : {}),
            ...(examNumber ? { examNumber } : {})
        });
        const data = response.data || response;
        showMsg(data.status === 'pending' ? 'Education PIN purchase is processing. Check your transaction history shortly.' : 'Education PIN purchased successfully. Check your transaction history for PIN details.', 'success');
        document.getElementById('eduPin').value='';
    } catch(err){showMsg(err.message||'Purchase failed. Please try again.','error');}
    finally{btn.disabled=false;btn.innerHTML='<i data-lucide="graduation-cap" class="w-5 h-5"></i> Purchase PIN';lucide.createIcons();}
}

function showMsg(msg,type){const el=document.getElementById('pageMsg');el.className='p-4 rounded-xl text-sm font-medium '+(type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200');el.textContent=msg;el.classList.remove('hidden');if(type==='success')setTimeout(()=>el.classList.add('hidden'),8000);el.scrollIntoView({behavior:'smooth',block:'nearest'});}

loadEducationExams().catch(error => {
    showMsg(error.message || 'Failed to load education PINs.', 'error');
    document.getElementById('eduBtn').disabled = true;
});
lucide.createIcons();
</script>
</body>
</html>
