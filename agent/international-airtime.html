<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International Airtime - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6 max-w-2xl mx-auto w-full">

            <div id="pageMsg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="flex items-center gap-3 mb-5">
                    <span class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:#eff6ff">
                        <i data-lucide="globe-2" class="w-5 h-5" style="color:#2563eb"></i>
                    </span>
                    <div>
                        <h3 class="font-bold text-slate-900">International Airtime</h3>
                        <p class="text-sm text-slate-500">Send airtime top-ups across borders</p>
                    </div>
                </div>

                <form onsubmit="submitIntl(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Country</label>
                        <select id="intlCountry" onchange="onCountry()" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                            <option value="">Loading countries...</option>
                        </select>
                    </div>

                    <div id="opGroup" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Operator</label>
                        <select id="intlOperator" onchange="onOperator()" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                            <option value="">Select country first...</option>
                        </select>
                    </div>

                    <div id="amtGroup" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2" id="amtLabel">Amount</label>
                        <div id="denomWrap" class="flex flex-wrap gap-2 mb-3"></div>
                        <input id="intlAmount" type="number" step="any" oninput="updReceipt()" placeholder="Amount"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                        <p id="amtHint" class="text-xs text-slate-400 mt-1"></p>
                    </div>

                    <div id="phoneGroup" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Recipient Phone <span id="dialCode" class="text-slate-400 font-normal"></span></label>
                        <input id="intlPhone" type="tel" oninput="updReceipt()" placeholder="Recipient number"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                    </div>

                    <div id="ngnGroup" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2" id="ngnLabel">NGN Amount to Debit from Wallet</label>
                        <input id="intlNgn" type="number" oninput="updReceipt()" placeholder="e.g. 16500"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                    </div>

                    <div id="intlReceipt" class="hidden rounded-xl bg-slate-50 border border-slate-200 p-4 text-sm space-y-1">
                        <div class="flex justify-between"><span class="text-slate-500">Operator</span><span class="font-semibold" id="rcpOp">—</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Recipient</span><span class="font-semibold" id="rcpNum">—</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Top-up</span><span class="font-semibold" id="rcpAmt">—</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Wallet debit</span><span class="font-bold text-yareema-primary" id="rcpNgn">—</span></div>
                    </div>

                    <div id="pinGroup" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Transaction PIN</label>
                        <input id="intlPin" type="password" maxlength="4" placeholder="Enter 4-digit PIN"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full py-4 text-white font-bold rounded-xl hover:opacity-90 transition-all text-base flex items-center justify-center gap-2"
                        style="background:linear-gradient(135deg,#1E3D5C,#16304a)">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        Top-Up Now
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
Auth.protectPage();
fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('international');if(typeof initHeader==='function')initHeader();lucide.createIcons();});

let _countries = [], _operators = [], _op = null;

function opCurrency(op){ return op && op.localAmountsSupported ? (op.destinationCurrencyCode || 'Local') : 'USD'; }

async function loadCountries() {
    const sel = document.getElementById('intlCountry');
    try {
        const res = await API.get('/telecom/international/countries');
        _countries = res?.data || res?.countries || (Array.isArray(res) ? res : []);
        if (!Array.isArray(_countries) || !_countries.length) { sel.innerHTML = '<option value="">No countries available</option>'; return; }
        sel.innerHTML = '<option value="">— Choose Country —</option>' + _countries.map(c => {
            const code = c.isoCode || c.countryCode || c.iso2 || c.code || '';
            const name = c.name || c.isoName || c.countryName || code;
            const dial = (c.callingCodes || c.callingCode || ['+'])[0] || '+';
            return `<option value="${code}" data-dial="${dial}">${name} (${dial})</option>`;
        }).join('');
    } catch (e) {
        sel.innerHTML = '<option value="">Failed to load countries</option>';
        showMsg('Failed to load countries. Please try again.', 'error');
    }
}

async function onCountry() {
    const sel  = document.getElementById('intlCountry');
    const code = sel.value;
    const dial = sel.options[sel.selectedIndex]?.dataset?.dial || '';
    _operators = []; _op = null;
    ['opGroup','amtGroup','phoneGroup','ngnGroup','pinGroup','intlReceipt'].forEach(id => document.getElementById(id).classList.add('hidden'));
    document.getElementById('dialCode').textContent = dial ? '(' + dial + ')' : '';
    if (!code) return;

    const opSel = document.getElementById('intlOperator');
    document.getElementById('opGroup').classList.remove('hidden');
    opSel.innerHTML = '<option value="">Loading operators...</option>';
    try {
        const res = await API.get(`/telecom/international/operators/${code}?page=1&size=100`);
        _operators = res?.data?.content || res?.data || res?.operators || (Array.isArray(res) ? res : []);
        if (!Array.isArray(_operators) || !_operators.length) { opSel.innerHTML = '<option value="">No operators found</option>'; return; }
        opSel.innerHTML = '<option value="">— Choose Operator —</option>' + _operators.map((op, i) => {
            const name = op.name || op.operatorName || ('Operator ' + (i + 1));
            return `<option value="${i}">${name}</option>`;
        }).join('');
    } catch (e) {
        opSel.innerHTML = '<option value="">Failed to load operators</option>';
        showMsg(e.message || 'Failed to load operators.', 'error');
    }
}

function onOperator() {
    const idx = document.getElementById('intlOperator').value;
    if (idx === '') { _op = null; return; }
    _op = _operators[+idx];
    if (!_op) return;

    ['amtGroup','phoneGroup','ngnGroup','pinGroup'].forEach(id => document.getElementById(id).classList.remove('hidden'));

    const cur = opCurrency(_op);
    document.getElementById('amtLabel').textContent = `Amount (${cur})`;

    const hint = [];
    if (_op.minAmount != null) hint.push(`Min: ${_op.minAmount} ${cur}`);
    if (_op.maxAmount != null) hint.push(`Max: ${_op.maxAmount} ${cur}`);
    document.getElementById('amtHint').textContent = hint.join('  ·  ');

    const ngnLabel = document.getElementById('ngnLabel');
    ngnLabel.innerHTML = _op.fxRate
        ? `NGN Amount to Debit from Wallet <span class="text-xs text-slate-400 font-normal">(FX: 1 USD ≈ ₦${Number(_op.fxRate).toLocaleString(undefined,{maximumFractionDigits:2})})</span>`
        : 'NGN Amount to Debit from Wallet';

    const denoms = _op.denominationType === 'FIXED' ? (_op.fixedAmounts || _op.fixedAmountsList || []) : [];
    const wrap = document.getElementById('denomWrap');
    if (Array.isArray(denoms) && denoms.length) {
        wrap.innerHTML = denoms.slice(0, 12).map(d =>
            `<button type="button" onclick="pickDenom(${d}, this)" class="denom-btn px-4 py-2 rounded-xl border-2 border-slate-200 bg-white text-slate-700 text-sm font-semibold hover:border-yareema-primary transition-all">${cur} ${d}</button>`
        ).join('');
        document.getElementById('intlAmount').placeholder = 'Or type custom amount';
    } else {
        wrap.innerHTML = '';
        document.getElementById('intlAmount').placeholder = `Amount in ${cur}`;
    }
    updReceipt();
}

function pickDenom(val, btn) {
    document.querySelectorAll('.denom-btn').forEach(b => b.className = 'denom-btn px-4 py-2 rounded-xl border-2 border-slate-200 bg-white text-slate-700 text-sm font-semibold hover:border-yareema-primary transition-all');
    btn.className = 'denom-btn px-4 py-2 rounded-xl border-2 border-yareema-primary bg-yareema-primary text-white text-sm font-semibold transition-all';
    document.getElementById('intlAmount').value = val;
    updReceipt();
}

function updReceipt() {
    if (!_op) return;
    const phone = document.getElementById('intlPhone').value.trim();
    const amt   = parseFloat(document.getElementById('intlAmount').value) || 0;
    const ngn   = parseFloat(document.getElementById('intlNgn').value) || 0;
    const box   = document.getElementById('intlReceipt');
    if (!phone || !amt || !ngn) { box.classList.add('hidden'); return; }
    const cur = opCurrency(_op);
    box.classList.remove('hidden');
    document.getElementById('rcpOp').textContent  = _op.name || _op.operatorName || '—';
    document.getElementById('rcpNum').textContent = phone;
    document.getElementById('rcpAmt').textContent = `${amt} ${cur}`;
    document.getElementById('rcpNgn').textContent = `₦${Number(ngn).toLocaleString()}`;
}

async function submitIntl(e) {
    e.preventDefault();
    const code  = document.getElementById('intlCountry').value;
    const phone = document.getElementById('intlPhone').value.trim();
    const amt   = parseFloat(document.getElementById('intlAmount').value);
    const ngn   = parseFloat(document.getElementById('intlNgn').value);
    const pin   = document.getElementById('intlPin').value.trim();
    if (!code)                     { showMsg('Please select a country', 'error'); return; }
    if (!_op)                      { showMsg('Please select an operator', 'error'); return; }
    if (!phone || phone.length < 4){ showMsg('Enter a valid recipient phone number', 'error'); return; }
    if (!amt || amt <= 0)          { showMsg('Enter a valid amount', 'error'); return; }
    if (!ngn || ngn <= 0)          { showMsg('Enter the NGN amount to debit from your wallet', 'error'); return; }
    if (!pin || !/^\d{4}$/.test(pin)) { showMsg('Enter your 4-digit transaction PIN', 'error'); return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerHTML = '<span class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>Processing...';
    try {
        await API.post('/telecom/international/topup', {
            operatorId:           _op.id || _op.operatorId,
            amount:               amt,
            useLocalAmount:       !!_op.localAmountsSupported,
            recipientCountryCode: code,
            recipientNumber:      phone,
            amountNgn:            ngn,
            transactionPin:       pin
        });
        const opName = _op.name || _op.operatorName || 'Operator';
        showMsg(`${amt} ${opCurrency(_op)} top-up sent to ${phone} via ${opName}!`, 'success');
        document.getElementById('intlAmount').value = '';
        document.getElementById('intlPhone').value = '';
        document.getElementById('intlNgn').value = '';
        document.getElementById('intlPin').value = '';
        document.getElementById('intlReceipt').classList.add('hidden');
    } catch (err) {
        showMsg(err.message || 'Transaction failed. Please try again.', 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i> Top-Up Now';
        lucide.createIcons();
    }
}

function showMsg(msg, type) {
    const el = document.getElementById('pageMsg');
    el.className = 'p-4 rounded-xl text-sm font-medium ' + (type==='success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200');
    el.textContent = msg; el.classList.remove('hidden');
    if (type === 'success') setTimeout(() => el.classList.add('hidden'), 5000);
    el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

loadCountries();
lucide.createIcons();
</script>
</body>
</html>
