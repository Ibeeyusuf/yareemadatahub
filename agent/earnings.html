<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',light:'#e8edf2',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="flex flex-col lg:flex-row w-full min-h-screen">
        <div id="sidebarContainer"></div>
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <div id="headerContainer"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6">
                
                <!-- Earnings Summary Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-gradient-to-br from-green-600 to-green-800 rounded-xl shadow-lg p-6 text-white">
                        <p class="text-green-200 text-sm mb-2">Total Earnings</p>
                        <h3 id="total-earnings" class="text-3xl font-bold mb-1">₦0.00</h3>
                        <p class="text-xs text-green-200">All-time commission</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-slate-500 text-sm mb-2">Available Balance</p>
                        <h3 id="available-balance" class="text-3xl font-bold text-slate-900 mb-1">₦0.00</h3>
                        <p class="text-xs text-blue-600">Ready to withdraw</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-slate-500 text-sm mb-2">This Month</p>
                        <h3 id="monthly-earnings" class="text-3xl font-bold text-slate-900 mb-1">₦0.00</h3>
                        <p class="text-xs text-green-600" id="monthly-growth">+0%</p>
                    </div>
                </div>

                <!-- Commission Breakdown -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-slate-900 mb-4">Commission by Service</h3>
                    <div id="service-earnings" class="space-y-3">
                        <div class="text-center py-8 text-slate-500">
                            <i data-lucide="loader" class="w-8 h-8 mx-auto mb-2 animate-spin text-slate-400"></i>
                            <p>Loading earnings data...</p>
                        </div>
                    </div>
                </div>

                <!-- Recent Earnings -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-900">Recent Commission</h3>
                        <button onclick="loadEarnings()" class="text-sm text-blue-600 hover:text-blue-700">
                            <i data-lucide="refresh-cw" class="w-4 h-4 inline mr-1"></i>
                            Refresh
                        </button>
                    </div>
                    <div id="earnings-list" class="space-y-3">
                        <div class="text-center py-8 text-slate-500">
                            <i data-lucide="loader" class="w-8 h-8 mx-auto mb-2 animate-spin text-slate-400"></i>
                            <p>Loading commission history...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="modalsContainer"></div>
    
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/services.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();
        
        // Protect page
        Auth.protectPage();
        
        // Load partials
        fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
        fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('earnings');initHeader();lucide.createIcons();});
        fetch('partials/modals.html').then(r => r.text()).then(d => { document.getElementById('modalsContainer').innerHTML = d; lucide.createIcons(); });
        
        // Load earnings data on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadEarningsData();
        });
        
        async function loadEarningsData() {
            // Earnings come from dashboard endpoint
            const result = await AgentDashboard.getDashboardData();
            
            if (result.success && result.data && result.data.stats) {
                const stats = result.data.stats;
                
                // Update summary cards
                document.getElementById('total-earnings').textContent = UI.formatCurrency(stats.total?.commission || stats.totalCommissionEarned || 0);
                document.getElementById('available-balance').textContent = UI.formatCurrency(stats.availableCommission || 0);
                document.getElementById('monthly-earnings').textContent = UI.formatCurrency(stats.monthly?.commission || 0);
                
                // Update service earnings breakdown
                if (result.data.serviceBreakdown) {
                    displayServiceEarnings(result.data.serviceBreakdown);
                }
            }
            
            await loadEarnings();
        }
        
        function displayServiceEarnings(services) {
            const container = document.getElementById('service-earnings');
            
            if (!services || services.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-500"><p>No service earnings yet</p></div>';
                return;
            }
            
            container.innerHTML = services.map(service => {
                const commission = (service.amount || 0) * (service.commissionRate || 0) / 100;
                return `
                    <div class="flex items-center justify-between p-4 border border-slate-200 rounded-lg hover:bg-slate-50">
                        <div class="flex items-center gap-3">
                            ${getServiceIcon(service.name)}
                            <div>
                                <p class="font-semibold text-slate-900">${service.name}</p>
                                <p class="text-xs text-slate-500">${UI.formatNumber(service.count || 0)} transactions</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-green-600">${UI.formatCurrency(commission)}</p>
                            <p class="text-xs text-slate-500">from ${UI.formatCurrency(service.amount || 0)}</p>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }
        
        async function loadEarnings() {
            const container = document.getElementById('earnings-list');
            container.innerHTML = '<div class="text-center py-8 text-slate-500"><i data-lucide="loader" class="w-8 h-8 mx-auto mb-2 animate-spin text-slate-400"></i><p>Loading commission history...</p></div>';
            lucide.createIcons();
            
            // Get transactions from wallet endpoint
            const result = await WalletAPI.getTransactions({ type: 'commission', limit: 20 });
            
            if (result.success && result.data) {
                const transactions = result.data.transactions || result.data;
                
                if (!transactions || transactions.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-slate-500"><i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 text-slate-400"></i><p>No commission earned yet</p></div>';
                } else {
                    container.innerHTML = transactions.map(txn => `
                        <div class="flex items-center justify-between p-4 border border-slate-200 rounded-lg hover:bg-slate-50">
                            <div>
                                <p class="font-semibold text-slate-900">${txn.description || 'Commission earned'}</p>
                                <p class="text-xs text-slate-500">${UI.formatDate(txn.createdAt || txn.date)}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-bold text-green-600">+${UI.formatCurrency(txn.amount)}</p>
                                <p class="text-xs text-slate-500">${txn.service || 'Service'}</p>
                            </div>
                        </div>
                    `).join('');
                }
            } else {
                container.innerHTML = '<div class="text-center py-8 text-red-500"><i data-lucide="alert-circle" class="w-12 h-12 mx-auto mb-3"></i><p>Failed to load earnings</p></div>';
            }
            
            lucide.createIcons();
        }
        
        function getServiceIcon(service) {
            const serviceLower = (service || '').toLowerCase();
            
            if (serviceLower.includes('data')) {
                return '<div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center"><i data-lucide="wifi" class="w-5 h-5 text-blue-600"></i></div>';
            } else if (serviceLower.includes('airtime')) {
                return '<div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center"><i data-lucide="phone" class="w-5 h-5 text-green-600"></i></div>';
            } else if (serviceLower.includes('electricity')) {
                return '<div class="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center"><i data-lucide="zap" class="w-5 h-5 text-yellow-600"></i></div>';
            } else if (serviceLower.includes('cable')) {
                return '<div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center"><i data-lucide="tv" class="w-5 h-5 text-purple-600"></i></div>';
            }
            
            return '<div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center"><i data-lucide="shopping-cart" class="w-5 h-5 text-slate-600"></i></div>';
        }
    </script>
</body>
</html>
