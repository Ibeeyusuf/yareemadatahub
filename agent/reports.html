<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',light:'#e8edf2',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="w-full min-h-screen">
        <div id="sidebarContainer"></div>
        <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
            <div id="headerContainer"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onclick="generateReport('daily', this)" class="bg-white p-6 rounded-xl shadow-sm border-2 border-slate-200 hover:border-yareema-primary text-left">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center">
                                <i data-lucide="calendar" class="w-6 h-6 text-blue-600"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900">Daily Report</h3>
                                <p class="text-xs text-slate-500">Today's transactions</p>
                            </div>
                        </div>
                        <div class="text-sm font-medium text-blue-600 report-arrow">Generate Report →</div>
                    </button>
                    <button onclick="generateReport('weekly', this)" class="bg-white p-6 rounded-xl shadow-sm border-2 border-slate-200 hover:border-yareema-primary text-left">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="w-12 h-12 bg-green-50 rounded-lg flex items-center justify-center">
                                <i data-lucide="calendar-days" class="w-6 h-6 text-green-600"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900">Weekly Report</h3>
                                <p class="text-xs text-slate-500">Last 7 days</p>
                            </div>
                        </div>
                        <div class="text-sm font-medium text-blue-600 report-arrow">Generate Report →</div>
                    </button>
                    <button onclick="generateReport('monthly', this)" class="bg-white p-6 rounded-xl shadow-sm border-2 border-slate-200 hover:border-yareema-primary text-left">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="w-12 h-12 bg-purple-50 rounded-lg flex items-center justify-center">
                                <i data-lucide="calendar-range" class="w-6 h-6 text-purple-600"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900">Monthly Report</h3>
                                <p class="text-xs text-slate-500">This month</p>
                            </div>
                        </div>
                        <div class="text-sm font-medium text-blue-600 report-arrow">Generate Report →</div>
                    </button>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-900 mb-6">Performance Charts</h3>
                    <div class="h-80 w-full">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>

                <!-- Report output renders here -->
                <div id="report-results" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hidden"></div>
            </div>
        </main>
    </div>
    <div id="modalsContainer"></div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/services.js"></script>
    <script src="assets/js/charts.js"></script>
    <script>
        Auth.protectPage();

        fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
        fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('reports');initHeader();lucide.createIcons();});
        fetch('partials/modals.html').then(r => r.text()).then(d => { document.getElementById('modalsContainer').innerHTML = d; lucide.createIcons(); });

        const reportPeriods = {
            daily:   { startDate: (() => { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString(); })(), label: "Today" },
            weekly:  { startDate: (() => { const d = new Date(); d.setDate(d.getDate() - 7); return d.toISOString(); })(), label: "Last 7 days" },
            monthly: { startDate: (() => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.toISOString(); })(), label: "This month" }
        };

        function pickTxnArray(d) {
            if (!d) return [];
            if (Array.isArray(d)) return d;
            return d.transactions || d.data || d.results || d.items || d.records || d.docs || [];
        }

        function filterByPeriod(txns, startISO) {
            const start = new Date(startISO).getTime();
            return txns.filter(t => {
                const ts = new Date(t.createdAt || t.date || t.timestamp || 0).getTime();
                return isNaN(ts) ? true : ts >= start;
            });
        }

        async function generateReport(period, btn) {
            const arrow = btn ? btn.querySelector('.report-arrow') : null;
            if (arrow) arrow.textContent = '⏳';

            const filters = reportPeriods[period];
            let txns = null;

            // 1) Try the wallet transactions endpoint (date as plain YYYY-MM-DD)
            try {
                const result = await WalletAPI.getTransactions({
                    startDate: filters.startDate.slice(0, 10),
                    limit: 100
                });
                if (result.success && result.data) {
                    txns = pickTxnArray(result.data);
                }
            } catch (e) {
                console.warn('[Reports] wallet transactions failed, will fall back:', e.message);
            }

            // 2) Fallback: use the transactions the dashboard endpoint already returns
            if (txns === null) {
                try {
                    const dash = await AgentDashboard.getDashboardData();
                    if (dash.success && dash.data) {
                        const all = pickTxnArray(dash.data.recentTransactions || dash.data.transactions || dash.data);
                        txns = filterByPeriod(all, filters.startDate);
                    }
                } catch (e) {
                    console.warn('[Reports] dashboard fallback failed:', e.message);
                }
            }

            if (arrow) arrow.textContent = '→';

            if (txns === null) {
                UI.showToast('Could not load report. Please try again shortly.', 'error');
                return;
            }
            renderReportTable(txns, filters.label);
        }

        function renderReportTable(txns, label) {
            let container = document.getElementById('report-results');
            if (!container) {
                container = document.createElement('div');
                container.id = 'report-results';
                container.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden';
                const wrap = document.querySelector('main > div:last-child') || document.body;
                wrap.appendChild(container);
            }
            container.classList.remove('hidden');

            if (!txns.length) {
                container.innerHTML = '<div class="p-8 text-center text-slate-400"><p>No transactions found for ' + label + '</p></div>';
                return;
            }

            const total = txns.reduce((s, t) => s + (t.amount || 0), 0);
            const commission = txns.reduce((s, t) => s + (t.commission || t.agentCommission || 0), 0);

            container.innerHTML = '<div class="p-4 border-b border-slate-200 flex items-center justify-between">'
                + '<h3 class="font-bold text-slate-900">Report: ' + label + '</h3>'
                + '<span class="text-xs text-slate-500">' + txns.length + ' transactions</span>'
                + '</div>'
                + '<div class="grid grid-cols-2 gap-4 p-4 bg-slate-50 border-b border-slate-200">'
                + '<div class="text-center"><p class="text-xs text-slate-500 mb-1">Total Volume</p><p class="text-xl font-bold text-slate-900">' + UI.formatCurrency(total) + '</p></div>'
                + '<div class="text-center"><p class="text-xs text-slate-500 mb-1">Commission Earned</p><p class="text-xl font-bold text-green-600">' + UI.formatCurrency(commission) + '</p></div>'
                + '</div>'
                + '<div class="overflow-x-auto"><table class="w-full text-left text-sm">'
                + '<thead><tr class="bg-slate-50 text-xs uppercase text-slate-500 font-semibold">'
                + '<th class="p-4">Service</th><th class="p-4">Description</th>'
                + '<th class="p-4">Amount</th><th class="p-4">Commission</th>'
                + '<th class="p-4">Status</th><th class="p-4">Date</th>'
                + '</tr></thead><tbody class="divide-y divide-slate-100">'
                + txns.map(t => '<tr class="hover:bg-slate-50">'
                    + '<td class="p-4 font-medium text-slate-900">' + (t.service || t.serviceType || t.type || '—') + '</td>'
                    + '<td class="p-4 text-slate-600">' + (t.description || t.details || '—') + '</td>'
                    + '<td class="p-4 font-medium">' + UI.formatCurrency(t.amount || 0) + '</td>'
                    + '<td class="p-4 font-bold text-green-600">' + UI.formatCurrency(t.commission || t.agentCommission || 0) + '</td>'
                    + '<td class="p-4"><span class="px-2 py-1 text-xs rounded-full ' + getStatusClass(t.status) + '">' + (t.status || '—') + '</span></td>'
                    + '<td class="p-4 text-slate-500 text-xs">' + UI.formatDate(t.createdAt || t.date) + '</td>'
                    + '</tr>').join('')
                + '</tbody></table></div>';
        }

        function getStatusClass(status) {
            const s = (status || '').toLowerCase();
            if (s === 'success' || s === 'completed') return 'bg-green-100 text-green-700';
            if (s === 'pending' || s === 'processing') return 'bg-yellow-100 text-yellow-700';
            if (s === 'failed' || s === 'error') return 'bg-red-100 text-red-700';
            return 'bg-slate-100 text-slate-700';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Load performance chart with real data from dashboard endpoint
            try {
                const result = await AgentDashboard.getDashboardData();
                if (result.success && result.data && typeof Charts !== 'undefined') {
                    const { weeklyPerformance, weeklyEarnings } = result.data;
                    if (weeklyPerformance && weeklyPerformance.length > 0) {
                        Charts.renderPerformanceChart(weeklyPerformance);
                    } else {
                        Charts.showEmpty('performanceChart', 'No performance data yet');
                    }
                }
            } catch (e) {
                console.warn('[Reports] Chart load failed:', e);
                if (typeof Charts !== 'undefined') Charts.showEmpty('performanceChart', 'Could not load data');
            }
        });
    </script>
</body>
</html>
