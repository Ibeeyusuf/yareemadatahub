<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',light:'#e8edf2',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="flex flex-col lg:flex-row w-full min-h-screen">
        <div id="sidebarContainer"></div>
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <div id="headerContainer"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onclick="generateReport('daily')" class="bg-white p-6 rounded-xl shadow-sm border-2 border-slate-200 hover:border-yareema-primary text-left">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center">
                                <i data-lucide="calendar" class="w-6 h-6 text-blue-600"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900">Daily Report</h3>
                                <p class="text-xs text-slate-500">Today's transactions</p>
                            </div>
                        </div>
                        <div class="text-sm font-medium text-yareema-primary">Generate Report →</div>
                    </button>
                    <button onclick="generateReport('weekly')" class="bg-white p-6 rounded-xl shadow-sm border-2 border-slate-200 hover:border-yareema-primary text-left">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="w-12 h-12 bg-green-50 rounded-lg flex items-center justify-center">
                                <i data-lucide="calendar-days" class="w-6 h-6 text-green-600"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900">Weekly Report</h3>
                                <p class="text-xs text-slate-500">Last 7 days</p>
                            </div>
                        </div>
                        <div class="text-sm font-medium text-yareema-primary">Generate Report →</div>
                    </button>
                    <button onclick="generateReport('monthly')" class="bg-white p-6 rounded-xl shadow-sm border-2 border-slate-200 hover:border-yareema-primary text-left">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="w-12 h-12 bg-purple-50 rounded-lg flex items-center justify-center">
                                <i data-lucide="calendar-range" class="w-6 h-6 text-purple-600"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900">Monthly Report</h3>
                                <p class="text-xs text-slate-500">This month</p>
                            </div>
                        </div>
                        <div class="text-sm font-medium text-yareema-primary">Generate Report →</div>
                    </button>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-900 mb-6">Performance Charts</h3>
                    <div class="h-80 w-full">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="modalsContainer"></div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/services.js"></script>
    <script src="assets/js/charts.js"></script>
    <script>
        fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();});
        fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('reports');lucide.createIcons();});
        fetch('partials/modals.html').then(r=>r.text()).then(d=>{document.getElementById('modalsContainer').innerHTML=d;lucide.createIcons();});
    </script>
</body>
</html>
