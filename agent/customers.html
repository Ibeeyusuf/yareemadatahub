<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Customers - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#1E3D5C',
                        yareema: {
                            primary: '#1E3D5C', secondary: '#16304a',
                            dark: '#0f1f2e', light: '#e8edf2',
                            success: '#10b981', warning: '#f59e0b', danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="flex flex-col lg:flex-row w-full min-h-screen">
        <div id="sidebarContainer"></div>
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <div id="headerContainer"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6">

                <!-- Page Header -->
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-xl font-bold text-slate-900">My Customers</h3>
                        <p class="text-sm text-slate-500">Customers you've served via transactions</p>
                    </div>
                    <button onclick="openModal('addCustomerModal')" class="px-4 py-2 bg-yareema-primary text-white font-medium rounded-lg hover:bg-yareema-dark transition-colors flex items-center gap-2" style="background:#1E3D5C">
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        <span>Add Customer</span>
                    </button>
                </div>

                <!-- Search -->
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input id="customerSearch" type="text" placeholder="Search customers by name or phone..." 
                            class="pl-10 pr-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 w-full"
                            oninput="filterCustomers(this.value)">
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 text-center">
                        <p class="text-2xl font-bold text-slate-900" id="custTotalCount">—</p>
                        <p class="text-xs text-slate-500 mt-1">Total Customers</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 text-center">
                        <p class="text-2xl font-bold text-slate-900" id="custActiveCount">—</p>
                        <p class="text-xs text-slate-500 mt-1">Active This Month</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 text-center">
                        <p class="text-2xl font-bold text-slate-900" id="custTotalTxns">—</p>
                        <p class="text-xs text-slate-500 mt-1">Total Transactions</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 text-center">
                        <p class="text-2xl font-bold text-slate-900" id="custTotalRevenue">—</p>
                        <p class="text-xs text-slate-500 mt-1">Total Revenue</p>
                    </div>
                </div>

                <!-- Customer Cards Grid -->
                <div id="customersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Loading state -->
                    <div id="custLoadingState" class="col-span-full flex flex-col items-center justify-center py-16 text-slate-400">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-slate-400 mb-4"></div>
                        <p class="text-sm">Loading customers...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <div id="modalsContainer"></div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/services.js"></script>
    <script>
        Auth.protectPage();

        fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
        fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('customers');initHeader();lucide.createIcons();});
        fetch('partials/modals.html').then(r => r.text()).then(d => { document.getElementById('modalsContainer').innerHTML = d; lucide.createIcons(); });

        let allCustomers = [];

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        const avatarColors = [
            'bg-blue-600', 'bg-green-600', 'bg-purple-600', 'bg-amber-600',
            'bg-pink-600', 'bg-indigo-600', 'bg-teal-600', 'bg-red-600'
        ];

        function getAvatarColor(name) {
            if (!name) return avatarColors[0];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }

        function renderCustomers(customers) {
            const grid = document.getElementById('customersGrid');
            const loading = document.getElementById('custLoadingState');
            if (loading) loading.remove();

            if (!customers || customers.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400">
                        <i data-lucide="users" class="w-12 h-12 mb-4 opacity-30"></i>
                        <p class="font-medium text-slate-600">No customers yet</p>
                        <p class="text-sm mt-1">Customers will appear here after transactions</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = customers.map(c => {
                const name = c.customerName || c.name || c.phoneNumber || 'Unknown';
                const phone = c.phoneNumber || c.phone || '—';
                const totalAmt = UI.formatCurrency(c.totalAmount || c.totalPurchases || 0);
                const txnCount = c.totalTransactions || c.transactionCount || 0;
                const color = getAvatarColor(name);
                const initials = getInitials(name);
                return `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                    <div class="flex items-start gap-4 mb-4">
                        <div class="w-12 h-12 rounded-full ${color} flex items-center justify-center text-white font-bold text-sm flex-shrink-0">${initials}</div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-slate-900 truncate">${name}</h4>
                            <p class="text-sm text-slate-500">${phone}</p>
                        </div>
                    </div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-slate-500">Total Purchases:</span>
                            <span class="font-medium text-slate-900">${totalAmt}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500">Transactions:</span>
                            <span class="font-medium text-slate-900">${txnCount}</span>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-4">
                        <button class="flex-1 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 transition-colors">View History</button>
                        <button onclick="window.location.href='service.html?type=airtime&phone=${encodeURIComponent(phone)}'" class="px-3 py-2 text-white text-sm font-medium rounded-lg transition-colors flex items-center" style="background:#1E3D5C">
                            <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');

            lucide.createIcons();
        }

        function filterCustomers(query) {
            if (!query.trim()) {
                renderCustomers(allCustomers);
                return;
            }
            const q = query.toLowerCase();
            const filtered = allCustomers.filter(c => {
                const name = (c.customerName || c.name || '').toLowerCase();
                const phone = (c.phoneNumber || c.phone || '').toLowerCase();
                return name.includes(q) || phone.includes(q);
            });
            renderCustomers(filtered);
        }

        async function loadCustomers() {
            try {
                const response = await API.get('/agent/customers');
                if (response.success || response.status === 'success') {
                    const data = response.data || {};
                    allCustomers = data.customers || data || [];

                    // Update stats
                    const el = id => document.getElementById(id);
                    if (el('custTotalCount')) el('custTotalCount').textContent = allCustomers.length;
                    if (el('custActiveCount')) el('custActiveCount').textContent = data.activeThisMonth || '—';
                    if (el('custTotalTxns')) el('custTotalTxns').textContent = data.totalTransactions || allCustomers.reduce((s, c) => s + (c.totalTransactions || 0), 0);
                    if (el('custTotalRevenue')) el('custTotalRevenue').textContent = UI.formatCurrency(data.totalRevenue || allCustomers.reduce((s, c) => s + (c.totalAmount || 0), 0));

                    renderCustomers(allCustomers);
                } else {
                    throw new Error(response.message || 'Failed to load customers');
                }
            } catch (err) {
                console.error('[Customers] Error:', err);
                document.getElementById('custLoadingState')?.remove();
                document.getElementById('customersGrid').innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400">
                        <i data-lucide="wifi-off" class="w-12 h-12 mb-4 opacity-30"></i>
                        <p class="font-medium text-slate-600">Could not load customers</p>
                        <p class="text-sm mt-1">${err.message}</p>
                        <button onclick="loadCustomers()" class="mt-4 px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm hover:bg-slate-200">Try Again</button>
                    </div>`;
                lucide.createIcons();
            }
        }

        document.addEventListener('DOMContentLoaded', loadCustomers);
    </script>
</body>
</html>
