<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e'}}}}}</script>
    <style>
        /* Modal */
        #svcOverlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;}
        #svcOverlay.active{display:flex;}
        #svcBox{background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.2);animation:slideUp .25s ease;}
        @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
        .svc-modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;background:#fff;z-index:1;border-radius:16px 16px 0 0;}
        .svc-modal-header h2{font-size:15px;font-weight:700;color:#0f172a;margin:0;}
        .close-btn{width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:none;cursor:pointer;font-size:16px;color:#64748b;display:flex;align-items:center;justify-content:center;}
        .svc-modal-body{padding:16px 20px;}
        .svc-modal-footer{display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid #f1f5f9;position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px;}
        /* Form */
        .f-group{margin-bottom:14px;}
        .f-label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
        .f-input{width:100%;padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;outline:none;color:#0f172a;box-sizing:border-box;transition:border-color .15s;}
        .f-input:focus{border-color:#1E3D5C;}
        textarea.f-input{resize:vertical;min-height:76px;}
        /* Buttons */
        .btn-p{flex:1;padding:11px 18px;background:#1E3D5C;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
        .btn-p:hover{background:#16304a;}
        .btn-p:disabled{background:#94a3b8;cursor:not-allowed;}
        .btn-s{flex:1;padding:11px 18px;background:#f8fafc;color:#64748b;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
        .btn-s:hover{background:#f1f5f9;}
        /* Network buttons */
        .net-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px;}
        .net-btn{padding:9px 4px;border-radius:8px;border:2px solid transparent;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;}
        /* Type pills */
        .type-pill{padding:6px 14px;border:1.5px solid #e2e8f0;border-radius:20px;background:#fff;color:#64748b;font-size:12px;font-weight:600;cursor:pointer;}
        .type-pill.active{border-color:#1E3D5C;background:#1E3D5C;color:#fff;}
        /* Meter type buttons */
        .meter-btn{padding:10px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;width:100%;}
        .meter-btn.active{border-color:#1E3D5C;background:#1E3D5C;color:#fff;}
        /* Provider buttons (TV) */
        .prov-btn{padding:9px 6px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;}
        .prov-btn.active{border-color:#1E3D5C;background:#1E3D5C;color:#fff;}
        /* Inline error */
        .inline-err{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:9px 12px;margin-bottom:12px;color:#dc2626;font-size:13px;display:flex;align-items:flex-start;gap:8px;}
        /* Service cards */
        .svc-tile{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .2s;}
        .svc-tile:hover{border-color:#1E3D5C;box-shadow:0 4px 16px rgba(30,61,92,.12);transform:translateY(-2px);}
        .svc-tile .ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
        .svc-tile .lbl{font-size:11px;font-weight:600;color:#334155;text-align:center;}
        /* Verification card */
        .verify-card{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:13px;margin-bottom:14px;}
        /* Info box */
        .info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:11px 13px;margin-bottom:14px;color:#1d4ed8;font-size:13px;}
        /* Summary box */
        .sum-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:14px;}
        .sum-row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;}
        .sum-row:last-child{margin-bottom:0;}
        /* PIN display */
        .pin-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
        .pin-val{font-size:20px;font-weight:700;color:#1E3D5C;letter-spacing:3px;}
    </style>
</head>
<body class="text-slate-800 antialiased">

<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1">

            <div class="mb-5">
                <h2 class="text-xl font-bold text-slate-900">Services</h2>

            <!-- Telecom -->

                <div class="svc-tile" onclick="M.open('data')">

                </div>
                <div class="svc-tile" onclick="M.open('sms')">

                    <span class="lbl">Bulk SMS</span>
                </div>
                <div class="svc-tile" onclick="M.open('rechargepin')">
                    <div class="ico" style="background:#fdf4ff"><i data-lucide="ticket" style="width:20px;height:20px;color:#a21caf"></i></div>
                    <span class="lbl">Airtime PIN</span>
                </div>
            </div>

            <!-- Bills -->
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Bill Payments</p>
            <div class="grid grid-cols-4 gap-3 mb-6">
                <div class="svc-tile" onclick="M.open('electricity')">
                    <div class="ico" style="background:#fffbeb"><i data-lucide="zap" style="width:20px;height:20px;color:#d97706"></i></div>
                    <span class="lbl">Electricity</span>
                </div>
                <div class="svc-tile" onclick="M.open('tv')">

                </div>
                <div class="svc-tile" onclick="window.location.href='rrr-payment.html'">
                    <div class="ico" style="background:#fef2f2"><i data-lucide="credit-card" style="width:20px;height:20px;color:#dc2626"></i></div>

<!-- MODAL -->
<div id="svcOverlay" onclick="if(event.target===this)M.close()">
    <div id="svcBox">
        <div class="svc-modal-header">
            <h2 id="svcTitle">Service</h2>
            <button class="close-btn" onclick="M.close()">&#215;</button>
        </div>
        <div class="svc-modal-body" id="svcBody"></div>
        <div class="svc-modal-footer" id="svcFoot"></div>
    </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
// ─── MODAL CORE ────────────────────────────────────────────────────────────────
const M = {
    open(type) {
        const map = { data:showData, airtime:showAirtime, electricity:showElec, tv:showTV, education:showEdu, sms:showSMS, swap:showSwap, rechargepin:showPin };
        (map[type] || (() => M.err('Service not available')))();
    },
    show(title, body, foot) {
        document.getElementById('svcTitle').textContent = title;
        document.getElementById('svcBody').innerHTML   = body;
        document.getElementById('svcFoot').innerHTML   = foot;
        document.getElementById('svcOverlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    },
    close() {
        document.getElementById('svcOverlay').classList.remove('active');
        document.body.style.overflow = '';
    },
    err(msg) {
        M.show('Error',
            `<div style="text-align:center;padding:20px"><div style="width:52px;height:52px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div><p style="font-size:14px;color:#0f172a">${msg}</p></div>`,
            `<button class="btn-p" onclick="M.close()">Close</button>`);
    },
    ok(html) {
        M.show('Success',
            `<div style="text-align:center;padding:16px"><div style="width:52px;height:52px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>${html}</div>`,
            `<button class="btn-p" onclick="M.close()">Done</button>`);
    },
    inlineErr(msg) {
        document.getElementById('inlineErr')?.remove();
        const el = document.createElement('div');
        el.id = 'inlineErr'; el.className = 'inline-err';
        el.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span style="flex:1">${msg}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#dc2626;cursor:pointer;padding:0;font-size:16px">&#215;</button>`;
        document.getElementById('svcFoot')?.insertAdjacentElement('beforebegin', el);
        setTimeout(() => el.remove(), 6000);
    },
    loading(on, orig) {
        const b = document.querySelector('#svcFoot .btn-p');
        if (!b) return;
        if (on) { b._o = b.textContent; b.disabled = true; b.textContent = 'Processing...'; b.style.opacity = '.7'; }
        else     { b.disabled = false;  b.textContent = orig || b._o; b.style.opacity = '1'; }
    }
};

function _esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function _v(id)  { return document.getElementById(id)?.value?.trim() || ''; }

// ─── NETWORK BUTTONS ───────────────────────────────────────────────────────────
const NET_C = {
    mtn:     'background:#FFCC00;color:#000;border-color:#FFCC00;',
    airtel:  'background:#FF0000;color:#fff;border-color:#FF0000;',
    glo:     'background:#00A86B;color:#fff;border-color:#00A86B;',
    '9mobile':'background:#006400;color:#fff;border-color:#006400;'
};
const NET_I = 'background:#f8fafc;color:#64748b;border-color:#e2e8f0;';

function netBtns(cls, fn) {
    return `<div class="net-grid">
        <button class="${cls}" data-n="mtn"     onclick="${fn}('mtn')"     style="${NET_C.mtn}">MTN</button>
        <button class="${cls}" data-n="airtel"  onclick="${fn}('airtel')"  style="${NET_I}">Airtel</button>
        <button class="${cls}" data-n="glo"     onclick="${fn}('glo')"     style="${NET_I}">Glo</button>
        <button class="${cls}" data-n="9mobile" onclick="${fn}('9mobile')" style="${NET_I}">9mobile</button>
    </div>`;
}
function setNet(cls, n) {
    document.querySelectorAll(`.${cls}[data-n]`).forEach(b => {
        b.style.cssText = b.dataset.n === n
            ? `${NET_C[n]}border-radius:8px;padding:9px 4px;font-weight:700;font-size:12px;cursor:pointer;border:2px solid;`
            : `${NET_I}border-radius:8px;padding:9px 4px;font-weight:700;font-size:12px;cursor:pointer;border:2px solid;`;
    });
}

// ─── EXTRACT PLANS from API response ──────────────────────────────────────────
// Actual API shape: { status, data: { services: { data_recharge: [...] } } }
// With dataType param: { status, data: [...plans] }  OR same shape above filtered
function extractDataPlans(res, network, dataType) {
    let plans = [];
    if (Array.isArray(res.data)) {
        // Direct array (returned when dataType is specified)
        plans = res.data.filter(p => (p.sellingPrice || p.price || p.amount) > 0);
    } else if (res.data?.services?.data_recharge) {
        // Main shape without dataType
        const all = res.data.services.data_recharge;
        // Filter by dataType if we have it
        if (dataType) {
            plans = all.filter(p => (p.dataType || p.category || '').toLowerCase() === dataType.toLowerCase());
            if (!plans.length) plans = all; // fallback: return all if filter empty
        } else {
            plans = all;
        }
        // Filter by network
        const netPlans = plans.filter(p => (p.network || p.provider || '').toLowerCase() === network.toLowerCase());
        if (netPlans.length) plans = netPlans;
    } else if (res.data && Array.isArray(res.data[network.toLowerCase()])) {
        plans = res.data[network.toLowerCase()];
    } else if (res.data?.MOBILE_NETWORK) {
        const km = { mtn:'MTN', glo:'Glo', '9mobile':'m_9mobile', airtel:'Airtel' };
        const nd = res.data.MOBILE_NETWORK[km[network.toLowerCase()] || network];
        if (Array.isArray(nd) && nd[0]?.PRODUCT)
            plans = nd[0].PRODUCT.map(p => ({ _id:p.PRODUCT_ID, planName:p.PRODUCT_NAME, sellingPrice:p.PRODUCT_AMOUNT }));
    } else if (Array.isArray(res)) {
        plans = res;
    }
    return sortDataPlans(plans);
}

function extractCablePlans(res, provider) {
    let plans = [];
    if (res.data?.services) {
        const svc = res.data.services;
        const raw = svc.cable_tv || svc.cable || svc.cabletv || [];
        plans = raw.filter(p => (p.provider || p.network || '').toLowerCase() === provider.toLowerCase());
        if (!plans.length) plans = raw;
    } else if (res.data?.TV_ID) {
        const km = { dstv:'DStv', gotv:'GOtv', startimes:'Startimes', showmax:'Showmax' };
        const k  = km[provider.toLowerCase()];
        if (k && res.data.TV_ID[k]) {
            const d = res.data.TV_ID[k];
            if (Array.isArray(d) && d[0]?.PRODUCT) plans = d[0].PRODUCT;
        }
    } else if (Array.isArray(res.data)) {
        plans = res.data.filter(p => (p.provider||'').toLowerCase() === provider.toLowerCase());
        if (!plans.length) plans = res.data;
    }
    return plans;
}

function planLabel(p) {
    return p.dataAmount || p.planName || p.name || p.plan || 'Plan';
}
function planPrice(p) {
    return p.sellingPrice || p.price || p.amount || p.PRODUCT_AMOUNT || 0;
}
function planSizeInMB(p) {
    const text = String(p.size || p.dataAmount || p.planName || p.name || '').toUpperCase();
    const match = text.match(/(\d+(?:\.\d+)?)\s*(TB|GB|MB)/);
    if (!match) return Number.POSITIVE_INFINITY;
    const value = Number(match[1]);
    return match[2] === 'TB' ? value * 1024 * 1024 : match[2] === 'GB' ? value * 1024 : value;
}
function sortDataPlans(plans) {
    return [...plans].sort((left, right) => {
        const priceDifference = Number(planPrice(left)) - Number(planPrice(right));
        return priceDifference || planSizeInMB(left) - planSizeInMB(right);
    });
}
function planId(p) {
    return p._id || p.planCode || p.id || p.planId || p.PRODUCT_ID || '';
}
function cablePlanLabel(p) {
    return p.planName || p.PACKAGE_NAME || p.PRODUCT_NAME || p.name || p.description || 'Package';
}
function cablePlanId(p) {
    return p._id || p.planCode || p.PACKAGE_ID || p.PRODUCT_CODE || p.id || p.planId || '';
}

// ═══════════════════════════════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════════════════════════════
let _dNet = 'mtn', _dPlans = [], _dType = null;

function showData() {
    _dNet = 'mtn'; _dPlans = []; _dType = null;
    M.show('Buy Data', `
        <div class="f-group">
            <label class="f-label">Network</label>
            ${netBtns('dnet-btn', 'selDNet')}
        </div>
        <div class="f-group">
            <label class="f-label">Data Type</label>
            <div id="dTypeWrap" style="display:flex;flex-wrap:wrap;gap:8px;min-height:32px">
                <span style="color:#94a3b8;font-size:13px;line-height:32px">Loading...</span>
            </div>
        </div>
        <div class="f-group">
            <label class="f-label">Phone Number</label>
            <input type="tel" id="dPhone" maxlength="11" placeholder="08012345678" class="f-input">
        </div>
        <div class="f-group">
            <label class="f-label">Select Plan</label>
            <select id="dPlan" class="f-input" disabled>
                <option value="">Select data type first...</option>
            </select>
        </div>
        <div class="f-group">
            <label class="f-label">Transaction PIN</label>
            <input type="password" id="dPin" maxlength="4" placeholder="••••" class="f-input">
        </div>
    `, `<button class="btn-s" onclick="M.close()">Cancel</button>
        <button class="btn-p" onclick="submitData()">Buy Data</button>`);
    loadDTypes('mtn');
}

function selDNet(n) {
    _dNet = n; _dType = null; _dPlans = [];
    setNet('dnet-btn', n);
    const ps = document.getElementById('dPlan');
    if (ps) { ps.innerHTML = '<option value="">Select data type first...</option>'; ps.disabled = true; }
    const tw = document.getElementById('dTypeWrap');
    if (tw) tw.innerHTML = '<span style="color:#94a3b8;font-size:13px;line-height:32px">Loading...</span>';
    loadDTypes(n);
}

async function loadDTypes(n) {
    const tw = document.getElementById('dTypeWrap');
    try {
        const res = await API.get(`${API_CONFIG.ENDPOINTS.DATA_PLANS}?network=${n}`);
        const types = res.availableDataTypes;
        if (!tw) return;
        if (!types || !types.length) { tw.innerHTML = '<span style="color:#dc2626;font-size:13px">No types available</span>'; return; }
        tw.innerHTML = types.map(t =>
            `<button class="type-pill" data-t="${t}" onclick="selDType('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`
        ).join('');
    } catch(e) {
        if (tw) tw.innerHTML = '<span style="color:#dc2626;font-size:13px">Failed to load types</span>';
    }
}

async function selDType(t) {
    _dType = t; _dPlans = [];
    document.querySelectorAll('.type-pill[data-t]').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    const ps = document.getElementById('dPlan');
    if (ps) { ps.innerHTML = '<option value="">Loading plans...</option>'; ps.disabled = true; }
    try {
        const res = await API.get(`${API_CONFIG.ENDPOINTS.DATA_PLANS}?network=${_dNet}&dataType=${t}`);
        _dPlans = extractDataPlans(res, _dNet, t);
        if (!ps) return;
        if (!_dPlans.length) {
            ps.innerHTML = '<option value="">No plans for this type</option>';
            ps.disabled = true; return;
        }
        ps.disabled = false;
        ps.innerHTML = '<option value="">Choose a plan</option>' + _dPlans.map((p, i) => {
            const validity = p.validity ? ` (${p.validity})` : '';
            const price    = planPrice(p);
            return `<option value="${i}">${planLabel(p)}${validity} — &#8358;${Number(price).toLocaleString()}</option>`;
        }).join('');
    } catch(e) {
        if (ps) { ps.innerHTML = '<option value="">Failed to load plans</option>'; ps.disabled = true; }
    }
}

async function submitData() {
    const phone = _v('dPhone'), pi = _v('dPlan'), pin = _v('dPin');
    if (!phone || !/^\d{11}$/.test(phone)) { M.inlineErr('Enter a valid 11-digit phone number'); return; }
    if (pi === '' || !_dPlans.length)       { M.inlineErr('Please select a data plan'); return; }

    if (!amount || amount <= 0) { M.inlineErr('Could not determine plan amount. Please try again.'); return; }
    const pid = String(planId(plan)).replace(/\.0$/, '');
    if (!pid) { M.inlineErr('Could not identify selected plan. Please try again.'); return; }
    if (!pin || !/^\d{4}$/.test(pin)) { M.inlineErr('Enter your 4-digit transaction PIN'); return; }

    } catch(e) {
        M.loading(false, 'Buy Data');
        M.inlineErr(e.message || 'Purchase failed. Please try again.');
    }
}

async function verifyMeter() {
    const disco = _v('eDisco'), meter = _v('eMeter'), mt = window._eMT || 'prepaid';

        const d   = res.data || res;
        // Extract customer name from various possible response shapes
        const cName = d.raw?.data?.content?.Customer_Name || d.customerName || d.customer?.name || d.name;
        const cAddr = d.raw?.data?.content?.Address || d.customerAddress || d.customer?.address || d.address;
        const minAmt = d.raw?.data?.content?.Minimum_Amount || d.minimumAmount;
        if (!cName || cName === 'N/A') {
            btn.disabled = false; btn.textContent = 'Verify Meter';
            M.inlineErr('Meter not found. Check the number and disco selection.'); return;

        if (minAmt) { const ai = document.getElementById('eAmt'); if (ai) { ai.placeholder = `Min &#8358;${minAmt.toLocaleString()}`; ai.min = minAmt; } }

async function payElec() {
    if (!_eV) { M.inlineErr('Please verify meter first'); return; }

    if (_eV.minimumAmount && amount < _eV.minimumAmount) { M.inlineErr(`Min amount is &#8358;${_eV.minimumAmount.toLocaleString()}`); return; }

    if (!pin || !/^\d{4}$/.test(pin))  { M.inlineErr('Enter your 4-digit transaction PIN'); return; }

    btn.disabled = true; btn.textContent = 'Processing...';
    try {
        const res = await API.post(API_CONFIG.ENDPOINTS.ELECTRICITY_PURCHASE, {
            meterNumber: _eV.meter, disco: _eV.disco, meterType: _eV.meterType,
            amount, phoneNumber: phone, transactionPin: pin
        });

                   || res.data?.raw?.data?.content?.Token || res.data?.raw?.data?.token || '';

        ), 300);
    } catch(e) {
        btn.disabled = false; btn.textContent = 'Pay Now';
        M.inlineErr(e.message || 'Payment failed. Please try again.');
    }
}

            }).join('');
            M.show('Recharge PINs',
                `<div style="background:#dcfce7;border:1px solid #bbf7d0;border-radius:8px;padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><span style="color:#15803d;font-size:13px;font-weight:600">${pins.length} × &#8358;${amt} ${net.toUpperCase()} PIN${pins.length>1?'s':''} purchased</span></div>${cards}${ref?`<p style="font-size:11px;color:#cbd5e1;text-align:center;margin-top:8px">Ref: ${ref}</p>`:''}`,
                `<button class="btn-p" onclick="M.close()">Done</button>`);
        }, 300);
    } catch(e) {
        M.loading(false, 'Purchase');
        M.inlineErr(e.message || 'Purchase failed. Please try again.');
    }
}

function cpPin(id, btn) {
    const p = document.getElementById(id)?.textContent?.trim();
    if (!p) return;
    navigator.clipboard.writeText(p).then(() => {
        const o = btn.innerHTML; btn.innerHTML = '✓'; btn.style.background = '#16a34a';
        setTimeout(() => { btn.innerHTML = o; btn.style.background = '#1E3D5C'; }, 2000);
    });
}

// ═══════════════════════════════════════════════════════════════════════════════
//  AIRTIME2CASH (multi-step: details -> OTP -> confirm)
// ═══════════════════════════════════════════════════════════════════════════════
let _a2c = { network: 'mtn', phone: '', amount: 0, sessionId: null, balance: null, tariff: null, limits: null };

async function showSwap() {
    _a2c = { network: 'mtn', phone: '', amount: 0, sessionId: null, balance: null, tariff: null, limits: null };
    M.show('Airtime to Cash', `<div style="text-align:center;padding:24px 0"><p style="font-size:13px;color:#64748b">Loading network limits...</p></div>`, '');
    try {
        const res = await API.get(API_CONFIG.ENDPOINTS.A2C_NETWORK_LIMITS);
        _a2c.limits = res.data || res;
    } catch (e) {
        _a2c.limits = null;
    }
    a2cStepAmount();
}

function a2cLimit(n) {
    const l = _a2c.limits;
    if (!l) return null;
    return l[n] || l[(n||'').toUpperCase()] || l[(n||'').toLowerCase()] || null;
}
function a2cHint(n) {
    const lim = a2cLimit(n);
    return lim ? `Min &#8358;${lim.min.toLocaleString()} — Max &#8358;${lim.max.toLocaleString()}` : 'Enter amount';
}

function a2cStepAmount() {
    M.show('Airtime to Cash', `
        <p style="font-size:12px;color:#94a3b8;margin:-4px 0 16px">Step 1 of 3 — Details</p>
        <div class="f-group">
            <label class="f-label">Network</label>
            ${netBtns('a2c-net-btn', 'selA2CNet')}
        </div>
        <div class="f-group">
            <label class="f-label">Phone Number (line with the airtime)</label>
            <input type="tel" id="a2cPhone" maxlength="11" placeholder="08012345678" class="f-input" value="${_a2c.phone}">
        </div>
        <div class="f-group">
            <label class="f-label">Amount to Convert (&#8358;)</label>
            <input type="number" id="a2cAmt" placeholder="Enter amount" class="f-input" value="${_a2c.amount || ''}">
            <p id="a2cHint" style="font-size:12px;color:#94a3b8;margin-top:4px">${a2cHint(_a2c.network)}</p>
        </div>
    `, `<button class="btn-s" onclick="M.close()">Cancel</button>
        <button class="btn-p" onclick="submitA2CDetails()">Send OTP</button>`);
    setNet('a2c-net-btn', _a2c.network);
}

function selA2CNet(n) {
    _a2c.network = n;
    setNet('a2c-net-btn', n);
    const hintEl = document.getElementById('a2cHint');
    if (hintEl) hintEl.innerHTML = a2cHint(n);
}

async function submitA2CDetails() {
    const phone  = _v('a2cPhone'), amount = +_v('a2cAmt');
    if (!phone || phone.length !== 11) { M.inlineErr('Enter a valid 11-digit phone number'); return; }
    if (!amount || amount <= 0)        { M.inlineErr('Enter an amount'); return; }

    const lim = a2cLimit(_a2c.network);
    if (lim && (amount < lim.min || amount > lim.max)) {
        M.inlineErr(`Amount must be between &#8358;${lim.min.toLocaleString()} and &#8358;${lim.max.toLocaleString()} for ${_a2c.network.toUpperCase()}`);
        return;
    }

    _a2c.phone = phone; _a2c.amount = amount;
    M.loading(true);
    try {
        const res = await API.post(API_CONFIG.ENDPOINTS.A2C_GENERATE_OTP, { networkName: _a2c.network.toUpperCase(), sender: phone });
        M.loading(false, 'Send OTP');
        a2cStepOTP(res.message);
    } catch (e) {
        M.loading(false, 'Send OTP');
        M.inlineErr(e.message || 'Unable to send OTP. Please try again.');
    }
}

function a2cStepOTP(sentMessage) {
    M.show('Verify OTP', `
        <p style="font-size:12px;color:#94a3b8;margin:-4px 0 16px">Step 2 of 3 — Verify OTP</p>
        <p style="font-size:13px;color:#64748b;margin-bottom:16px">${sentMessage || `We sent a code to ${_a2c.phone}`}</p>
        <div class="f-group">
            <label class="f-label">Enter OTP</label>
            <input type="text" id="a2cOtp" maxlength="6" inputmode="numeric" placeholder="123456"
                   class="f-input" style="letter-spacing:4px;text-align:center;font-size:18px">
        </div>
        <p style="text-align:center;font-size:12px">
            <a href="#" onclick="resendA2COTP();return false;" style="color:#1E3D5C;font-weight:600">Resend OTP</a>
        </p>
    `, `<button class="btn-s" onclick="a2cStepAmount()">Back</button>
        <button class="btn-p" onclick="submitA2COTP()">Verify</button>`);
}

async function resendA2COTP() {
    try {
        await API.post(API_CONFIG.ENDPOINTS.A2C_GENERATE_OTP, { networkName: _a2c.network.toUpperCase(), sender: _a2c.phone });
        M.inlineErr('A new OTP has been sent.');
    } catch (e) {
        M.inlineErr(e.message || 'Unable to resend OTP.');
    }
}

async function submitA2COTP() {
    const otp = _v('a2cOtp');
    if (!otp || otp.length < 4) { M.inlineErr('Enter the OTP sent to your phone'); return; }

    M.loading(true);
    try {
        const verifyRes  = await API.post(API_CONFIG.ENDPOINTS.A2C_VERIFY_OTP, { networkName: _a2c.network.toUpperCase(), sender: _a2c.phone, otp });
        const verifyData = verifyRes.data || verifyRes;
        _a2c.sessionId = verifyData.sessionId;
        _a2c.balance   = verifyData.airtimeBalance;
        _a2c.tariff    = verifyData.tariff;

        await API.post(API_CONFIG.ENDPOINTS.A2C_LOGIN_SESSION, { networkName: _a2c.network.toUpperCase(), sender: _a2c.phone, sessionId: _a2c.sessionId });
        const quotaRes  = await API.post(API_CONFIG.ENDPOINTS.A2C_CHECK_QUOTA, { networkName: _a2c.network.toUpperCase(), amount: _a2c.amount });
        const quotaData = quotaRes.data || quotaRes;

        if (quotaData.available === false) {
            M.loading(false, 'Verify');
            M.inlineErr(quotaData.message || 'No recipient is available for this amount right now. Try a different amount.');
            return;
        }

        M.loading(false);
        a2cStepConfirm();
    } catch (e) {
        M.loading(false, 'Verify');
        M.inlineErr(e.message || 'Invalid or expired OTP. Please try again.');
    }
}

function a2cStepConfirm() {
    M.show('Confirm Conversion', `
        <p style="font-size:12px;color:#94a3b8;margin:-4px 0 16px">Step 3 of 3 — Confirm</p>
        <div style="padding:14px;background:#f8fafc;border-radius:10px;margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0">
                <span style="color:#64748b">Network</span><strong>${_a2c.network.toUpperCase()}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0">
                <span style="color:#64748b">Phone</span><strong>${_a2c.phone}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0">
                <span style="color:#64748b">Airtime Balance</span><strong>${_a2c.balance || '—'}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0">
                <span style="color:#64748b">Amount to Convert</span><strong>&#8358;${_a2c.amount.toLocaleString()}</strong>
            </div>
        </div>
        <div class="f-group">
            <label class="f-label">Transaction PIN</label>
            <input type="password" id="a2cPin" maxlength="4" placeholder="••••" class="f-input">
        </div>
    `, `<button class="btn-s" onclick="M.close()">Cancel</button>
        <button class="btn-p" onclick="submitA2CTransfer()">Convert to Cash</button>`);
}

async function submitA2CTransfer() {
    const pin = _v('a2cPin');
    if (!pin || !/^\d{4}$/.test(pin)) { M.inlineErr('Enter your 4-digit transaction PIN'); return; }

    M.loading(true);
    try {
        const res  = await API.post(API_CONFIG.ENDPOINTS.A2C_TRANSFER, {
            networkName: _a2c.network.toUpperCase(),
            sender: _a2c.phone,
            amount: _a2c.amount,
            pin,
            sessionId: _a2c.sessionId,
            transactionPin: pin
        });
        const data = res.data || res;
        M.close();

        if (data.status === 'pending') {
            setTimeout(() => M.ok(`<p style="font-size:15px;font-weight:600;margin-bottom:4px">Conversion Pending</p><p style="font-size:13px;color:#64748b">&#8358;${_a2c.amount.toLocaleString()} airtime conversion is being processed. We'll notify you once confirmed.</p>`), 300);
        } else {
            const received = data.amountConverted != null ? data.amountConverted : _a2c.amount;
            setTimeout(() => M.ok(`<p style="font-size:15px;font-weight:600;margin-bottom:4px">Conversion Successful!</p><p style="font-size:13px;color:#64748b">&#8358;${_a2c.amount.toLocaleString()} airtime → <strong style="color:#16a34a">&#8358;${received.toLocaleString()}</strong> cash</p>`), 300);
        }
    } catch (e) {
        M.loading(false, 'Convert to Cash');
        M.inlineErr(e.message || 'Conversion failed. Please try again.');
    }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  BULK SMS
// ═══════════════════════════════════════════════════════════════════════════════
function showSMS() {
    M.show('Bulk SMS', `
        <div class="f-group">
            <label class="f-label">Sender ID <span style="font-weight:400;text-transform:none;color:#94a3b8">(max 11 chars)</span></label>
            <input type="text" id="smsSdr" value="Yareema" maxlength="11" class="f-input">
        </div>
        <div class="f-group">
            <label class="f-label">Recipients <span style="font-weight:400;text-transform:none;color:#94a3b8">(comma-separated)</span></label>
            <textarea id="smsPh" rows="3" class="f-input" placeholder="08012345678, 09050030090, ..." oninput="calcSMS()"></textarea>
        </div>
        <div class="f-group">
            <label class="f-label">Message <span id="smsChars" style="font-weight:400;text-transform:none;color:#94a3b8">0/160</span></label>
            <textarea id="smsMsg" rows="4" maxlength="160" class="f-input" placeholder="Type your message..." oninput="calcSMS()"></textarea>
        </div>
        <div class="sum-box">
            <div class="sum-row"><span style="color:#64748b">Recipients</span><span id="smsRC" style="font-weight:700;color:#0f172a">0</span></div>
            <div class="sum-row"><span style="color:#64748b">Pages</span><span id="smsPG" style="font-weight:700;color:#0f172a">1</span></div>
            <div class="sum-row"><span style="color:#64748b">Est. units</span><span id="smsUU" style="font-weight:700;color:#0f172a">0</span></div>
        </div>
        <div class="f-group">
            <label class="f-label">Transaction PIN</label>
            <input type="password" id="smsPin" maxlength="4" placeholder="••••" class="f-input">
        </div>
    `, `<button class="btn-s" onclick="M.close()">Cancel</button>
        <button class="btn-p" onclick="submitSMS()">Send SMS</button>`);
    document.getElementById('smsMsg')?.addEventListener('input', function() {
        document.getElementById('smsChars').textContent = this.value.length + '/160';
        calcSMS();
    });
}

function calcSMS() {
    const ph = (_v('smsPh') || '').split(',').map(p => p.trim()).filter(Boolean);
    const ml = (_v('smsMsg') || '').length;
    const pg = Math.max(1, Math.ceil(ml / 160));
    document.getElementById('smsRC').textContent = ph.length;
    document.getElementById('smsPG').textContent = pg;
    document.getElementById('smsUU').textContent = ph.length * pg;
}

async function submitSMS() {
    const sdr = _v('smsSdr'), msg = _v('smsMsg'), pin = _v('smsPin');
    const ph  = (_v('smsPh') || '').split(',').map(p => p.trim()).filter(Boolean);
    if (!sdr)                    { M.inlineErr('Enter a Sender ID'); return; }
    if (sdr.length > 11)         { M.inlineErr('Sender ID must be max 11 characters'); return; }
    if (!ph.length)              { M.inlineErr('Enter at least one recipient number'); return; }
    if (!msg)                    { M.inlineErr('Enter a message'); return; }
    if (!/^\d{4}$/.test(pin))    { M.inlineErr('Enter your 4-digit transaction PIN'); return; }
    const inv = ph.filter(p => !/^\d{10,14}$/.test(p));
    if (inv.length) { M.inlineErr(`Invalid number(s): ${inv.slice(0,3).join(', ')}${inv.length>3?'…':''}`); return; }
    M.loading(true);
    try {
        const res  = await API.post(API_CONFIG.ENDPOINTS.SMS_SEND, { from:sdr, to:ph.join(','), body:msg, gateway:'direct-corporate', appendSender:'hosted', transactionPin:pin });
        const sent = res.data?.sent ?? res.data?.messageCount ?? ph.length;
        M.close();
        setTimeout(() => M.ok(`<p style="font-size:15px;font-weight:600;margin-bottom:4px">SMS Sent!</p><p style="font-size:13px;color:#64748b">${sent} message${sent!==1?'s':''} delivered</p>${res.data?.reference?`<p style="font-size:12px;color:#94a3b8;margin-top:4px">Ref: ${res.data.reference}</p>`:''}`), 300);
    } catch(e) {
        M.loading(false, 'Send SMS');
        M.inlineErr(e.message || 'Failed to send SMS. Please try again.');
    }
}
