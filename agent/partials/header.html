<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="flex items-center justify-between px-4 lg:px-8 py-4">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-700">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div>
                <h2 class="text-xl font-bold text-slate-900" id="pageTitle">Dashboard</h2>
                <p class="text-sm text-slate-500" id="pageSubtitle">Welcome back!</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleLanguage()" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors flex items-center gap-2">
                <i data-lucide="globe" class="w-5 h-5"></i>
                <span class="hidden sm:inline text-sm font-medium" id="langToggle">EN</span>
            </button>
            <div class="relative">
                <button onclick="toggleNotifications()" class="relative p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors" id="notificationBtn">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="notification-badge hidden" id="notifBadge">0</span>
                </button>

                <div id="notificationDropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl border border-slate-200 z-50">
                    <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                        <h3 class="font-bold text-slate-900">Notifications</h3>
                        <button onclick="markAllAsRead()" class="text-xs text-blue-600 hover:underline">Mark all as read</button>
                    </div>
                    <div class="max-h-96 overflow-y-auto" id="notificationsBody">
                        <div class="p-8 text-center text-slate-400 text-sm">
                            <i data-lucide="bell-off" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                            <p>No notifications yet</p>
                        </div>
                    </div>
                    <div class="p-3 border-t border-slate-200 text-center">
                        <a href="reports.html" class="text-sm text-blue-600 hover:underline font-medium">View all activity</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
// Called explicitly by each page after this header partial is injected
function initHeader() {
    try {
        var agent = (typeof API !== 'undefined') ? API.getAgentData() : null;
        if (!agent) {
            try { agent = JSON.parse(localStorage.getItem('agentData')); } catch(e) {}
        }
        if (agent) {
            var name = agent.fullName || agent.name ||
                (agent.firstName ? agent.firstName : null);
            var subtitle = document.getElementById('pageSubtitle');
            if (subtitle && name) {
                subtitle.textContent = 'Welcome back, ' + name.split(' ')[0] + '!';
            }
        }
    } catch(e) { console.warn('[initHeader] error:', e); }
}

function toggleNotifications() {
    var dropdown = document.getElementById('notificationDropdown');
    dropdown.classList.toggle('hidden');
    if (!dropdown.classList.contains('hidden')) {
        setTimeout(function() {
            document.addEventListener('click', closeNotificationsOnClickOutside);
        }, 100);
    }
}

function closeNotificationsOnClickOutside(e) {
    var dropdown = document.getElementById('notificationDropdown');
    var btn = document.getElementById('notificationBtn');
    if (dropdown && btn && !dropdown.contains(e.target) && !btn.contains(e.target)) {
        dropdown.classList.add('hidden');
        document.removeEventListener('click', closeNotificationsOnClickOutside);
    }
}

function markAllAsRead() {
    document.querySelectorAll('.notif-dot').forEach(function(dot) {
        dot.classList.add('hidden');
    });
    var badge = document.getElementById('notifBadge');
    if (badge) badge.classList.add('hidden');
    if (typeof showToast === 'function') showToast('All notifications marked as read', 'success');
}
</script>
