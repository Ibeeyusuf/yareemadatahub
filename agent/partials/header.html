<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="flex items-center justify-between px-4 lg:px-8 py-4">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-700">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div>
                <h2 class="text-xl font-bold text-slate-900" id="pageTitle">Dashboard</h2>
                <p class="text-sm text-slate-500" id="pageSubtitle">Welcome back!</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleLanguage()" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors flex items-center gap-2">
                <i data-lucide="globe" class="w-5 h-5"></i>
                <span class="hidden sm:inline text-sm font-medium" id="langToggle">EN</span>
            </button>

            <!-- Notification Bell -->
            <div class="relative">
                <button onclick="agentToggleNotifications()" id="agentNotifBtn"
                    class="relative p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span id="agentNotifBadge"
                        style="position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 4px;display:none;align-items:center;justify-content:center;border:2px solid #fff;line-height:1;">0</span>
                </button>

                <div id="agentNotifDropdown"
                    style="display:none;position:absolute;right:0;top:calc(100% + 8px);width:320px;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.15);border:1px solid #e2e8f0;z-index:9999;overflow:hidden">
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #f1f5f9;background:#f8fafc">
                        <span style="font-size:14px;font-weight:700;color:#1e293b">Notifications</span>
                        <button onclick="agentMarkAllRead()" style="font-size:12px;color:#2563eb;background:none;border:none;cursor:pointer;font-weight:500">Mark all read</button>
                    </div>
                    <div id="agentNotifList" style="max-height:320px;overflow-y:auto"></div>
                    <div style="padding:10px 16px;border-top:1px solid #f1f5f9;background:#f8fafc;text-align:center">
                        <a href="wallet.html" style="font-size:12px;color:#2563eb;font-weight:500;text-decoration:none">View wallet →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
