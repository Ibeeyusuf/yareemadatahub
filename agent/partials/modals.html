<!-- Withdrawal Modal -->
<div id="withdrawModal" class="modal">
    <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4">
        <div class="p-6 border-b border-slate-200 flex items-center justify-between">
            <h3 class="text-xl font-bold text-slate-900" data-en="Withdraw Earnings" data-ha="Karbi Riba">Withdraw Earnings</h3>
            <button onclick="closeModal('withdrawModal')" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <form onsubmit="handleWithdrawalSubmit(event)" class="p-6 space-y-4">
            <div class="p-4 bg-green-50 border border-green-200 rounded-xl">
                <p class="text-xs text-slate-600 mb-1" data-en="Available Balance" data-ha="Kudin Da Ake Da Shi">Available Balance</p>
                <p id="withdrawAvailableBalance" class="text-2xl font-bold text-green-600">₦0.00</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2" data-en="Amount to Withdraw" data-ha="Adadin Da Za A Karɓa">Amount to Withdraw</label>
                <input id="withdrawAmount" type="number" placeholder="Enter amount" min="1000" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary focus:border-transparent w-full" required>
                <p class="text-xs text-slate-400 mt-1">Minimum: ₦1,000</p>
            </div>
            <div id="withdrawMsg" class="hidden text-sm p-3 rounded-lg"></div>
            <div class="flex gap-3 pt-2">
                <button type="submit" id="withdrawSubmitBtn" class="flex-1 py-3 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition-colors flex items-center justify-center gap-2">
                    <span data-en="Confirm Withdrawal" data-ha="Tabbatar Da Karɓa">Confirm Withdrawal</span>
                </button>
                <button type="button" onclick="closeModal('withdrawModal')" class="px-6 py-3 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 transition-colors">
                    <span data-en="Cancel" data-ha="Soke">Cancel</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Education Modal -->
<div id="educationModal" class="modal">
    <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4">
        <div class="p-6 border-b border-slate-200 flex items-center justify-between">
            <h3 class="text-xl font-bold text-slate-900" id="educationModalTitle">Buy Education PIN</h3>
            <button onclick="closeModal('educationModal')" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <form onsubmit="handleEducationPurchase(event)" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Number</label>
                <input id="educationPhone" type="tel" placeholder="08012345678" pattern="[0-9]{11}" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2" data-en="Quantity" data-ha="Adadi">Quantity</label>
                <input type="number" id="educationQty" placeholder="Enter quantity" min="1" max="10" value="1" oninput="calculateEducationCost()" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
            </div>
            <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm text-slate-600" data-en="Total Cost" data-ha="Jimlar Farashi">Total Cost</span>
                    <span class="text-xl font-bold text-slate-900" id="educationCost">₦0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-600" data-en="Your Commission" data-ha="Ribar Ka">Your Commission</span>
                    <span class="text-xl font-bold text-green-600" id="educationCommission">₦0</span>
                </div>
            </div>
            <div id="educationMsg" class="hidden text-sm p-3 rounded-lg"></div>
            <div class="flex gap-3 pt-2">
                <button type="submit" id="educationSubmitBtn" class="flex-1 py-3 bg-purple-600 text-white font-bold rounded-xl hover:bg-purple-700 transition-colors flex items-center justify-center gap-2">
                    <span data-en="Buy PIN" data-ha="Sayi PIN">Buy PIN</span>
                </button>
                <button type="button" onclick="closeModal('educationModal')" class="px-6 py-3 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 transition-colors">
                    <span data-en="Cancel" data-ha="Soke">Cancel</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Change PIN Modal -->
<div id="changePINModal" class="modal">
    <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4">
        <div class="p-6 border-b border-slate-200 flex items-center justify-between">
            <h3 class="text-xl font-bold text-slate-900" data-en="Change Transaction PIN" data-ha="Canza PIN Ciniki">Change Transaction PIN</h3>
            <button onclick="closeModal('changePINModal')" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <form onsubmit="handleChangePIN(event)" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2" data-en="New PIN" data-ha="Sabon PIN">New PIN</label>
                <input id="newPIN" type="password" maxlength="4" placeholder="****" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full text-center text-2xl tracking-widest" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2" data-en="Confirm New PIN" data-ha="Tabbatar Da Sabon PIN">Confirm New PIN</label>
                <input id="confirmPIN" type="password" maxlength="4" placeholder="****" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full text-center text-2xl tracking-widest" required>
            </div>
            <div id="changePINMsg" class="hidden text-sm p-3 rounded-lg"></div>
            <div class="flex gap-3 pt-2">
                <button type="submit" id="changePINSubmitBtn" class="flex-1 py-3 bg-yareema-primary text-white font-bold rounded-xl hover:bg-yareema-secondary transition-colors flex items-center justify-center gap-2" style="background:#1E3D5C">
                    <span data-en="Update PIN" data-ha="Sabunta PIN">Update PIN</span>
                </button>
                <button type="button" onclick="closeModal('changePINModal')" class="px-6 py-3 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 transition-colors">
                    <span data-en="Cancel" data-ha="Soke">Cancel</span>
                </button>
            </div>
        </form>
    </div>
</div>
