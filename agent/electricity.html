<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Electricity - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6 max-w-2xl mx-auto w-full">
            <div id="pageMsg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

            <!-- Step 1: Verify -->
            <div id="step1" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-1">Verify Meter</h3>
                <p class="text-sm text-slate-500 mb-6">Confirm customer details before payment</p>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Select Disco</label>
                        <select id="eDisco" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                            <option value="">Loading discos...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Meter Type</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button type="button" id="mPre" onclick="selMeter('prepaid')"
                                class="py-3 rounded-xl border-2 border-yareema-primary bg-yareema-primary text-white font-semibold text-sm transition-all">Prepaid</button>
                            <button type="button" id="mPos" onclick="selMeter('postpaid')"
                                class="py-3 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-semibold text-sm transition-all hover:border-yareema-primary">Postpaid</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Meter Number</label>
                        <input id="eMeter" type="text" placeholder="Enter meter number"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full">
                    </div>
                    <button type="button" id="verifyBtn" onclick="verifyMeter()"
                        class="w-full py-4 text-white font-bold rounded-xl hover:opacity-90 transition-all text-base flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#1E3D5C,#16304a)">
                        <i data-lucide="search" class="w-5 h-5"></i> Verify Meter
                    </button>
                </div>
            </div>

            <!-- Step 2: Pay (hidden until verify) -->
            <div id="step2" class="hidden">
                <!-- Customer info card -->
                <div id="custCard" class="bg-green-50 border border-green-200 rounded-xl p-4 mb-6">
                    <!-- filled by JS -->
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-slate-900 mb-1">Payment Details</h3>
                    <p class="text-sm text-slate-500 mb-6">Enter payment amount and confirm</p>
                    <form onsubmit="submitElec(event)" class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Amount (₦)</label>
                            <input id="eAmt" type="number" min="500" placeholder="Min ₦500"
                                class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Number</label>
                            <input id="ePhone" type="tel" maxlength="11" placeholder="08012345678"
                                class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Transaction PIN</label>
                            <input id="ePin" type="password" maxlength="4" placeholder="Enter 4-digit PIN"
                                class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                        </div>
                        <div class="flex gap-3">
                            <button type="button" onclick="resetElec()" class="px-6 py-4 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition-all">Back</button>
                            <button type="submit" id="payBtn" class="flex-1 py-4 text-white font-bold rounded-xl hover:opacity-90 transition-all text-base flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#1E3D5C,#16304a)">
                                <i data-lucide="zap" class="w-5 h-5"></i> Pay Now
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
Auth.protectPage();
fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('electricity');if(typeof initHeader==='function')initHeader();lucide.createIcons();});

let _eV=null; window._eMT='prepaid';

async function initDiscos() {
    const s=document.getElementById('eDisco');
    try {
        const res=await API.get('/bills/electricity/discos');
        const list=res.data?.discos||res.discos||res.data?.data?.discos||[];
        if (!list.length){s.innerHTML='<option value="">No discos available</option>';return;}
        s.innerHTML='<option value="">Select Disco</option>';
        list.forEach(d=>{const v=d.key||d.serviceID||d.code||d.id,n=d.name||d.displayName;if(v&&n){const o=document.createElement('option');o.value=v;o.textContent=n;s.appendChild(o);}});
    } catch(e){s.innerHTML='<option value="">Failed to load — please refresh</option>';}
}

function selMeter(t) {
    window._eMT=t;
    const aS='py-3 rounded-xl border-2 border-yareema-primary bg-yareema-primary text-white font-semibold text-sm transition-all';
    const iS='py-3 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-semibold text-sm transition-all hover:border-yareema-primary';
    document.getElementById('mPre').className=t==='prepaid'?aS:iS;
    document.getElementById('mPos').className=t==='postpaid'?aS:iS;
}

async function verifyMeter() {
    const disco=document.getElementById('eDisco').value, meter=document.getElementById('eMeter').value.trim(), mt=window._eMT||'prepaid';
    if (!disco){showMsg('Please select a disco','error');return;}
    if (!meter){showMsg('Please enter meter number','error');return;}
    const btn=document.getElementById('verifyBtn');
    btn.disabled=true; btn.innerHTML='<span class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>Verifying...';
    try {
        const res=await API.post(API_CONFIG.ENDPOINTS.ELECTRICITY_VERIFY,{meterNumber:meter,disco,meterType:mt});
        const d=res.data||res;
        const cName=d.raw?.data?.content?.Customer_Name||d.customerName||d.customer?.name||d.name;
        const cAddr=d.raw?.data?.content?.Address||d.customerAddress||d.customer?.address||d.address;
        const minAmt=d.raw?.data?.content?.Minimum_Amount||d.minimumAmount;
        if (!cName||cName==='N/A'){showMsg('Meter not found. Check the number and disco.','error');return;}
        _eV={meter,disco,meterType:mt,customerName:cName,customerAddress:cAddr,minimumAmount:minAmt};
        document.getElementById('custCard').innerHTML=`
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center flex-shrink-0">
                    <i data-lucide="check" style="width:18px;height:18px;color:white"></i>
                </div>
                <div>
                    <p class="font-bold text-green-800 text-base">${cName}</p>
                    ${cAddr?`<p class="text-sm text-slate-600 mt-0.5">${cAddr}</p>`:''}
                    <p class="text-xs text-slate-500 mt-1">Meter: ${meter} &bull; ${mt.charAt(0).toUpperCase()+mt.slice(1)}</p>
                    ${minAmt?`<p class="text-xs text-amber-600 mt-1 font-medium">Min. Amount: ₦${minAmt.toLocaleString()}</p>`:''}
                </div>
            </div>`;
        if (minAmt) { const ai=document.getElementById('eAmt'); if(ai){ai.placeholder=`Min ₦${minAmt.toLocaleString()}`;ai.min=minAmt;} }
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        lucide.createIcons();
        document.getElementById('eAmt')?.focus();
    } catch(err){showMsg(err.message||'Could not verify meter. Please try again.','error');}
    finally{btn.disabled=false;btn.innerHTML='<i data-lucide="search" class="w-5 h-5"></i> Verify Meter';lucide.createIcons();}
}

async function submitElec(e) {
    e.preventDefault();
    if (!_eV){showMsg('Please verify meter first','error');return;}
    const amount=+document.getElementById('eAmt').value, phone=document.getElementById('ePhone').value.trim(), pin=document.getElementById('ePin').value.trim();
    if (_eV.minimumAmount&&amount<_eV.minimumAmount){showMsg(`Minimum amount is ₦${_eV.minimumAmount.toLocaleString()}`,'error');return;}
    if (!amount||amount<500){showMsg('Minimum amount is ₦500','error');return;}
    if (!phone||phone.length!==11){showMsg('Enter a valid 11-digit phone number','error');return;}
    if (!pin||!/^\d{4}$/.test(pin)){showMsg('Enter your 4-digit transaction PIN','error');return;}
    const btn=document.getElementById('payBtn');
    btn.disabled=true; btn.innerHTML='<span class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>Processing...';
    try {
        const res=await API.post(API_CONFIG.ENDPOINTS.ELECTRICITY_PURCHASE,{meterNumber:_eV.meter,disco:_eV.disco,meterType:_eV.meterType,amount,phoneNumber:phone,transactionPin:pin});
        const token=res.data?.token||res.data?.purchasedToken||res.token||res.data?.raw?.data?.content?.Token||'';
        let msg=`Payment of ₦${amount.toLocaleString()} successful for meter ${_eV.meter}!`;
        if (token) msg += ` Token: ${token}`;
        showMsg(msg,'success');
        resetElec();
    } catch(err){showMsg(err.message||'Payment failed. Please try again.','error');}
    finally{btn.disabled=false;btn.innerHTML='<i data-lucide="zap" class="w-5 h-5"></i> Pay Now';lucide.createIcons();}
}

function resetElec() { _eV=null; document.getElementById('step1').classList.remove('hidden'); document.getElementById('step2').classList.add('hidden'); document.getElementById('eMeter').value=''; document.getElementById('eAmt').value=''; document.getElementById('ePhone').value=''; document.getElementById('ePin').value=''; }
function showMsg(msg,type){const el=document.getElementById('pageMsg');el.className='p-4 rounded-xl text-sm font-medium '+(type==='success'?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200');el.textContent=msg;el.classList.remove('hidden');if(type==='success')setTimeout(()=>el.classList.add('hidden'),8000);el.scrollIntoView({behavior:'smooth',block:'nearest'});}

initDiscos(); lucide.createIcons();
</script>
</body>
</html>
