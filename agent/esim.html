<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
            <div class="max-w-4xl mx-auto">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-900">eSIM Packages</h2>
                    <p class="text-sm text-slate-500 mt-1">Browse available international eSIM plans and submit a purchase.</p>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Select package</label>
                        <select id="esimPkg" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-yareema-primary focus:outline-none">
                            <option value="">Loading eSIM packages…</option>
                        </select>
                    </div>

                    <div id="esimSummary" class="hidden rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700"></div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">First Name</label>
                            <input id="esimFirst" type="text" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-yareema-primary focus:outline-none" placeholder="John">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Last Name</label>
                            <input id="esimLast" type="text" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-yareema-primary focus:outline-none" placeholder="Doe">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Email</label>
                            <input id="esimEmail" type="email" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-yareema-primary focus:outline-none" placeholder="traveler@example.com">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Phone</label>
                            <input id="esimPhone" type="tel" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-yareema-primary focus:outline-none" placeholder="+2348012345678">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Transaction PIN</label>
                        <input id="esimPin" type="password" maxlength="4" inputmode="numeric" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-yareema-primary focus:outline-none" placeholder="Enter 4-digit PIN">
                    </div>

                    <div class="flex justify-end">
                        <button id="esimBuyBtn" onclick="buyEsim()" class="px-5 py-3 bg-yareema-primary hover:bg-yareema-secondary text-white rounded-xl text-sm font-semibold">Buy eSIM</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
Auth.protectPage();
fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('esim');if(typeof initHeader==='function')initHeader();lucide.createIcons();});

let esimPackages = [];

async function loadEsimPackages() {
    const token = localStorage.getItem('agentToken');
    try {
        const res = await fetch(`${API_CONFIG.BASE_URL}/esims/packages?locale=en`, {
            headers: token ? { Authorization: `Bearer ${token}` } : {}
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.message || 'Failed to load eSIM packages');
        const list = json.data?.data || json.data || [];
        esimPackages = Array.isArray(list) ? list : [];
        const select = document.getElementById('esimPkg');
        if (!select) return;
        if (!esimPackages.length) {
            select.innerHTML = '<option value="">No eSIM packages available</option>';
            return;
        }
        select.innerHTML = '<option value="">Choose a package</option>' + esimPackages.map((pkg, idx) => {
            const title = pkg.title || pkg.name || `Package ${idx + 1}`;
            const data = pkg.data || pkg.amount || 'Data';
            const price = pkg.retail_price ?? pkg.total_price ?? pkg.price ?? 0;
            return `<option value="${idx}">${title} · ${data} · ₦${Number(price).toLocaleString()}</option>`;
        }).join('');
    } catch (error) {
        const select = document.getElementById('esimPkg');
        if (select) select.innerHTML = '<option value="">Unable to load packages</option>';
        alert(error.message || 'Unable to load eSIM packages');
    }
}

function refreshEsimSummary() {
    const select = document.getElementById('esimPkg');
    const summary = document.getElementById('esimSummary');
    const idx = Number(select?.value ?? -1);
    if (!summary || idx < 0 || !esimPackages[idx]) {
        summary.classList.add('hidden');
        return;
    }
    const pkg = esimPackages[idx];
    const title = pkg.title || pkg.name || 'Package';
    const data = pkg.data || pkg.amount || 'Data';
    const price = pkg.retail_price ?? pkg.total_price ?? pkg.price ?? 0;
    summary.innerHTML = `<strong>${title}</strong> · ${data} · <span class="font-semibold text-yareema-primary">₦${Number(price).toLocaleString()}</span>`;
    summary.classList.remove('hidden');
}

document.getElementById('esimPkg')?.addEventListener('change', refreshEsimSummary);

async function buyEsim() {
    const idx = Number(document.getElementById('esimPkg')?.value ?? -1);
    const pkg = esimPackages[idx];
    const first = document.getElementById('esimFirst').value.trim();
    const last = document.getElementById('esimLast').value.trim();
    const email = document.getElementById('esimEmail').value.trim();
    const phone = document.getElementById('esimPhone').value.trim();
    const pin = document.getElementById('esimPin').value.trim();

    if (!pkg) return alert('Please select an eSIM package');
    if (!first || !last) return alert('Please enter the traveler name');
    if (!email || !email.includes('@')) return alert('Please enter a valid email');
    if (!phone) return alert('Please enter a phone number');
    if (!pin || !/^\d{4}$/.test(pin)) return alert('Please enter your 4-digit PIN');

    const btn = document.getElementById('esimBuyBtn');
    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Processing...';
    }

    try {
        const token = localStorage.getItem('agentToken');
        const quoteRes = await fetch(`${API_CONFIG.BASE_URL}/esims/quotes`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...(token ? { Authorization: `Bearer ${token}` } : {})
            },
            body: JSON.stringify({ operation: 'order', package_id: pkg.id || pkg.package_id, locale: 'en' })
        });
        const quoteJson = await quoteRes.json();
        if (!quoteRes.ok) throw new Error(quoteJson.message || 'Unable to create quote');
        const quoteId = quoteJson.data?.esimQuoteId;
        if (!quoteId) throw new Error('No quote ID returned by the provider.');

        const orderRes = await fetch(`${API_CONFIG.BASE_URL}/esims/orders`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Idempotency-Key': `agent-esim-${Date.now()}`,
                ...(token ? { Authorization: `Bearer ${token}` } : {})
            },
            body: JSON.stringify({
                esimQuoteId: quoteId,
                transactionPin: pin,
                email,
                phone,
                first_name: first,
                last_name: last,
                description: `eSIM order for ${first} ${last}`
            })
        });
        const orderJson = await orderRes.json();
        if (!orderRes.ok) throw new Error(orderJson.message || 'eSIM purchase failed');

        alert('eSIM order placed successfully.');
        window.location.reload();
    } catch (error) {
        alert(error.message || 'The eSIM purchase could not be completed.');
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.textContent = 'Buy eSIM';
        }
    }
}

loadEsimPackages();
lucide.createIcons();
</script>
</body>
</html>
