<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk SMS - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',light:'#e8edf2',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="flex flex-col lg:flex-row w-full min-h-screen">
        <div id="sidebarContainer"></div>
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <div id="headerContainer"></div>
            <div class="p-4 lg:p-8 flex-1 overflow-y-auto">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-900 mb-6">Send Bulk SMS</h3>
                    <form onsubmit="handleBulkSMS(event)" class="space-y-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Sender ID</label>
                            <input type="text" placeholder="e.g., YareemaHub" maxlength="11" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Numbers</label>
                            <textarea placeholder="Enter phone numbers separated by comma (e.g., 08012345678, 08098765432)" rows="4" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full resize-none" required></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Message</label>
                            <textarea id="smsMessage" placeholder="Type your message here..." rows="6" onkeyup="updateSMSCount()" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full resize-none" required></textarea>
                            <div class="flex justify-between text-xs text-slate-500 mt-1">
                                <span><span id="charCount">0</span> characters</span>
                                <span><span id="smsCount">0</span> SMS page(s)</span>
                            </div>
                        </div>
                        <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="text-sm font-medium text-slate-700">Estimated Cost</p>
                                    <p class="text-xs text-slate-500">₦4 per SMS page</p>
                                </div>
                                <p class="text-2xl font-bold text-blue-600" id="smsCost">₦0</p>
                            </div>
                        </div>
                        <button type="submit" class="w-full py-4 bg-gradient-to-r from-pink-600 to-pink-700 text-white font-bold rounded-xl hover:shadow-lg transition-all text-lg">Send SMS</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <div id="modalsContainer"></div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/services.js"></script>
    <script>
        fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();});
        fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('sms');lucide.createIcons();});
        fetch('partials/modals.html').then(r=>r.text()).then(d=>{document.getElementById('modalsContainer').innerHTML=d;lucide.createIcons();});
    </script>
</body>
</html>
