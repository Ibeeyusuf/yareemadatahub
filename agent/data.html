<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Data - Yareema Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{yareema:{primary:'#1E3D5C',secondary:'#16304a',dark:'#0f1f2e',success:'#10b981',warning:'#f59e0b',danger:'#ef4444'}}}}}</script>
</head>
<body class="text-slate-800 antialiased">
<div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="w-full min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="lg:ml-64 flex flex-col min-h-screen bg-slate-50">
        <div id="headerContainer"></div>
        <div class="p-4 lg:p-8 flex-1 overflow-y-auto space-y-6 max-w-2xl mx-auto w-full">

            <div id="pageMsg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

            <!-- Network Selection -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-1">Select Network</h3>
                <p class="text-sm text-slate-500 mb-4">Choose the network to buy data for</p>
                <div class="grid grid-cols-4 gap-3">
                    <button onclick="selectNetwork('mtn')" id="net-mtn"
                        class="net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-yellow-400 bg-yellow-50 font-bold text-sm transition-all">
                        <span class="w-10 h-10 rounded-full bg-yellow-400 flex items-center justify-center font-black text-black text-xs">MTN</span>
                        <span>MTN</span>
                    </button>
                    <button onclick="selectNetwork('airtel')" id="net-airtel"
                        class="net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-slate-200 bg-white text-slate-500 font-bold text-sm transition-all hover:border-red-400">
                        <span class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-black text-red-600 text-xs">AIR</span>
                        <span>Airtel</span>
                    </button>
                    <button onclick="selectNetwork('glo')" id="net-glo"
                        class="net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-slate-200 bg-white text-slate-500 font-bold text-sm transition-all hover:border-green-500">
                        <span class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-black text-green-600 text-xs">GLO</span>
                        <span>Glo</span>
                    </button>
                    <button onclick="selectNetwork('9mobile')" id="net-9mobile"
                        class="net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-slate-200 bg-white text-slate-500 font-bold text-sm transition-all hover:border-green-800">
                        <span class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-black text-green-900 text-xs">9MB</span>
                        <span>9mobile</span>
                    </button>
                </div>
            </div>

            <!-- Data Type -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-4">Data Type</h3>
                <div id="dataTypeWrap" class="flex flex-wrap gap-3">
                    <p class="text-sm text-slate-400">Loading data types...</p>
                </div>
            </div>

            <!-- Purchase Form -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-900 mb-1">Purchase Details</h3>
                <p class="text-sm text-slate-500 mb-6">Fill in the details below</p>
                <form onsubmit="submitData(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Number</label>
                        <input id="dPhone" type="tel" maxlength="11" placeholder="08012345678"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Select Plan</label>
                        <select id="dPlan" class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" disabled required>
                            <option value="">Select a data type first...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Transaction PIN</label>
                        <input id="dPin" type="password" maxlength="4" placeholder="Enter 4-digit PIN"
                            class="px-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yareema-primary w-full" required>
                    </div>
                    <button type="submit" id="dSubmitBtn"
                        class="w-full py-4 text-white font-bold rounded-xl hover:opacity-90 transition-all text-base flex items-center justify-center gap-2"
                        style="background:linear-gradient(135deg,#1E3D5C,#16304a)">
                        <i data-lucide="wifi" class="w-5 h-5"></i>
                        Buy Data
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
Auth.protectPage();
fetch('partials/sidebar.html').then(r=>r.text()).then(d=>{document.getElementById('sidebarContainer').innerHTML=d;lucide.createIcons();initSidebar();});
fetch('partials/header.html').then(r=>r.text()).then(d=>{document.getElementById('headerContainer').innerHTML=d;updatePageTitle('data');if(typeof initHeader==='function')initHeader();lucide.createIcons();});

let _net='mtn', _plans=[], _type=null;
const _plansByNetwork = new Map();
const _plansByNetworkAndType = new Map();

const NET_STYLES = {
    mtn:     {active:'border-yellow-400 bg-yellow-50 text-yellow-800',  dot:'bg-yellow-400 text-black'},
    airtel:  {active:'border-red-400 bg-red-50 text-red-800',           dot:'bg-red-500 text-white'},
    glo:     {active:'border-green-500 bg-green-50 text-green-800',     dot:'bg-green-500 text-white'},
    '9mobile':{active:'border-green-800 bg-green-50 text-green-900',    dot:'bg-green-800 text-white'},
};

function selectNetwork(n) {
    _net = n; _type = null; _plans = [];
    document.querySelectorAll('.net-btn').forEach(b => {
        const id = b.id.replace('net-','');
        const s  = NET_STYLES[id];
        b.className = 'net-btn flex flex-col items-center gap-2 p-4 rounded-xl border-2 font-bold text-sm transition-all ' +
            (id === n ? s.active : 'border-slate-200 bg-white text-slate-500');
        const dot = b.querySelector('span');
        if (dot) dot.className = 'w-10 h-10 rounded-full flex items-center justify-center font-black text-xs ' +
            (id === n ? s.dot : 'bg-slate-100 text-slate-500');
    });
    const ps = document.getElementById('dPlan');
    if (ps) { ps.innerHTML = '<option value="">Select a data type first...</option>'; ps.disabled = true; }
    loadTypes(n);
}

function extractNetworkPlans(res, network) {
    const data = res?.data || {};
    const candidates = [
        data?.services?.data_recharge,
        data?.[network],
        data?.[network.toLowerCase()],
        data?.plans,
        data
    ];
    const allPlans = candidates.find(Array.isArray) || [];
    return allPlans.filter(plan => {
        const planNetwork = String(plan.network || plan.provider || '').toLowerCase();
        return !planNetwork || planNetwork === network.toLowerCase();
    });
}

function planType(plan) {
    return String(plan.dataType || plan.providerPlanType || plan.category || plan.planType || '').toLowerCase();
}

function planSizeInMB(plan) {
    const text = String(plan.size || plan.dataAmount || plan.planName || plan.name || '').toUpperCase();
    const match = text.match(/(\d+(?:\.\d+)?)\s*(TB|GB|MB)/);
    if (!match) return Number.POSITIVE_INFINITY;
    const value = Number(match[1]);
    return match[2] === 'TB' ? value * 1024 * 1024 : match[2] === 'GB' ? value * 1024 : value;
}

function sortDataPlans(plans) {
    return [...plans].sort((left, right) => {
        const leftPrice = Number(left.sellingPrice ?? left.price ?? left.amount ?? 0);
        const rightPrice = Number(right.sellingPrice ?? right.price ?? right.amount ?? 0);
        const priceDifference = leftPrice - rightPrice;
        return priceDifference || planSizeInMB(left) - planSizeInMB(right);
    });
}

async function loadTypes(n) {
    const wrap = document.getElementById('dataTypeWrap');
    wrap.innerHTML = '<p class="text-sm text-slate-400">Loading...</p>';
    try {
        let plans = _plansByNetwork.get(n);
        let types = [];
        if (!plans) {
            const res = await API.get(`${API_CONFIG.ENDPOINTS.DATA_PLANS}?network=${n}`);
            plans = extractNetworkPlans(res, n);
            if (plans.length) _plansByNetwork.set(n, plans);
            // Some API responses intentionally return only availableDataTypes
            // until the user chooses one. Preserve that supported shape.
            types = Array.isArray(res.availableDataTypes) ? res.availableDataTypes : [];
        }
        if (n !== _net) return;

        if (!types.length) types = [...new Set(plans.map(planType).filter(Boolean))];
        
        if (!types || !types.length) { 
            wrap.innerHTML = '<p class="text-sm text-red-500">No data types available</p>'; 
            return; 
        }
        
        wrap.innerHTML = types.map(t =>
            `<button type="button" class="type-pill px-4 py-2 rounded-xl border-2 border-slate-200 bg-white text-slate-600 text-sm font-semibold hover:border-yareema-primary transition-all" data-t="${t}" onclick="selectType('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`
        ).join('');
        
    } catch(e) {
        console.error('Error loading types:', e);
        wrap.innerHTML = '<p class="text-sm text-red-500">Failed to load types</p>';
    }
}
async function selectType(t) {
    _type = t; 
    _plans = [];
    
    document.querySelectorAll('.type-pill[data-t]').forEach(b => {
        b.className = 'type-pill px-4 py-2 rounded-xl border-2 text-sm font-semibold transition-all ' +
            (b.dataset.t === t ? 'border-yareema-primary bg-yareema-primary text-white' : 'border-slate-200 bg-white text-slate-600 hover:border-yareema-primary');
    });
    
    const ps = document.getElementById('dPlan');
    ps.innerHTML = '<option value="">Loading plans...</option>'; 
    ps.disabled = true;
    
    try {
        // Types and plans are delivered by the same endpoint response. Reuse
        // the cached list instead of making a second network request.
        const allPlans = _plansByNetwork.get(_net) || [];
        let plans = allPlans.filter(plan => planType(plan) === String(t).toLowerCase());
        if (!plans.length) {
            const cacheKey = `${_net}:${String(t).toLowerCase()}`;
            plans = _plansByNetworkAndType.get(cacheKey) || [];
            if (!plans.length) {
                const res = await API.get(`${API_CONFIG.ENDPOINTS.DATA_PLANS}?network=${_net}&dataType=${encodeURIComponent(t)}`);
                plans = extractNetworkPlans(res, _net);
                _plansByNetworkAndType.set(cacheKey, plans);
            }
        }
        
        // Remove duplicates based on id or planCode
        const uniquePlans = [];
        const seenIds = new Set();
        for (const plan of plans) {
            const planId = plan.id || plan.planCode;
            if (planId && !seenIds.has(planId)) {
                seenIds.add(planId);
                uniquePlans.push(plan);
            }
        }
        plans = sortDataPlans(uniquePlans);
        
        _plans = plans;
        
        if (!plans.length) { 
            ps.innerHTML = '<option value="">No plans available for this type</option>'; 
            ps.disabled = true; 
            return; 
        }
        
        ps.disabled = false;
        ps.innerHTML = '<option value="">Choose a plan</option>' + plans.map((p, i) => {
            const label = p.planName || p.name || p.size || 'Plan';
            const validity = p.validity ? ` (${p.validity})` : '';
            const price = p.sellingPrice || p.price || p.amount || 0;
            return `<option value="${i}">${label}${validity} — ₦${Number(price).toLocaleString()}</option>`;
        }).join('');
        
    } catch(e) {
        console.error('Error loading plans:', e);
        ps.innerHTML = '<option value="">Failed to load plans</option>'; 
        ps.disabled = true;
        showMsg('Failed to load data plans. Please try again.', 'error');
    }
}
async function submitData(e) {
    e.preventDefault();
    const phone = document.getElementById('dPhone').value.trim();
    const pi    = document.getElementById('dPlan').value;
    const pin   = document.getElementById('dPin').value.trim();
    if (!phone || !/^\d{11}$/.test(phone)) { showMsg('Enter a valid 11-digit phone number','error'); return; }
    if (pi === '' || !_plans.length)        { showMsg('Please select a data plan','error'); return; }
    const plan   = _plans[+pi];
    const amount = plan.sellingPrice || plan.price || plan.amount || 0;
    const rawId  = plan._id || plan.planCode || plan.id || plan.planId || plan.PRODUCT_ID;
    if (!rawId)  { showMsg('Could not identify plan. Please try again.','error'); return; }
    if (!pin || !/^\d{4}$/.test(pin)) { showMsg('Enter your 4-digit transaction PIN','error'); return; }
    const btn = document.getElementById('dSubmitBtn');
    btn.disabled = true; btn.innerHTML = '<span class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>Processing...';
    try {
        await API.post(API_CONFIG.ENDPOINTS.DATA_PURCHASE, {phoneNumber:phone, network:_net, dataPlan:String(rawId).replace(/\.0$/,''), transactionPin:pin, amount});
        showMsg(`Data purchased successfully for ${phone}!`, 'success');
        document.getElementById('dPlan').selectedIndex = 0;
        document.getElementById('dPhone').value = '';
        document.getElementById('dPin').value = '';
    } catch(err) {
        showMsg(err.message || 'Purchase failed. Please try again.', 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="wifi" class="w-5 h-5"></i> Buy Data';
        lucide.createIcons();
    }
}

function showMsg(msg, type) {
    const el = document.getElementById('pageMsg');
    el.className = 'p-4 rounded-xl text-sm font-medium ' + (type==='success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200');
    el.textContent = msg; el.classList.remove('hidden');
    if (type === 'success') setTimeout(() => el.classList.add('hidden'), 5000);
    el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// Init
selectNetwork('mtn');
lucide.createIcons();
</script>
</body>
</html>
