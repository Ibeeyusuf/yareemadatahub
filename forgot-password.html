<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="agent/assets/images/logo.png">
    <link rel="icon" type="image/png" href="agent/assets/images/logo.png">
    <link rel="apple-touch-icon" href="agent/assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yareema Data Hub - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }
        
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin: auto;
        }
        
        .form-input:focus {
            border-color: #1E3D5C;
            box-shadow: 0 0 0 3px rgba(30, 61, 92, 0.1);
        }
        
        .btn-primary {
            background-color: #1E3D5C;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: #16304a;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 61, 92, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            padding: 0.75rem;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 0.5rem;
            display: none;
        }
        
        .success-message {
            color: #059669;
            font-size: 0.875rem;
            padding: 0.75rem;
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            border-radius: 0.5rem;
            display: none;
        }
        
        @media (max-width: 640px) {
            .auth-container {
                padding: 16px;
            }
            
            .auth-card {
                border-radius: 12px;
            }
            
            .logo-container {
                height: 100px !important;
                width: 100px !important;
            }
        }
        
        @media (min-width: 641px) and (max-width: 1023px) {
            .auth-card {
                max-width: 440px;
                min-width: 400px;
            }
        }
        
        @media (min-width: 1024px) {
            .auth-card {
                max-width: 480px;
                min-width: 440px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="w-full">
            <div class="auth-card p-6 sm:p-8">
                <!-- Logo -->
                <div class="flex justify-center mb-6 sm:mb-8">
                    <div class="logo-container h-32 w-32 sm:h-40 sm:w-40 flex items-center justify-center">
                        <img src="logo.png" 
                             alt="Yareema Data Hub Logo"
                             class="max-h-full max-w-full object-contain">
                    </div>
                </div>
                
                <div class="text-center mb-6 sm:mb-8">  
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">Forgot Password?</h2>
                    <p class="text-slate-600 text-sm sm:text-base">Enter your email and we'll send you a password reset link</p>
                </div>

                <!-- Forgot Password Form -->
                <form id="forgot-form" class="space-y-5 sm:space-y-6">
                    <!-- Email -->
                    <div>
                        <label for="forgot-email" class="block text-sm font-medium text-slate-700 mb-2">
                            Email Address
                        </label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input
                                type="email"
                                id="forgot-email"
                                class="w-full pl-10 pr-4 py-3 sm:py-3.5 border border-slate-300 rounded-lg form-input focus:outline-none text-sm sm:text-base"
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                    </div>

                    <!-- Messages -->
                    <div id="forgot-error" class="error-message"></div>
                    <div id="forgot-success" class="success-message"></div>

                    <!-- Submit Button -->
                    <button type="submit" id="forgot-btn" class="w-full py-3.5 sm:py-4 bg-primary text-white font-semibold rounded-lg btn-primary flex items-center justify-center text-sm sm:text-base">
                        <span id="forgot-text">Send Reset Link</span>
                        <div id="forgot-spinner" class="hidden ml-2">
                            <i data-lucide="loader" class="w-5 h-5 animate-spin"></i>
                        </div>
                    </button>

                    <!-- Back to Login -->
                    <p class="text-center text-slate-600 text-sm sm:text-base pt-4 sm:pt-6">
                        Remember your password? 
                        <a href="login.html" class="text-primary font-semibold hover:underline ml-1">Login</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Load Auth Infrastructure -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/auth-guard.js"></script>
    
    <script>
        lucide.createIcons();

        // Forgot Password Form
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('forgot-email').value.trim();
            
            if (!email) {
                showError('forgot-error', 'Please enter your email address');
                return;
            }
            
            if (!email.includes('@')) {
                showError('forgot-error', 'Please enter a valid email address');
                return;
            }
            
            hideMessages();
            
            const forgotBtn = document.getElementById('forgot-btn');
            const forgotText = document.getElementById('forgot-text');
            const forgotSpinner = document.getElementById('forgot-spinner');
            const originalText = forgotText.textContent;
            
            forgotBtn.disabled = true;
            forgotText.textContent = 'Sending...';
            forgotSpinner.classList.remove('hidden');
            lucide.createIcons();
            
            try {
                const response = await api.forgotPassword(email);
                
                if (response.success !== false) {
                    // Store email for OTP verification
                    sessionStorage.setItem('password_reset_email', email);
                    
                    // Redirect to OTP verification page
                    window.location.href = 'verify-otp.html?type=password-reset';
                } else {
                    showError('forgot-error', response.message || 'Failed to send reset code');
                    resetButton();
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                showError('forgot-error', error.message || 'Failed to send reset code. Please try again.');
                resetButton();
            }
            
            function resetButton() {
                forgotBtn.disabled = false;
                forgotText.textContent = originalText;
                forgotSpinner.classList.add('hidden');
            }
        });

        // Helper functions
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function showSuccess(elementId, message) {
            const successElement = document.getElementById(elementId);
            successElement.textContent = message;
            successElement.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('forgot-error').style.display = 'none';
            document.getElementById('forgot-success').style.display = 'none';
        }
    </script>
</body>
</html>
