<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Yareema Data Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app-container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 32px;">
        <div style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: 48px;">
                <img src="assets/images/logo.png" alt="Logo" style="width: 200px; height: 200px; margin: 0 auto;">
                <h1 style="font-size: 24px; font-weight: 700; margin-top: -20px; margin-bottom: 8px;">Welcome Back</h1>
                <p style="color: #64748b; font-size: 14px;">Login to continue your seamless experience</p>
            </div>

            <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label style="display: block; font-size: 12px; font-weight: 500; color: #475569; margin-bottom: 4px; margin-left: 4px;">Email</label>
                    <div style="position: relative;">
                        <input type="email" id="email" placeholder="Enter your email" required
                            style="width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 12px 12px 40px; font-size: 15px;">
                        <i data-lucide="mail" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; width: 20px; height: 20px;"></i>
                    </div>
                </div>

                <div>
                    <label style="display: block; font-size: 12px; font-weight: 500; color: #475569; margin-bottom: 4px; margin-left: 4px;">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" placeholder="Enter password" required
                            style="width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 40px 12px 40px; font-size: 15px;">
                        <i data-lucide="lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; width: 20px; height: 20px;"></i>
                        <button type="button" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px;">
                            <i data-lucide="eye-off" style="color: #94a3b8; width: 20px; height: 20px;"></i>
                        </button>
                    </div>
                </div>

                <div style="text-align: right;">
                    <a href="#" style="font-size: 12px; color: #1e3d5c; font-weight: 600; text-decoration: none;">Forgot Password?</a>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary" style="margin-top: 8px; height: 52px; box-shadow: 0 4px 8px rgba(30, 61, 92, 0.3);">
                    <span id="loginText">Login</span>
                </button>

                <p style="text-align: center; font-size: 12px; color: #64748b; margin-top: 16px;">
                    Don't have an account? <a href="signup.html" style="color: #1e3d5c; font-weight: 600; text-decoration: none;">Sign Up</a>
                </p>
            </form>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('togglePassword').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            const icon = this.querySelector('i');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.setAttribute('data-lucide', 'eye');
            } else {
                pwd.type = 'password';
                icon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const text = document.getElementById('loginText');

            btn.disabled = true;
            text.textContent = 'Logging in...';

            try {
                await api.login(email, password);
                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    text: 'Login successful',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'home.html';
                });
            } catch (error) {
                Swal.fire('Error', error.message || 'Login failed', 'error');
                btn.disabled = false;
                text.textContent = 'Login';
            }
        });

        if (api.getToken()) window.location.href = 'home.html';
    </script>
</body>
</html>
