<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/images/logo.png" alt="Logo">
            <h1>Yareema Data Hub</h1>
        </div>
        <div class="sidebar-nav">
            <a href="home.html" class="nav-item">
                <i data-lucide="home" style="width: 20px; height: 20px;"></i><span>Dashboard</span>
            </a>
            <a href="services.html" class="nav-item active">
                <i data-lucide="grid" style="width: 20px; height: 20px;"></i><span>Services</span>
            </a>
            <a href="transactions.html" class="nav-item">
                <i data-lucide="receipt" style="width: 20px; height: 20px;"></i><span>Transactions</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <i data-lucide="wallet" style="width: 20px; height: 20px;"></i><span>Wallet</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i data-lucide="user" style="width: 20px; height: 20px;"></i><span>Profile</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-profile" onclick="window.location.href='profile.html'">
                <div class="user-avatar" id="sidebarAvatar">U</div>
                <div class="user-info"><h3 id="sidebarName">User</h3><p>View Profile</p></div>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar"><h1>All Services</h1></div>
        
        <div class="section-header"><h2 class="section-title">Telecom Services</h2></div>
        <div class="services-grid" style="margin-bottom: 32px;">
            <div class="service-card" onclick="openModal('data')"><div class="service-icon" style="background: #eff6ff;"><i data-lucide="wifi" style="width: 28px; height: 28px; color: #2563eb;"></i></div><div class="service-name">Buy Data</div></div>
            <div class="service-card" onclick="openModal('airtime')"><div class="service-icon" style="background: #f0fdf4;"><i data-lucide="phone" style="width: 28px; height: 28px; color: #16a34a;"></i></div><div class="service-name">Buy Airtime</div></div>
            <div class="service-card" onclick="openModal('sms')"><div class="service-icon" style="background: #ecfeff;"><i data-lucide="message-circle" style="width: 28px; height: 28px; color: #0891b2;"></i></div><div class="service-name">Bulk SMS</div></div>
        </div>
        
        <div class="section-header"><h2 class="section-title">Bill Payments</h2></div>
        <div class="services-grid" style="margin-bottom: 32px;">
            <div class="service-card" onclick="openModal('electricity')"><div class="service-icon" style="background: #fffbeb;"><i data-lucide="zap" style="width: 28px; height: 28px; color: #d97706;"></i></div><div class="service-name">Electricity</div></div>
            <div class="service-card" onclick="openModal('tv')"><div class="service-icon" style="background: #faf5ff;"><i data-lucide="tv" style="width: 28px; height: 28px; color: #9333ea;"></i></div><div class="service-name">Cable TV</div></div>
        </div>
        
        <div class="section-header"><h2 class="section-title">Other Services</h2></div>
        <div class="services-grid">
            <div class="service-card" onclick="openModal('education')"><div class="service-icon" style="background: #eef2ff;"><i data-lucide="graduation-cap" style="width: 28px; height: 28px; color: #4f46e5;"></i></div><div class="service-name">Education</div></div>
            <div class="service-card" onclick="openModal('swap')"><div class="service-icon" style="background: #fff7ed;"><i data-lucide="repeat" style="width: 28px; height: 28px; color: #ea580c;"></i></div><div class="service-name">Airtime2Cash</div></div>
            <div class="service-card" onclick="openModal('remita')"><div class="service-icon" style="background: #fef2f2;"><i data-lucide="credit-card" style="width: 28px; height: 28px; color: #dc2626;"></i></div><div class="service-name">Remita</div></div>
            <div class="service-card" onclick="openModal('alpha')"><div class="service-icon" style="background: #faf5ff;"><i data-lucide="diamond" style="width: 28px; height: 28px; color: #9333ea;"></i></div><div class="service-name">Alpha</div></div>
        </div>
    </div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="modals/native-modals.js"></script>
    <script>
        if (!api.getToken()) window.location.href = 'index.html';
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.firstName) {
            document.getElementById('sidebarName').textContent = user.firstName;
            document.getElementById('sidebarAvatar').textContent = (user.firstName[0] + (user.lastName?.[0] || '')).toUpperCase();
        }
        lucide.createIcons();
    </script>
</body>
</html>
