<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/images/logo.png" alt="Logo">
            <h1>Yareema Data Hub</h1>
        </div>
        <div class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <i data-lucide="home" style="width: 20px; height: 20px;"></i><span>Dashboard</span>
            </a>
            <a href="services.html" class="nav-item">
                <i data-lucide="grid" style="width: 20px; height: 20px;"></i><span>Services</span>
            </a>
            <a href="transactions.html" class="nav-item active">
                <i data-lucide="banknote" class="w-5 h-5"></i><span>Transactions</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <i data-lucide="wallet" style="width: 20px; height: 20px;"></i><span>Wallet</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i data-lucide="user" style="width: 20px; height: 20px;"></i><span>Profile</span>
            </a>
            <a href="#" class="nav-item logout" onclick="logout(); return false;" style="margin-top: 16px;">
                <i data-lucide="log-out" style="width: 20px; height: 20px;"></i>
                <span>Logout</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-profile" onclick="window.location.href='profile.html'">
                <div class="user-avatar" id="sidebarAvatar">U</div>
                <div class="user-info"><h3 id="sidebarName">User</h3><p>View Profile</p></div>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar" style="display:flex;align-items:center;gap:12px;"><button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu"><i data-lucide="menu" style="width:20px;height:20px;"></i></button>
            <h1>Transaction History</h1>
            <button class="icon-btn" onclick="loadTxns()"><i data-lucide="refresh-cw" style="width: 20px; height: 20px;"></i></button>
        </div>
        <div class="activity-list" id="txnsList" style="min-height: 400px;"><div style="text-align: center; padding: 48px; color: #94a3b8;">Loading...</div></div>
    </div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="modals/native-modals.js"></script>
    <script>
        // SVG icons per transaction type
        const txSVGs = {
            'WALLET_FUND': {
                bg: '#dcfce7',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 7H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`
            },
            'WALLET_FUNDING': {
                bg: '#dcfce7',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 7H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`
            },
            'AIRTIME': {
                bg: '#f0fdf4',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18" stroke-width="3"/><path d="M9 7h6M9 11h4"/></svg>`
            },
            'DATA': {
                bg: '#eff6ff',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="#2563eb"/></svg>`
            },
            'DATA_RECHARGE': {
                bg: '#eff6ff',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="#2563eb"/></svg>`
            },
            'ELECTRICITY': {
                bg: '#fffbeb',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#fef3c7" stroke="#d97706"/></svg>`
            },
            'CABLE': {
                bg: '#faf5ff',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9333ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13" rx="2"/><polyline points="16 2 12 7 8 2"/><line x1="8" y1="17" x2="10" y2="17"/><line x1="14" y1="17" x2="16" y2="17"/></svg>`
            },
            'EDUCATION': {
                bg: '#eef2ff',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>`
            },
            'TRANSFER': {
                bg: '#eff6ff',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e3d5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`
            },
            'WITHDRAWAL': {
                bg: '#fee2e2',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>`
            },
            'DEFAULT': {
                bg: '#f1f5f9',
                svg: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`
            }
        };

        function getStatusBadge(status) {
            if (!status) return '';
            const s = status.toUpperCase();
            if (s === 'PAID' || s === 'SUCCESS' || s === 'SUCCESSFUL' || s === 'COMPLETED')
                return '<span class="tx-status-paid">Success</span>';
            if (s === 'PENDING')
                return '<span class="tx-status-pending">Pending</span>';
            return '<span class="tx-status-failed">Failed</span>';
        }

        function renderTxRow(t) {
            const typeKey = (t.type || 'DEFAULT').toUpperCase().replace(/\s/g,'_');
            const icon = txSVGs[typeKey] || txSVGs['DEFAULT'];
            const isCredit = t.amount > 0 || t.type === 'WALLET_FUND' || t.type === 'wallet_funding';
            const amountColor = isCredit ? '#16a34a' : '#dc2626';
            const amountPrefix = isCredit ? '+' : '-';
            const absAmount = Math.abs(t.amount || 0);

            return `
            <div class="activity-item" onclick="showTxDetail(${JSON.stringify(t).replace(/"/g,'&quot;')})" style="cursor:pointer;">
                <div class="activity-icon" style="background: ${icon.bg}; display:flex; align-items:center; justify-content:center;">
                    ${icon.svg}
                </div>
                <div class="activity-info">
                    <div class="activity-title">${t.description || t.type || 'Transaction'}</div>
                    <div class="activity-time">${new Date(t.createdAt || t.date).toLocaleString('en-NG', {dateStyle:'medium', timeStyle:'short'})}</div>
                </div>
                <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
                    <div class="activity-amount" style="color:${amountColor};">${amountPrefix}₦${absAmount.toLocaleString('en-US',{minimumFractionDigits:2})}</div>
                    ${getStatusBadge(t.status || t.paymentStatus)}
                </div>
            </div>`;
        }

        function showTxDetail(t) {
            // Build detail rows
            const rows = [
                ['Type', t.type || 'N/A'],
                ['Amount', '₦' + Math.abs(t.amount||0).toLocaleString('en-US',{minimumFractionDigits:2})],
                ['Status', t.status || t.paymentStatus || 'N/A'],
                ['Reference', t.reference || t.transactionReference || 'N/A'],
                ['Date', t.createdAt ? new Date(t.createdAt).toLocaleString('en-NG') : 'N/A'],
                ['Description', t.description || t.paymentDescription || 'N/A'],
            ];

            // If it's electricity/airtime — show the token
            let tokenHTML = '';
            if (t.token) {
                tokenHTML = `
                <div class="token-box">
                    <p style="color:#64748b; font-size:12px; margin-bottom:6px;">⚡ Electricity Token</p>
                    <div class="token-value">${t.token}</div>
                    <button onclick="navigator.clipboard.writeText('${t.token}').then(()=>showSuccess('Token copied!'))" 
                        style="margin-top:10px; padding:6px 16px; background:#15803d; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px;">
                        Copy Token
                    </button>
                </div>`;
            }

            const bodyHTML = `
            <div style="padding: 8px 0;">
                ${tokenHTML}
                ${rows.map(([label, value]) => `
                    <div class="tx-detail-row">
                        <span class="tx-detail-label">${label}</span>
                        <span class="tx-detail-value">${value}</span>
                    </div>`).join('')}
            </div>`;

            showModal('Transaction Details', bodyHTML,
                `<button onclick="closeModal()" class="btn-primary" style="width:100%;">Close</button>`);
        }

        async function loadTxns() {
            const list = document.getElementById('txnsList');
            list.innerHTML = '<div style="text-align:center;padding:48px;color:#94a3b8;">Loading...</div>';
            try {
                const r = await api.getTransactions();
                const txns = r.data?.transactions || r.transactions || [];
                list.innerHTML = txns.length
                    ? txns.map(renderTxRow).join('')
                    : '<div style="text-align:center;padding:48px;color:#94a3b8;">No transactions yet</div>';
                lucide.createIcons();
            } catch (e) {
                list.innerHTML = '<div style="text-align:center;padding:48px;color:#ef4444;">Error loading transactions</div>';
            }
        }

        if (!api.getToken()) window.location.href = '../login.html'; else loadTxns();
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.firstName) {
            document.getElementById('sidebarName').textContent = user.firstName;
            document.getElementById('sidebarAvatar').textContent = (user.firstName[0] + (user.lastName?.[0] || '')).toUpperCase();
        }
        lucide.createIcons();
    </script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.querySelector('.sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        function logout() {
            localStorage.removeItem('user_token');
            localStorage.removeItem('user_data');
            sessionStorage.removeItem('user_token');
            sessionStorage.removeItem('user_data');
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
