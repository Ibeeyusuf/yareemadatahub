<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/images/logo.png" alt="Logo">
            <h1>Yareema Data Hub</h1>
        </div>
        <div class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <i data-lucide="home" style="width: 20px; height: 20px;"></i><span>Dashboard</span>
            </a>
            <a href="services.html" class="nav-item">
                <i data-lucide="grid" style="width: 20px; height: 20px;"></i><span>Services</span>
            </a>
            <a href="transactions.html" class="nav-item">
                <i data-lucide="banknote" class="w-5 h-5"></i><span>Transactions</span>
            </a>
            <a href="wallet.html" class="nav-item active">
                <i data-lucide="wallet" style="width: 20px; height: 20px;"></i><span>Wallet</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i data-lucide="user" style="width: 20px; height: 20px;"></i><span>Profile</span>
            </a>
            <a href="#" class="nav-item logout" onclick="logout(); return false;" style="margin-top: 16px;">
                <i data-lucide="log-out" style="width: 20px; height: 20px;"></i>
                <span>Logout</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-profile" onclick="window.location.href='profile.html'">
                <div class="user-avatar" id="sidebarAvatar">U</div>
                <div class="user-info"><h3 id="sidebarName">User</h3><p>View Profile</p></div>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar" style="display:flex;align-items:center;gap:12px;"><button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu"><i data-lucide="menu" style="width:20px;height:20px;"></i></button><h1>My Wallet</h1></div>
        <div class="wallet-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px;">
                <div class="wallet-label" style="margin-bottom: 0;">Available Balance</div>
                <button onclick="toggleBalance()" title="Toggle balance" style="background: rgba(255,255,255,0.15); border: none; padding: 7px; border-radius: 8px; cursor: pointer;">
                    <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px; color: #fff;"></i>
                </button>
            </div>
            <div class="wallet-balance" id="balance">₦0.00</div>
            <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                <button class="wallet-btn" onclick="openModal('fund')"><i data-lucide="plus-circle" style="width: 20px; height: 20px;"></i><span>Fund Wallet</span></button>
                <!-- <button class="wallet-btn" onclick="openModal('transfer')"><i data-lucide="send" style="width: 20px; height: 20px;"></i><span>Transfer</span></button>
                <button class="wallet-btn" onclick="openModal('withdraw')"><i data-lucide="download" style="width: 20px; height: 20px;"></i><span>Withdraw</span></button> -->
            </div>
        </div>
        <div class="section-header" style="margin-top: 32px;"><h2 class="section-title">Recent Transactions</h2></div>
        <div class="activity-list" id="recent"><div style="text-align: center; padding: 48px; color: #94a3b8;">Loading...</div></div>
    </div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="modals/native-modals.js"></script>
    <script>
        if (!api.getToken()) { window.location.href = '../login.html'; }

        // Populate sidebar from cached user
        const _u = JSON.parse(localStorage.getItem('user_data') || '{}');
        if (_u.firstName) {
            document.getElementById('sidebarName').textContent   = _u.firstName;
            document.getElementById('sidebarAvatar').textContent = (_u.firstName[0] + (_u.lastName?.[0] || '')).toUpperCase();
        }

        let hideBalance = false;
        let actualBalance = 0;

        function toggleBalance() {
            hideBalance = !hideBalance;
            document.getElementById('balance').textContent = hideBalance ? '₦****' : '₦' + actualBalance.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('eyeIcon').setAttribute('data-lucide', hideBalance ? 'eye-off' : 'eye');
            lucide.createIcons();
        }

        async function load() {
            try {
                const w = await api.getWalletBalance();
                const walletData = w.data?.wallet || w.data || {};
                actualBalance = parseFloat(walletData.balance || 0);
                if (!hideBalance) {
                    document.getElementById('balance').textContent = '₦' + actualBalance.toLocaleString('en-US', {minimumFractionDigits: 2});
                }

                const t = await api.getTransactions({ limit: 20 });
                const txns = t.data?.transactions || t.transactions || [];
                const iconMap = {
                    data_recharge: {icon:'wifi', bg:'#eff6ff', color:'#2563eb'},
                    airtime: {icon:'phone', bg:'#f0fdf4', color:'#16a34a'},
                    electricity: {icon:'zap', bg:'#fffbeb', color:'#d97706'},
                    cable: {icon:'tv', bg:'#faf5ff', color:'#9333ea'},
                    wallet_funding: {icon:'arrow-down-circle', bg:'#dcfce7', color:'#16a34a'},
                    fund_wallet:    {icon:'arrow-down-circle', bg:'#dcfce7', color:'#16a34a'},
                    transfer: {icon:'send', bg:'#eff6ff', color:'#1e3d5c'},
                };
                document.getElementById('recent').innerHTML = txns.length
                    ? txns.map(x => {
                        const t = iconMap[x.type] || {icon:'receipt', bg:'#f8fafc', color:'#64748b'};
                        const txStatus = (x.status || x.paymentStatus || '').toUpperCase();
                        const isFailed  = txStatus === 'FAILED';
                        const isPending = txStatus === 'PENDING' || txStatus === 'PROCESSING';
                        const typeNorm  = (x.type || '').toUpperCase().replace(/[\s]+/g,'_');
                        const isCredit  = typeNorm === 'FUND_WALLET' || typeNorm === 'WALLET_FUND' || typeNorm === 'WALLET_FUNDING' || typeNorm === 'WALLET_TOPUP';
                        const amtColor  = isFailed ? '#94a3b8' : isPending ? '#d97706' : isCredit ? '#16a34a' : '#dc2626';
                        const prefix    = isFailed ? '' : isCredit ? '+' : '-';
                        const statusDot = isFailed  ? `<span style="font-size:10px;color:#94a3b8;display:block;text-align:right;">Failed</span>`
                                       : isPending ? `<span style="font-size:10px;color:#d97706;display:block;text-align:right;">Pending</span>`
                                       : '';
                        return `<div class="activity-item">
                            <div class="activity-icon" style="background:${isFailed ? '#f1f5f9' : t.bg}; display:flex; align-items:center; justify-content:center; opacity:${isFailed ? '0.5' : '1'};"><i data-lucide="${t.icon}" style="width:20px;height:20px;color:${isFailed ? '#94a3b8' : t.color};"></i></div>
                            <div class="activity-info">
                                <div class="activity-title" style="opacity:${isFailed ? '0.55' : '1'}">${x.description || x.type || 'Transaction'}</div>
                                <div class="activity-time">${new Date(x.createdAt).toLocaleString()}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="activity-amount" style="color:${amtColor};${isFailed ? 'text-decoration:line-through;' : ''}">${prefix}₦${Math.abs(x.amount).toLocaleString('en-US', {minimumFractionDigits:2})}</div>
                                ${statusDot}
                            </div>
                        </div>`;
                    }).join('')
                    : '<div style="text-align:center;padding:48px;color:#94a3b8;">No transactions yet</div>';

                lucide.createIcons();
            } catch (e) {
                console.error('Wallet load error:', e);
                document.getElementById('balance').textContent = '₦0.00';
                document.getElementById('recent').innerHTML = '<div style="text-align:center;padding:48px;color:#94a3b8;">Could not load data</div>';
            }
        }

        load();
        lucide.createIcons();
    </script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.querySelector('.sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        function logout() {
            localStorage.removeItem('user_token');
            localStorage.removeItem('user_data');
            sessionStorage.removeItem('user_token');
            sessionStorage.removeItem('user_data');
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
