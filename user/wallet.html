<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.png">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .receipt-modal-body {
            max-height: 60vh;
            overflow-y: auto;
            padding: 16px;
        }
        .receipt-pdf-viewer {
            width: 100%;
            min-height: 400px;
            border: none;
            border-radius: 12px;
        }
        .receipt-loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .receipt-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }
        .btn-download {
            background: #1e3d5c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-close {
            background: #f1f5f9;
            color: #334155;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="assets/js/receipt-card.js"></script>
</head>
<body>
    
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/images/logo.png" alt="Logo">
            <h1>Yareema Data Hub</h1>
        </div>
        <div class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <i data-lucide="home" style="width: 20px; height: 20px;"></i><span>Dashboard</span>
            </a>
            <a href="services.html" class="nav-item">
                <i data-lucide="grid" style="width: 20px; height: 20px;"></i><span>Services</span>
            </a>
            <a href="transactions.html" class="nav-item">
                <i data-lucide="banknote" class="w-5 h-5"></i><span>Transactions</span>
            </a>
            <a href="wallet.html" class="nav-item active">
                <i data-lucide="wallet" style="width: 20px; height: 20px;"></i><span>Wallet</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i data-lucide="user" style="width: 20px; height: 20px;"></i><span>Profile</span>
            </a>
            <a href="#" class="nav-item logout" onclick="logout(); return false;" style="margin-top: 16px;">
                <i data-lucide="log-out" style="width: 20px; height: 20px;"></i>
                <span>Logout</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-profile" onclick="window.location.href='profile.html'">
                <div class="user-avatar" id="sidebarAvatar">U</div>
                <div class="user-info"><h3 id="sidebarName">User</h3><p>View Profile</p></div>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="top-bar" style="display:flex;align-items:center;gap:12px;"><button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu"><i data-lucide="menu" style="width:20px;height:20px;"></i></button><h1>My Wallet</h1></div>
        <div class="wallet-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px;">
                <div class="wallet-label" style="margin-bottom: 0;">Available Balance</div>
                <button onclick="toggleBalance()" title="Toggle balance" style="background: rgba(255,255,255,0.15); border: none; padding: 7px; border-radius: 8px; cursor: pointer;">
                    <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px; color: #fff;"></i>
                </button>
            </div>
            <div class="wallet-balance" id="balance">₦0.00</div>
            <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                <button class="wallet-btn" onclick="openModal('fund')"><i data-lucide="plus-circle" style="width: 20px; height: 20px;"></i><span>Fund Wallet</span></button>
            </div>
        </div>
        <div class="section-header" style="margin-top: 32px;"><h2 class="section-title">Recent Transactions</h2></div>
        <div class="activity-list" id="recent"><div style="text-align: center; padding: 48px; color: #94a3b8;">Loading...</div></div>
    </div>

    <!-- Receipt Modal -->
    <div id="receiptModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 24px; max-width: 700px; width: 90%; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column;">
            <div style="padding: 20px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-weight: 700; font-size: 1.25rem;">Receipt</h3>
                <button onclick="closeReceiptModal()" style="background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
            </div>
            <div id="receiptContent" style="flex: 1; overflow-y: auto; padding: 20px;">
                <div class="receipt-loading">Loading receipt...</div>
            </div>
            <div style="padding: 16px 24px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 12px;">
                <button onclick="closeReceiptModal()" class="btn-close">Close</button>
                <button id="downloadReceiptBtn" class="btn-download" style="display: none;">
                    <i data-lucide="download" style="width: 18px; height: 18px;"></i> Download PDF
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="modals/native-modals.js"></script>
    <script>
        if (!api.getToken()) { window.location.href = '../login.html'; }

        // Populate sidebar from cached user
        const _u = JSON.parse(localStorage.getItem('user_data') || '{}');
        if (_u.firstName) {
            document.getElementById('sidebarName').textContent   = _u.firstName;
            document.getElementById('sidebarAvatar').textContent = (_u.firstName[0] + (_u.lastName?.[0] || '')).toUpperCase();
        }

        let hideBalance = false;
        let actualBalance = 0;
        let currentReceiptBlob = null;
        let currentReceiptTransactionId = null;

        function toggleBalance() {
            hideBalance = !hideBalance;
            document.getElementById('balance').textContent = hideBalance ? '₦****' : '₦' + actualBalance.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('eyeIcon').setAttribute('data-lucide', hideBalance ? 'eye-off' : 'eye');
            lucide.createIcons();
        }

        // Show receipt modal and fetch receipt
        async function showReceipt(transactionId, event) {
            if (event) event.stopPropagation();
            if (!transactionId) {
                alert('Transaction ID missing');
                return;
            }

            currentReceiptTransactionId = transactionId;
            const modal = document.getElementById('receiptModal');
            const contentDiv = document.getElementById('receiptContent');
            const downloadBtn = document.getElementById('downloadReceiptBtn');
            
            modal.style.display = 'flex';
            contentDiv.innerHTML = '<div class="receipt-loading"><i data-lucide="loader" class="animate-spin" style="width: 32px; margin-bottom: 12px;"></i><br/>Loading receipt...</div>';
            downloadBtn.style.display = 'none';
            lucide.createIcons();
            
            try {
                const token = api.getToken();
                if (!token) throw new Error('Not authenticated');
                
                const response = await fetch(`${API_CONFIG.BASE_URL}/api/v1/wallet/transactions/${transactionId}/receipt`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/pdf, application/json, text/html'
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.message || `Failed (${response.status})`);
                }
                
                const contentType = response.headers.get('content-type');
                
                if (contentType && contentType.includes('application/pdf')) {
                    currentReceiptBlob = await response.blob();
                    const pdfUrl = URL.createObjectURL(currentReceiptBlob);
                    
                    contentDiv.innerHTML = `
                        <iframe src="${pdfUrl}" class="receipt-pdf-viewer" style="width: 100%; height: 500px; border: none; border-radius: 8px;"></iframe>
                    `;
                    downloadBtn.style.display = 'inline-flex';
                    
                    const closeHandler = () => {
                        URL.revokeObjectURL(pdfUrl);
                        modal.removeEventListener('modalClosed', closeHandler);
                    };
                    modal.addEventListener('modalClosed', closeHandler, { once: true });
                    
                } else if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    if (data.receiptUrl) {
                        contentDiv.innerHTML = `
                            <iframe src="${data.receiptUrl}" class="receipt-pdf-viewer" style="width: 100%; height: 500px; border: none; border-radius: 8px;"></iframe>
                        `;
                        downloadBtn.style.display = 'inline-flex';
                        const blobResponse = await fetch(data.receiptUrl);
                        currentReceiptBlob = await blobResponse.blob();
                    } else if (data.receiptData) {
                        const byteCharacters = atob(data.receiptData);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        currentReceiptBlob = new Blob([byteArray], { type: 'application/pdf' });
                        const pdfUrl = URL.createObjectURL(currentReceiptBlob);
                        contentDiv.innerHTML = `
                            <iframe src="${pdfUrl}" class="receipt-pdf-viewer" style="width: 100%; height: 500px; border: none; border-radius: 8px;"></iframe>
                        `;
                        downloadBtn.style.display = 'inline-flex';
                    } else {
                        contentDiv.innerHTML = `
                            <div style="padding: 20px; text-align: center;">
                                <h4>Receipt Information</h4>
                                <pre style="background: #f8fafc; padding: 16px; border-radius: 8px; overflow-x: auto;">${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
                    }
                } else {
                    const text = await response.text();
                    contentDiv.innerHTML = text;
                }
                
                lucide.createIcons();
                
            } catch (error) {
                console.error('Receipt error:', error);
                contentDiv.innerHTML = `
                    <div class="receipt-loading" style="color: #ef4444;">
                        <i data-lucide="alert-circle" style="width: 32px; margin-bottom: 12px;"></i><br/>
                        Failed to load receipt: ${error.message}
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function downloadCurrentReceipt() {
            if (currentReceiptBlob) {
                const url = URL.createObjectURL(currentReceiptBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `receipt_${currentReceiptTransactionId}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } else {
                alert('No receipt loaded. Please try again.');
            }
        }

        function closeReceiptModal() {
            const modal = document.getElementById('receiptModal');
            modal.style.display = 'none';
            currentReceiptBlob = null;
            currentReceiptTransactionId = null;
            modal.dispatchEvent(new Event('modalClosed'));
        }

        async function load() {
            try {
                const w = await api.getWalletBalance();
                const walletData = w.data?.wallet || w.data || {};
                actualBalance = parseFloat(walletData.balance || 0);
                if (!hideBalance) {
                    document.getElementById('balance').textContent = '₦' + actualBalance.toLocaleString('en-US', {minimumFractionDigits: 2});
                }

                const t = await api.getTransactions({ limit: 20 });
                const txns = t.data?.transactions || t.transactions || [];
                const iconMap = {
                    data_recharge: {icon:'wifi', bg:'#eff6ff', color:'#2563eb'},
                    airtime: {icon:'phone', bg:'#f0fdf4', color:'#16a34a'},
                    electricity: {icon:'zap', bg:'#fffbeb', color:'#d97706'},
                    cable: {icon:'tv', bg:'#faf5ff', color:'#9333ea'},
                    wallet_funding: {icon:'arrow-down-circle', bg:'#dcfce7', color:'#16a34a'},
                    fund_wallet:    {icon:'arrow-down-circle', bg:'#dcfce7', color:'#16a34a'},
                    transfer: {icon:'send', bg:'#eff6ff', color:'#1e3d5c'},
                };
                document.getElementById('recent').innerHTML = txns.length
                    ? txns.map(x => {
                        const t = iconMap[x.type] || {icon:'receipt', bg:'#f8fafc', color:'#64748b'};
                        const txStatus = (x.status || x.paymentStatus || '').toUpperCase();
                        const isFailed  = txStatus === 'FAILED';
                        const isPending = txStatus === 'PENDING' || txStatus === 'PROCESSING';
                        const typeNorm  = (x.type || '').toUpperCase().replace(/[\s]+/g,'_');
                        const isCredit  = typeNorm === 'FUND_WALLET' || typeNorm === 'WALLET_FUND' || typeNorm === 'WALLET_FUNDING' || typeNorm === 'WALLET_TOPUP';
                        const amtColor  = isFailed ? '#94a3b8' : isPending ? '#d97706' : isCredit ? '#16a34a' : '#dc2626';
                        const prefix    = isFailed ? '' : isCredit ? '+' : '-';
                        const statusDot = isFailed  ? `<span style="font-size:10px;color:#94a3b8;display:block;text-align:right;">Failed</span>`
                                       : isPending ? `<span style="font-size:10px;color:#d97706;display:block;text-align:right;">Pending</span>`
                                       : '';
                        const transactionId = x.id || x._id;
                        return `<div class="activity-item">
                            <div class="activity-icon" style="background:${isFailed ? '#f1f5f9' : t.bg}; display:flex; align-items:center; justify-content:center; opacity:${isFailed ? '0.5' : '1'};"><i data-lucide="${t.icon}" style="width:20px;height:20px;color:${isFailed ? '#94a3b8' : t.color};"></i></div>
                            <div class="activity-info">
                                <div class="activity-title" style="opacity:${isFailed ? '0.55' : '1'}">${x.description || x.type || 'Transaction'}</div>
                                <div class="activity-time">${new Date(x.createdAt).toLocaleString()}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="activity-amount" style="color:${amtColor};${isFailed ? 'text-decoration:line-through;' : ''}">${prefix}₦${Math.abs(x.amount).toLocaleString('en-US', {minimumFractionDigits:2})}</div>
                                <div style="display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px;">
                                    ${statusDot ? statusDot : ''}
                                    ${(transactionId && !isFailed && txStatus !== 'FAILED') ? `<button onclick="openReceiptCard(${JSON.stringify(t).replace(/"/g,'&quot;')}, event)" style="background:#eef2ff; border:none; border-radius:20px; padding:3px 8px; font-size:10px; font-weight:500; cursor:pointer; color:#1e3d5c; display:flex; align-items:center; gap:3px;"><i data-lucide="file-text" style="width:10px;height:10px;"></i> Receipt</button>` : ''}
                                </div>
                            </div>
                        </div>`;
                    }).join('')
                    : '<div style="text-align:center;padding:48px;color:#94a3b8;">No transactions yet</div>';

                lucide.createIcons();
            } catch (e) {
                console.error('Wallet load error:', e);
                document.getElementById('balance').textContent = '₦0.00';
                document.getElementById('recent').innerHTML = '<div style="text-align:center;padding:48px;color:#94a3b8;">Could not load data</div>';
            }
        }

        document.getElementById('downloadReceiptBtn').onclick = downloadCurrentReceipt;
        load();
        lucide.createIcons();
    </script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.querySelector('.sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        function logout() {
            localStorage.removeItem('user_token');
            localStorage.removeItem('user_data');
            sessionStorage.removeItem('user_token');
            sessionStorage.removeItem('user_data');
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
