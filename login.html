<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yareema Data Hub - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .form-input:focus {
            border-color: #1E3D5C;
            box-shadow: 0 0 0 3px rgba(30, 61, 92, 0.1);
        }
        
        .btn-primary {
            background-color: #1E3D5C;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: #16304a;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 61, 92, 0.3);
        }
        
        .password-toggle {
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s ease;
        }
        
        .password-toggle:hover {
            color: #1E3D5C;
        }
        
        .auth-link {
            color: #1E3D5C;
            font-weight: 600;
            cursor: pointer;
        }
        
        .auth-link:hover {
            color: #16304a;
            text-decoration: underline;
        }
        
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="w-full max-w-md p-8 sm:p-8">
            <div class="auth-card p-6 sm:p-8">
                <!-- Logo -->
                 <div class="flex justify-center">
    <div class="h-40 w-40 flex items-center justify-center">
        <img src="logo.png" 
             alt="Yareema Data Hub Logo"
             ">
    </div>
</div>
                <div class="text-center mb-4">  
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Welcome Back</h2>
                    <p class="text-slate-600">Login to continue your seamless experience</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-5">
                    <!-- Email/Phone -->
                    <div>
                        <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">
                            Email or Phone
                        </label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input
                                type="text"
                                id="login-email"
                                class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg form-input focus:outline-none"
                                placeholder="Enter your email"
                                value="user@example.com"
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="login-password" class="block text-sm font-medium text-slate-700">
                                Password
                            </label>
                            <button type="button" id="forgot-password" class="text-sm text-primary font-semibold hover:underline">
                                Forgot Password?
                            </button>
                        </div>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input
                                type="password"
                                id="login-password"
                                class="w-full pl-10 pr-12 py-3 border border-slate-300 rounded-lg form-input focus:outline-none"
                                placeholder="Enter password"
                                value="password123"
                            >
                            <button type="button" id="toggle-login-password" class="password-toggle absolute right-3 top-1/2 transform -translate-y-1/2">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="login-error" class="error-message"></div>

                    <!-- Login Button -->
                    <button type="submit" id="login-btn" class="w-full py-3 bg-primary text-white font-semibold rounded-lg btn-primary flex items-center justify-center">
                        <span>Login</span>
                        <div id="login-spinner" class="hidden ml-2">
                            <i data-lucide="loader" class="w-5 h-5 animate-spin"></i>
                        </div>
                    </button>

                    <!-- Sign Up Link -->
                    <p class="text-center text-slate-600 text-sm pt-4">
                        Don't have an account? 
                        <a href="signup.html" class="auth-link ml-1">Sign Up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Password visibility toggle
        const toggleLoginPassword = document.getElementById('toggle-login-password');
        const loginPassword = document.getElementById('login-password');

        toggleLoginPassword.addEventListener('click', () => {
            const icon = toggleLoginPassword.querySelector('i');
            if (loginPassword.type === 'password') {
                loginPassword.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                loginPassword.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = loginPassword.value;
            
            // Simple validation
            if (!email || !password) {
                showError('login-error', 'Please fill in all fields');
                return;
            }
            
            hideError('login-error');
            
            // Simulate login process
            const loginBtn = document.getElementById('login-btn');
            const loginSpinner = document.getElementById('login-spinner');
            loginBtn.disabled = true;
            loginSpinner.classList.remove('hidden');
            
            // Simulate API call
            setTimeout(() => {
                alert('Login successful! Welcome to Yareema Data Hub.');
                loginBtn.disabled = false;
                loginSpinner.classList.add('hidden');
                
                // Redirect to dashboard/home page
                // window.location.href = 'index.html';
            }, 1500);
        });

        // Forgot password
        document.getElementById('forgot-password').addEventListener('click', () => {
            const email = prompt('Enter your email to reset password:');
            if (email) {
                alert(`Password reset link has been sent to ${email}`);
            }
        });

        // Helper functions
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function hideError(elementId) {
            const errorElement = document.getElementById(elementId);
            errorElement.style.display = 'none';
        }
    </script>
</body>
</html>
