<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yareema Data Hub - Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }
        
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin: auto;
        }
        
        .form-input:focus {
            border-color: #1E3D5C;
            box-shadow: 0 0 0 3px rgba(30, 61, 92, 0.1);
        }
        
        .btn-primary {
            background-color: #1E3D5C;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: #16304a;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 61, 92, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background-color: #f1f5f9;
            color: #475569;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background-color: #e2e8f0;
        }
        
        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            padding: 0.75rem;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 0.5rem;
            display: none;
        }
        
        .success-message {
            color: #059669;
            font-size: 0.875rem;
            padding: 0.75rem;
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            border-radius: 0.5rem;
            display: none;
        }
        
        .otp-input {
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            font-weight: 600;
        }
        
        @media (max-width: 640px) {
            .auth-container {
                padding: 16px;
            }
            
            .auth-card {
                border-radius: 12px;
            }
            
            .logo-container {
                height: 100px !important;
                width: 100px !important;
            }
        }
        
        @media (min-width: 641px) and (max-width: 1023px) {
            .auth-card {
                max-width: 440px;
                min-width: 400px;
            }
        }
        
        @media (min-width: 1024px) {
            .auth-card {
                max-width: 480px;
                min-width: 440px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="w-full">
            <div class="auth-card p-6 sm:p-8">
                <!-- Logo -->
                <div class="flex justify-center mb-6 sm:mb-8">
                    <div class="logo-container h-32 w-32 sm:h-40 sm:w-40 flex items-center justify-center">
                        <img src="logo.png" 
                             alt="Yareema Data Hub Logo"
                             class="max-h-full max-w-full object-contain">
                    </div>
                </div>
                
                <div class="text-center mb-6 sm:mb-8">  
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">Verify Your Email</h2>
                    <p class="text-slate-600 text-sm sm:text-base">
                        We've sent a verification code to<br>
                        <span id="display-email" class="font-semibold text-slate-900"></span>
                    </p>
                </div>

                <!-- OTP Form -->
                <form id="otp-form" class="space-y-5 sm:space-y-6">
                    <!-- OTP Input -->
                    <div>
                        <label for="otp-input" class="block text-sm font-medium text-slate-700 mb-2">
                            Enter 6-Digit Code
                        </label>
                        <input
                            type="text"
                            id="otp-input"
                            maxlength="6"
                            class="otp-input w-full px-4 py-3 sm:py-3.5 border border-slate-300 rounded-lg form-input focus:outline-none"
                            placeholder="000000"
                            inputmode="numeric"
                            pattern="[0-9]*"
                        >
                        <div id="otp-error" class="error-message mt-2"></div>
                    </div>

                    <!-- Messages -->
                    <div id="verify-error" class="error-message"></div>
                    <div id="verify-success" class="success-message"></div>

                    <!-- Verify Button -->
                    <button type="submit" id="verify-btn" class="w-full py-3.5 sm:py-4 bg-primary text-white font-semibold rounded-lg btn-primary flex items-center justify-center text-sm sm:text-base">
                        <span id="verify-text">Verify Email</span>
                        <div id="verify-spinner" class="hidden ml-2">
                            <i data-lucide="loader" class="w-5 h-5 animate-spin"></i>
                        </div>
                    </button>

                    <!-- Resend OTP -->
                    <div class="text-center">
                        <p class="text-slate-600 text-sm sm:text-base mb-3">
                            Didn't receive the code?
                        </p>
                        <button type="button" id="resend-btn" class="px-6 py-2 bg-secondary text-slate-700 font-semibold rounded-lg btn-secondary text-sm sm:text-base">
                            <span id="resend-text">Resend Code</span>
                            <span id="resend-timer" class="hidden"></span>
                        </button>
                    </div>

                    <!-- Back to Login -->
                    <p class="text-center text-slate-600 text-sm sm:text-base pt-4 sm:pt-6">
                        <a href="login.html" class="text-primary font-semibold hover:underline">Back to Login</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Load Auth Infrastructure -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/auth-guard.js"></script>
    
    <script>
        lucide.createIcons();

        // Check if this is for password reset or email verification
        const urlParams = new URLSearchParams(window.location.search);
        const verificationType = urlParams.get('type'); // 'password-reset' or null
        const isPasswordReset = verificationType === 'password-reset';
        
        // Get email from session storage
        const email = isPasswordReset 
            ? sessionStorage.getItem('password_reset_email')
            : sessionStorage.getItem('pending_verification_email');
        
        if (!email) {
            window.location.href = isPasswordReset ? 'forgot-password.html' : 'signup.html';
        }

        // Update UI based on type
        if (isPasswordReset) {
            document.querySelector('h2').textContent = 'Verify Your Identity';
            document.querySelector('h2').nextElementSibling.innerHTML = 
                'We\'ve sent a verification code to<br><span id="display-email" class="font-semibold text-slate-900"></span>';
        }

        document.getElementById('display-email').textContent = email;

        // OTP input formatting
        const otpInput = document.getElementById('otp-input');
        otpInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Verify OTP Form
        document.getElementById('otp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otp = otpInput.value.trim();
            
            if (!otp) {
                showError('otp-error', 'Please enter the verification code');
                return;
            }
            
            if (otp.length !== 6) {
                showError('otp-error', 'Please enter a valid 6-digit code');
                return;
            }
            
            hideMessages();
            
            const verifyBtn = document.getElementById('verify-btn');
            const verifyText = document.getElementById('verify-text');
            const verifySpinner = document.getElementById('verify-spinner');
            const originalText = verifyText.textContent;
            
            verifyBtn.disabled = true;
            verifyText.textContent = 'Verifying...';
            verifySpinner.classList.remove('hidden');
            lucide.createIcons();
            
            try {
                const response = await api.verifyOTP(email, otp, 'email');
                
                if (response.success !== false) {
                    if (isPasswordReset) {
                        // For password reset - store token and redirect to reset password page
                        const resetToken = response.token || response.data?.token || response.resetToken;
                        if (resetToken) {
                            sessionStorage.setItem('password_reset_token', resetToken);
                        }
                        
                        sessionStorage.removeItem('password_reset_email');
                        
                        Swal.fire({
                            icon: 'success',
                            title: 'Code Verified!',
                            text: 'You can now reset your password.',
                            timer: 1500,
                            showConfirmButton: false,
                            didClose: () => {
                                window.location.href = 'reset-password.html';
                            }
                        });
                    } else {
                        // For email verification - redirect to login
                        sessionStorage.removeItem('pending_verification_email');
                        sessionStorage.removeItem('registration_complete');
                        
                        Swal.fire({
                            icon: 'success',
                            title: 'Email Verified!',
                            text: 'Your email has been verified successfully.',
                            timer: 1500,
                            showConfirmButton: false,
                            didClose: () => {
                                window.location.href = 'login.html';
                            }
                        });
                    }
                } else {
                    showError('verify-error', response.message || 'Invalid verification code');
                    resetButton();
                }
            } catch (error) {
                console.error('OTP verification error:', error);
                showError('verify-error', error.message || 'Verification failed. Please try again.');
                resetButton();
            }
            
            function resetButton() {
                verifyBtn.disabled = false;
                verifyText.textContent = originalText;
                verifySpinner.classList.add('hidden');
            }
        });

        // Resend OTP
        let resendTimer;
        let resendCountdown = 0;

        document.getElementById('resend-btn').addEventListener('click', async () => {
            const resendBtn = document.getElementById('resend-btn');
            const resendText = document.getElementById('resend-text');
            const resendTimerEl = document.getElementById('resend-timer');
            
            if (resendCountdown > 0) return;
            
            hideMessages();
            
            resendBtn.disabled = true;
            resendText.textContent = 'Sending...';
            
            try {
                const response = await api.resendOTP(email, 'email');
                
                if (response.success !== false) {
                    // Show toast notification
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'success',
                        title: 'Code sent!',
                        text: 'Check your email for the new code',
                        showConfirmButton: false,
                        timer: 3000,
                        timerProgressBar: true
                    });
                    
                    // Start countdown timer
                    resendCountdown = 60;
                    resendText.classList.add('hidden');
                    resendTimerEl.classList.remove('hidden');
                    
                    resendTimer = setInterval(() => {
                        resendCountdown--;
                        resendTimerEl.textContent = `Resend in ${resendCountdown}s`;
                        
                        if (resendCountdown <= 0) {
                            clearInterval(resendTimer);
                            resendText.classList.remove('hidden');
                            resendTimerEl.classList.add('hidden');
                            resendBtn.disabled = false;
                            resendText.textContent = 'Resend Code';
                        }
                    }, 1000);
                } else {
                    showError('verify-error', response.message || 'Failed to resend code');
                    resendBtn.disabled = false;
                    resendText.textContent = 'Resend Code';
                }
            } catch (error) {
                console.error('Resend OTP error:', error);
                showError('verify-error', error.message || 'Failed to resend code');
                resendBtn.disabled = false;
                resendText.textContent = 'Resend Code';
            }
        });

        // Helper functions
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function showSuccess(elementId, message) {
            const successElement = document.getElementById(elementId);
            successElement.textContent = message;
            successElement.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('otp-error').style.display = 'none';
            document.getElementById('verify-error').style.display = 'none';
            document.getElementById('verify-success').style.display = 'none';
        }
    </script>
</body>
</html>
