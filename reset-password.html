<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yareema Data Hub - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }
        
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin: auto;
        }
        
        .form-input:focus {
            border-color: #1E3D5C;
            box-shadow: 0 0 0 3px rgba(30, 61, 92, 0.1);
        }
        
        .btn-primary {
            background-color: #1E3D5C;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: #16304a;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 61, 92, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .password-toggle {
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s ease;
        }
        
        .password-toggle:hover {
            color: #1E3D5C;
        }
        
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            padding: 0.75rem;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 0.5rem;
            display: none;
        }
        
        .success-message {
            color: #059669;
            font-size: 0.875rem;
            padding: 0.75rem;
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            border-radius: 0.5rem;
            display: none;
        }
        
        @media (max-width: 640px) {
            .auth-container {
                padding: 16px;
            }
            
            .auth-card {
                border-radius: 12px;
            }
            
            .logo-container {
                height: 100px !important;
                width: 100px !important;
            }
        }
        
        @media (min-width: 641px) and (max-width: 1023px) {
            .auth-card {
                max-width: 440px;
                min-width: 400px;
            }
        }
        
        @media (min-width: 1024px) {
            .auth-card {
                max-width: 480px;
                min-width: 440px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="w-full">
            <div class="auth-card p-6 sm:p-8">
                <!-- Logo -->
                <div class="flex justify-center mb-6 sm:mb-8">
                    <div class="logo-container h-32 w-32 sm:h-40 sm:w-40 flex items-center justify-center">
                        <img src="logo.png" 
                             alt="Yareema Data Hub Logo"
                             class="max-h-full max-w-full object-contain">
                    </div>
                </div>
                
                <div class="text-center mb-6 sm:mb-8">  
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">Reset Password</h2>
                    <p class="text-slate-600 text-sm sm:text-base">Enter your new password below</p>
                </div>

                <!-- Reset Password Form -->
                <form id="reset-form" class="space-y-5 sm:space-y-6">
                    <!-- New Password -->
                    <div>
                        <label for="new-password" class="block text-sm font-medium text-slate-700 mb-2">
                            New Password
                        </label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input
                                type="password"
                                id="new-password"
                                class="w-full pl-10 pr-12 py-3 sm:py-3.5 border border-slate-300 rounded-lg form-input focus:outline-none text-sm sm:text-base"
                                placeholder="Enter new password"
                                required
                            >
                            <button type="button" id="toggle-new-password" class="password-toggle absolute right-3 top-1/2 transform -translate-y-1/2">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div id="password-error" class="error-message mt-2"></div>
                        <ul id="password-rules" class="text-xs mt-2 space-y-1">
                            <li data-rule="length" data-label="At least 8 characters" class="text-slate-400">• At least 8 characters</li>
                            <li data-rule="upper" data-label="One uppercase letter (A–Z)" class="text-slate-400">• One uppercase letter (A–Z)</li>
                            <li data-rule="number" data-label="One number (0–9)" class="text-slate-400">• One number (0–9)</li>
                        </ul>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-2">
                            Confirm Password
                        </label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            <input
                                type="password"
                                id="confirm-password"
                                class="w-full pl-10 pr-12 py-3 sm:py-3.5 border border-slate-300 rounded-lg form-input focus:outline-none text-sm sm:text-base"
                                placeholder="Confirm new password"
                                required
                            >
                            <button type="button" id="toggle-confirm-password" class="password-toggle absolute right-3 top-1/2 transform -translate-y-1/2">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div id="confirm-error" class="error-message mt-2"></div>
                    </div>

                    <!-- Messages -->
                    <div id="reset-error" class="error-message"></div>
                    <div id="reset-success" class="success-message"></div>

                    <!-- Submit Button -->
                    <button type="submit" id="reset-btn" class="w-full py-3.5 sm:py-4 bg-primary text-white font-semibold rounded-lg btn-primary flex items-center justify-center text-sm sm:text-base">
                        <span id="reset-text">Reset Password</span>
                        <div id="reset-spinner" class="hidden ml-2">
                            <i data-lucide="loader" class="w-5 h-5 animate-spin"></i>
                        </div>
                    </button>

                    <!-- Back to Login -->
                    <p class="text-center text-slate-600 text-sm sm:text-base pt-4 sm:pt-6">
                        <a href="login.html" class="text-primary font-semibold hover:underline">Back to Login</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Load Auth Infrastructure -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/auth-guard.js"></script>
    
    <script>
        lucide.createIcons();

        // Get reset token from session storage (set after OTP verification)
        let resetToken = sessionStorage.getItem('password_reset_token');
        
        // Fallback: check URL parameter (for email link method if backend supports it)
        if (!resetToken) {
            const urlParams = new URLSearchParams(window.location.search);
            resetToken = urlParams.get('token');
        }

        if (!resetToken) {
            showError('reset-error', 'Invalid or missing reset token. Please request a new password reset.');
            document.getElementById('reset-btn').disabled = true;
        }

        // Password toggle functionality
        function setupPasswordToggle(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            
            toggle.addEventListener('click', () => {
                const icon = toggle.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.setAttribute('data-lucide', 'eye-off');
                } else {
                    input.type = 'password';
                    icon.setAttribute('data-lucide', 'eye');
                }
                lucide.createIcons();
            });
        }

        setupPasswordToggle('new-password', 'toggle-new-password');
        setupPasswordToggle('confirm-password', 'toggle-confirm-password');

        // Reset Password Form
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Reset errors
            hideError('password-error');
            hideError('confirm-error');
            hideError('reset-error');
            hideError('reset-success');
            
            let hasError = false;
            
            // Validation
            if (!newPassword) {
                showError('password-error', 'Please enter a new password');
                hasError = true;
            } else if (!yrIsStrongPassword(newPassword)) {
                showError('password-error', 'Password must be at least 8 characters and include an uppercase letter and a number');
                hasError = true;
            }
            
            if (!confirmPassword) {
                showError('confirm-error', 'Please confirm your password');
                hasError = true;
            } else if (newPassword !== confirmPassword) {
                showError('confirm-error', 'Passwords do not match');
                hasError = true;
            }
            
            if (hasError) return;
            
            const resetBtn = document.getElementById('reset-btn');
            const resetText = document.getElementById('reset-text');
            const resetSpinner = document.getElementById('reset-spinner');
            const originalText = resetText.textContent;
            
            resetBtn.disabled = true;
            resetText.textContent = 'Resetting...';
            resetSpinner.classList.remove('hidden');
            lucide.createIcons();
            
            try {
                const response = await api.resetPassword(resetToken, newPassword);
                
                if (response.success !== false) {
                    // Clear session storage
                    sessionStorage.removeItem('password_reset_token');
                    sessionStorage.removeItem('password_reset_email');
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Password Reset Successful!',
                        text: 'You can now login with your new password.',
                        timer: 2000,
                        showConfirmButton: false,
                        didClose: () => {
                            window.location.href = 'login.html';
                        }
                    });
                } else {
                    showError('reset-error', response.message || 'Password reset failed');
                    resetButton();
                }
            } catch (error) {
                console.error('Reset password error:', error);
                
                // Check if token expired
                if (error.message.includes('expired') || error.message.includes('invalid')) {
                    showError('reset-error', 'This reset link has expired or is invalid. Please request a new password reset.');
                } else {
                    showError('reset-error', error.message || 'Password reset failed. Please try again.');
                }
                resetButton();
            }
            
            function resetButton() {
                resetBtn.disabled = false;
                resetText.textContent = originalText;
                resetSpinner.classList.add('hidden');
            }
        });

        // Helper functions
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function showSuccess(elementId, message) {
            const successElement = document.getElementById(elementId);
            successElement.textContent = message;
            successElement.style.display = 'block';
        }

        function hideError(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                element.style.display = 'none';
            }
        }
    
        // --- Password strength (8+ chars, 1 uppercase, 1 number) ---
        function yrCheckPassword(v){return {length:(v||'').length>=8, upper:/[A-Z]/.test(v||''), number:/[0-9]/.test(v||'')};}
        function yrIsStrongPassword(v){var r=yrCheckPassword(v);return r.length&&r.upper&&r.number;}
        function yrUpdatePwRules(v){
            var r=yrCheckPassword(v);
            document.querySelectorAll('#password-rules li').forEach(function(li){
                var ok=r[li.dataset.rule];
                li.className='text-xs '+(ok?'text-green-600 font-medium':'text-slate-400');
                li.textContent=(ok?'✓ ':'• ')+li.dataset.label;
            });
        }
        (function(){var p=document.getElementById('new-password');if(p){p.addEventListener('input',function(){yrUpdatePwRules(p.value);});}})();

    </script>
</body>
</html>
